<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI Background Remover</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#101114;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:min(1100px,95vw);
    background:#191b20;
    border:1px solid #30333b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 70px #0008;
}

h1{
    margin:0 0 6px;
    font-size:28px;
}

.sub{
    color:#9da1aa;
    margin-bottom:20px;
}

.top{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button,
.fileLabel{
    border:0;
    border-radius:10px;
    padding:12px 17px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:#292d35;
    color:white;
}

button:hover,
.fileLabel:hover{
    background:#383d48;
}

.primary{
    background:#635bff;
}

.primary:hover{
    background:#756eff;
}

.danger{
    background:#b83232;
}

.green{
    background:#20884b;
}

input[type=file]{
    display:none;
}

.editor{
    position:relative;
    width:100%;
    min-height:450px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    border-radius:15px;
    border:1px solid #343740;

    background-color:#ddd;
    background-image:
        linear-gradient(45deg,#bbb 25%,transparent 25%),
        linear-gradient(-45deg,#bbb 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#bbb 75%),
        linear-gradient(-45deg,transparent 75%,#bbb 75%);
    background-size:30px 30px;
    background-position:0 0,0 15px,15px -15px,-15px 0;
}

#canvas{
    max-width:100%;
    max-height:650px;
    display:none;
    cursor:crosshair;
}

.empty{
    color:#555;
    background:#ffffffaa;
    padding:20px;
    border-radius:12px;
    font-weight:bold;
}

.controls{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    margin-top:18px;
}

.controls label{
    color:#bbb;
}

#size{
    width:180px;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#111318;
    color:#aaa;
}

.progress{
    width:100%;
    height:7px;
    background:#292c33;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.bar{
    width:0%;
    height:100%;
    background:#635bff;
    transition:.2s;
}

.info{
    margin-top:12px;
    color:#888;
    font-size:13px;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="app">

    <h1>✂️ AI Background Remover</h1>
    <div class="sub">
        Usuń tło ze zdjęcia AI i pobierz gotowy PNG.
    </div>

    <div class="top">

        <label class="fileLabel primary">
            📁 Wybierz zdjęcie
            <input id="file" type="file" accept="image/*">
        </label>

        <button id="aiBtn">
            🤖 Usuń tło AI
        </button>

        <button id="undoBtn">
            ↶ Cofnij
        </button>

        <button id="resetBtn">
            ↻ Reset
        </button>

        <button id="downloadBtn" class="green">
            ⬇ Pobierz PNG
        </button>

    </div>

    <div class="editor">

        <div id="empty" class="empty">
            Wybierz zdjęcie
        </div>

        <canvas id="canvas"></canvas>

    </div>

    <div class="controls">

        <button id="removeMode" class="danger">
            🖌 Usuń zaznaczenie
        </button>

        <button id="restoreMode">
            🖌 Przywróć
        </button>

        <label>
            Rozmiar pędzla:
            <input id="size" type="range" min="5" max="300" value="80">
        </label>

    </div>

    <div class="status" id="status">
        Gotowe.
        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>
    </div>

    <div class="info">
        AI działa lokalnie w przeglądarce. Przy pierwszym użyciu model AI może chwilę się pobierać.
    </div>

</div>


<script type="module">

import removeBackground from
"https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


const fileInput = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently:true
});

const empty = document.getElementById("empty");
const status = document.getElementById("status");
const bar = document.getElementById("bar");

const aiBtn = document.getElementById("aiBtn");
const undoBtn = document.getElementById("undoBtn");
const resetBtn = document.getElementById("resetBtn");
const downloadBtn = document.getElementById("downloadBtn");

const removeMode = document.getElementById("removeMode");
const restoreMode = document.getElementById("restoreMode");

const brushSize = document.getElementById("size");


let originalImage = null;
let originalData = null;

let history = [];

let mode = "remove";

let drawing = false;


/* =========================
   STATUS
========================= */

function setStatus(text, progress=null){

    status.childNodes[0].nodeValue = text;

    if(progress !== null){
        bar.style.width = progress + "%";
    }
}


/* =========================
   LOAD IMAGE
========================= */

fileInput.addEventListener("change", async e => {

    const file = e.target.files[0];

    if(!file) return;

    const url = URL.createObjectURL(file);

    const img = new Image();

    img.onload = () => {

        originalImage = img;

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0
        );

        originalData = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

        history = [];

        canvas.style.display = "block";
        empty.classList.add("hidden");

        setStatus(
            "Zdjęcie załadowane.",
            0
        );

    };

    img.src = url;

});


/* =========================
   SAVE HISTORY
========================= */

function saveHistory(){

    history.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );

    if(history.length > 10){
        history.shift();
    }

}


/* =========================
   UNDO
========================= */

undoBtn.addEventListener("click", () => {

    if(history.length === 0){
        setStatus("Nie ma czego cofnąć.",0);
        return;
    }

    const data = history.pop();

    ctx.putImageData(data,0,0);

    setStatus("Cofnięto.",0);

});


/* =========================
   RESET
========================= */

resetBtn.addEventListener("click", () => {

    if(!originalData){
        setStatus("Najpierw wybierz zdjęcie.",0);
        return;
    }

    saveHistory();

    ctx.putImageData(
        originalData,
        0,
        0
    );

    setStatus(
        "Przywrócono oryginalne zdjęcie.",
        0
    );

});


/* =========================
   AI BACKGROUND REMOVAL
========================= */

aiBtn.addEventListener("click", async () => {

    if(!originalImage){

        setStatus(
            "Najpierw wybierz zdjęcie.",
            0
        );

        return;
    }

    try{

        aiBtn.disabled = true;

        setStatus(
            "🤖 Uruchamiam AI...",
            5
        );

        const blob = await removeBackground(
            originalImage,
            {
                output:{
                    format:"image/png"
                },

                progress:(key,current,total)=>{

                    const percent =
                        Math.round(
                            current / total * 100
                        );

                    setStatus(
                        "🤖 AI: " + key,
                        percent
                    );

                }
            }
        );

        const url =
            URL.createObjectURL(blob);

        const img =
            new Image();

        img.onload = () => {

            saveHistory();

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );

            URL.revokeObjectURL(url);

            setStatus(
                "✅ Tło zostało usunięte!",
                100
            );

            aiBtn.disabled = false;

        };

        img.src = url;

    }catch(error){

        console.error(error);

        setStatus(
            "❌ Błąd AI: " + error.message,
            0
        );

        aiBtn.disabled = false;

    }

});


/* =========================
   MODES
========================= */

removeMode.addEventListener("click", () => {

    mode = "remove";

    removeMode.classList.add("primary");
    restoreMode.classList.remove("primary");

    setStatus(
        "Tryb: usuwanie fragmentów.",
        0
    );

});


restoreMode.addEventListener("click", () => {

    mode = "restore";

    restoreMode.classList.add("primary");
    removeMode.classList.remove("primary");

    setStatus(
        "Tryb: przywracanie fragmentów.",
        0
    );

});


/* =========================
   BRUSH
========================= */

function getPosition(e){

    const rect =
        canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    return {

        x:(e.clientX - rect.left) * scaleX,

        y:(e.clientY - rect.top) * scaleY

    };

}


function drawBrush(x,y){

    const size =
        Number(brushSize.value);

    if(mode === "remove"){

        ctx.save();

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }else{

        /*
         * Przywracanie pobiera piksele
         * z oryginalnego zdjęcia.
         */

        const radius = size / 2;

        const sx =
            Math.max(
                0,
                Math.floor(x-radius)
            );

        const sy =
            Math.max(
                0,
                Math.floor(y-radius)
            );

        const ex =
            Math.min(
                canvas.width,
                Math.ceil(x+radius)
            );

        const ey =
            Math.min(
                canvas.height,
                Math.ceil(y+radius)
            );

        const w = ex-sx;
        const h = ey-sy;

        const original =
            originalImageData(
                sx,
                sy,
                w,
                h
            );

        const current =
            ctx.getImageData(
                sx,
                sy,
                w,
                h
            );

        for(let py=0;py<h;py++){

            for(let px=0;px<w;px++){

                const dx =
                    px + sx - x;

                const dy =
                    py + sy - y;

                if(
                    dx*dx + dy*dy
                    <= radius*radius
                ){

                    const i =
                        (py*w+px)*4;

                    current.data[i] =
                        original.data[i];

                    current.data[i+1] =
                        original.data[i+1];

                    current.data[i+2] =
                        original.data[i+2];

                    current.data[i+3] =
                        original.data[i+3];

                }

            }

        }

        ctx.putImageData(
            current,
            sx,
            sy
        );

    }

}


function originalImageData(
    x,
    y,
    w,
    h
){

    /*
     * originalData jest pełnym
     * ImageData oryginalnego zdjęcia.
     */

    const result =
        new ImageData(w,h);

    for(let py=0;py<h;py++){

        for(let px=0;px<w;px++){

            const src =
                (
                    (y+py)
                    * canvas.width
                    +
                    (x+px)
                ) * 4;

            const dst =
                (py*w+px)*4;

            result.data[dst] =
                originalData.data[src];

            result.data[dst+1] =
                originalData.data[src+1];

            result.data[dst+2] =
                originalData.data[src+2];

            result.data[dst+3] =
                originalData.data[src+3];

        }

    }

    return result;

}


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        drawing = true;

        canvas.setPointerCapture(
            e.pointerId
        );

        saveHistory();

        const p =
            getPosition(e);

        drawBrush(
            p.x,
            p.y
        );

    }
);


canvas.addEventListener(
    "pointermove",
    e => {

        if(!drawing) return;

        const p =
            getPosition(e);

        drawBrush(
            p.x,
            p.y
        );

    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        drawing = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        drawing = false;

    }
);


/* =========================
   DOWNLOAD PNG
========================= */

downloadBtn.addEventListener("click", () => {

    if(!originalImage){

        setStatus(
            "Najpierw wybierz zdjęcie.",
            0
        );

        return;

    }

    canvas.toBlob(
        blob => {

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                "usuniete-tlo.png";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

            setStatus(
                "✅ PNG został pobrany.",
                100
            );

        },
        "image/png"
    );

});


/* =========================
   START
========================= */

setStatus(
    "Gotowe. Wybierz zdjęcie.",
    0
);

</script>

</body>
</html>
