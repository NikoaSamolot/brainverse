<body>


<div class="app">


    <h1>
        ✂️ AI Background Remover
    </h1>


    <div class="subtitle">

        Usuń tło ze zdjęcia AI,
        popraw wynik ręcznie
        i pobierz PNG.

    </div>


    <!-- =================================
         BUTTONS
    ================================== -->

    <div class="buttons">


        <label class="fileButton">

            📁 Wybierz zdjęcie

            <input
                id="fileInput"
                type="file"
                accept="image/*"
            >

        </label>


        <button id="aiButton">

            🤖 Usuń tło AI

        </button>


        <button id="removeButton">

            🖌 Usuń ręcznie

        </button>


        <button id="restoreButton">

            🖌 Przywróć

        </button>


        <button id="undoButton">

            ↩ Cofnij

        </button>


        <button id="resetButton">

            ↻ Reset

        </button>


        <button id="downloadButton">

            ⬇ Pobierz PNG

        </button>


    </div>


    <!-- =================================
         EDITOR
    ================================== -->

    <div class="editor">


        <div
            id="placeholder"
            class="placeholder"
        >

            Najpierw wybierz zdjęcie

        </div>


        <canvas id="canvas"></canvas>


    </div>


    <!-- =================================
         BRUSH
    ================================== -->

    <div class="tools">


        <span>
            Rozmiar pędzla:
        </span>


        <input
            id="brush"
            type="range"
            min="5"
            max="300"
            value="80"
        >


        <span id="brushValue">
            80 px
        </span>


    </div>


    <!-- =================================
         STATUS
    ================================== -->

    <div class="status">


        <span id="statusText">
            Gotowe. Wybierz zdjęcie.
        </span>


        <div class="progress">

            <div
                id="progressBar"
                class="progressBar"
            ></div>

        </div>


    </div>


</div>


<script>


/* =====================================================
   ELEMENTY
===================================================== */

const fileInput =
    document.getElementById(
        "fileInput"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


const placeholder =
    document.getElementById(
        "placeholder"
    );


const aiButton =
    document.getElementById(
        "aiButton"
    );


const removeButton =
    document.getElementById(
        "removeButton"
    );


const restoreButton =
    document.getElementById(
        "restoreButton"
    );


const undoButton =
    document.getElementById(
        "undoButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const brush =
    document.getElementById(
        "brush"
    );


const brushValue =
    document.getElementById(
        "brushValue"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


/* =====================================================
   ZMIENNE
===================================================== */

let originalImage = null;

let originalPixels = null;

let history = [];

let mode = "remove";

let drawing = false;

let aiFunction = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    progress = 0
){

    statusText.textContent =
        text;

    progressBar.style.width =
        progress + "%";

}


/* =====================================================
   WCZYTYWANIE ZDJĘCIA
===================================================== */

fileInput.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(
            !file.type ||
            !file.type.startsWith("image/")
        ){

            setStatus(
                "❌ Wybrany plik nie jest obrazem.",
                0
            );

            return;

        }


        setStatus(
            "⏳ Wczytywanie zdjęcia...",
            20
        );


        const reader =
            new FileReader();


        reader.onload =
            function(){

                const img =
                    new Image();


                img.onload =
                    function(){

                        originalImage =
                            img;


                        canvas.width =
                            img.naturalWidth;

                        canvas.height =
                            img.naturalHeight;


                        ctx.clearRect(
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                        ctx.globalCompositeOperation =
                            "source-over";


                        ctx.drawImage(
                            img,
                            0,
                            0
                        );


                        /*
                           Zapamiętujemy oryginał.
                        */

                        originalPixels =
                            ctx.getImageData(
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                        history = [];


                        canvas.style.display =
                            "block";


                        placeholder.style.display =
                            "none";


                        setStatus(
                            "✅ Zdjęcie załadowane.",
                            100
                        );

                    };


                img.onerror =
                    function(){

                        setStatus(
                            "❌ Nie udało się otworzyć zdjęcia.",
                            0
                        );

                    };


                img.src =
                    reader.result;

            };


        reader.onerror =
            function(){

                setStatus(
                    "❌ Błąd odczytu pliku.",
                    0
                );

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =====================================================
   HISTORIA
===================================================== */

function saveHistory(){

    if(
        !canvas.width ||
        !canvas.height
    ){

        return;

    }


    history.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );


    /*
       Maksymalnie 20 cofnięć.
    */

    if(
        history.length > 20
    ){

        history.shift();

    }

}


/* =====================================================
   UNDO
===================================================== */

undoButton.addEventListener(
    "click",
    function(){

        if(
            history.length === 0
        ){

            setStatus(
                "Nie ma czego cofnąć.",
                0
            );

            return;

        }


        const previous =
            history.pop();


        ctx.globalCompositeOperation =
            "source-over";


        ctx.putImageData(
            previous,
            0,
            0
        );


        setStatus(
            "↩ Cofnięto.",
            100
        );

    }
);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    function(){

        if(!originalPixels){

            setStatus(
                "Najpierw wybierz zdjęcie.",
                0
            );

            return;

        }


        saveHistory();


        ctx.globalCompositeOperation =
            "source-over";


        ctx.putImageData(
            originalPixels,
            0,
            0
        );


        setStatus(
            "↻ Przywrócono oryginał.",
            100
        );

    }
);


/* =====================================================
   TRYB USUWANIA
===================================================== */

removeButton.addEventListener(
    "click",
    function(){

        mode =
            "remove";


        removeButton.style.outline =
            "2px solid white";


        restoreButton.style.outline =
            "none";


        setStatus(
            "🖌 Usuwanie: maluj po fragmencie, który chcesz usunąć.",
            100
        );

    }
);


/* =====================================================
   TRYB PRZYWRACANIA
===================================================== */

restoreButton.addEventListener(
    "click",
    function(){

        mode =
            "restore";


        restoreButton.style.outline =
            "none";


        restoreButton.style.outline =
            "2px solid white";


        setStatus(
            "🖌 Przywracanie: maluj po fragmencie, który chcesz odzyskać.",
            100
        );

    }
);


/* =====================================================
   BRUSH SIZE
===================================================== */

brush.addEventListener(
    "input",
    function(){

        brushValue.textContent =
            this.value + " px";

    }
);


/* =====================================================
   POZYCJA NA CANVAS
===================================================== */

function getCanvasPosition(
    event
){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (
                event.clientX -
                rect.left
            )
            *
            canvas.width /
            rect.width,


        y:
            (
                event.clientY -
                rect.top
            )
            *
            canvas.height /
            rect.height

    };

}


/* =====================================================
   MALOWANIE
===================================================== */

function paint(
    x,
    y
){

    const size =
        Number(
            brush.value
        );


    const radius =
        size / 2;


    /* ================================================
       USUWANIE
    ================================================= */

    if(
        mode === "remove"
    ){

        ctx.save();


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();


        return;

    }


    /* ================================================
       PRZYWRACANIE
    ================================================= */

    if(
        !originalPixels
    ){

        return;

    }


    const left =
        Math.max(
            0,
            Math.floor(
                x - radius
            )
        );


    const top =
        Math.max(
            0,
            Math.floor(
                y - radius
            )
        );


    const right =
        Math.min(
            canvas.width,
            Math.ceil(
                x + radius
            )
        );


    const bottom =
        Math.min(
            canvas.height,
            Math.ceil(
                y + radius
            )
        );


    const width =
        right - left;


    const height =
        bottom - top;


    const current =
        ctx.getImageData(
            left,
            top,
            width,
            height
        );


    for(
        let py = 0;
        py < height;
        py++
    ){

        for(
            let px = 0;
            px < width;
            px++
        ){

            const dx =
                left +
                px -
                x;


            const dy =
                top +
                py -
                y;


            if(
                dx * dx +
                dy * dy
                <=
                radius * radius
            ){

                const target =
                    (
                        py *
                        width +
                        px
                    ) * 4;


                const source =
                    (
                        (
                            top + py
                        )
                        *
                        canvas.width
                        +
                        (
                            left + px
                        )
                    )
                    * 4;


                current.data[
                    target
                ] =
                    originalPixels.data[
                        source
                    ];


                current.data[
                    target + 1
                ] =
                    originalPixels.data[
                        source + 1
                    ];


                current.data[
                    target + 2
                ] =
                    originalPixels.data[
                        source + 2
                    ];


                current.data[
                    target + 3
                ] =
                    originalPixels.data[
                        source + 3
                    ];

            }

        }

    }


    ctx.putImageData(
        current,
        left,
        top
    );

}


/* =====================================================
   POINTER DOWN
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(event){

        drawing =
            true;


        canvas.setPointerCapture(
            event.pointerId
        );


        saveHistory();


        const p =
            getCanvasPosition(
                event
            );


        paint(
            p.x,
            p.y
        );

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(event){

        if(
            !drawing
        ){

            return;

        }


        const p =
            getCanvasPosition(
                event
            );


        paint(
            p.x,
            p.y
        );

    }
);


/* =====================================================
   POINTER UP
===================================================== */

canvas.addEventListener(
    "pointerup",
    function(){

        drawing =
            false;

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        drawing =
            false;

    }
);


/* =====================================================
   ŁADOWANIE AI
===================================================== */

async function loadAI(){

    if(
        typeof aiFunction ===
        "function"
    ){

        return aiFunction;

    }


    setStatus(
        "📦 Pobieranie silnika AI...",
        5
    );


    /*
       Używamy esm.sh zamiast jsDelivr.

       Import jest ignorowany przez bundlery,
       gdyby plik został później wrzucony
       do projektu.
    */

    const module =
        await import(
            "https://esm.sh/@imgly/background-removal@1.7.0"
        );


    /*
       Biblioteka posiada named export
       removeBackground.

       Dodatkowo sprawdzamy default,
       żeby obsłużyć różne sposoby
       zapakowania modułu.
    */

    if(
        typeof module.removeBackground ===
        "function"
    ){

        aiFunction =
            module.removeBackground;

    }
    else if(
        typeof module.default ===
        "function"
    ){

        aiFunction =
            module.default;

    }
    else{

        console.log(
            "Załadowany moduł AI:",
            module
        );


        throw new Error(
            "Biblioteka AI nie udostępnia funkcji removeBackground."
        );

    }


    return aiFunction;

}


/* =====================================================
   AI REMOVE BACKGROUND
===================================================== */

aiButton.addEventListener(
    "click",
    async function(){

        if(
            !originalImage
        ){

            setStatus(
                "❌ Najpierw wybierz zdjęcie.",
                0
            );

            return;

        }


        try{

            aiButton.disabled =
                true;


            /*
               Zapamiętaj stan przed AI.
            */

            saveHistory();


            /*
               Załaduj AI.
            */

            const removeBackground =
                await loadAI();


            setStatus(
                "🤖 AI analizuje zdjęcie...",
                15
            );


            /*
               Pobieramy aktualny canvas
               jako PNG Blob.
            */

            const inputBlob =
                await new Promise(
                    function(resolve){

                        canvas.toBlob(
                            resolve,
                            "image/png"
                        );

                    }
                );


            if(
                !inputBlob
            ){

                throw new Error(
                    "Nie udało się przygotować obrazu."
                );

            }


            /*
               Konfiguracja.
            */

            const config = {

                model:
                    "isnet",

                device:
                    "cpu",

                proxyToWorker:
                    false,

                output:{

                    format:
                        "image/png",

                    quality:
                        1

                },

                progress:
                    function(
                        key,
                        current,
                        total
                    ){

                        let percent =
                            0;


                        if(
                            total > 0
                        ){

                            percent =
                                Math.round(
                                    (
                                        current /
                                        total
                                    ) * 100
                                );

                        }


                        setStatus(
                            "🤖 " +
                            key,
                            percent
                        );

                    }

            };


            /*
               WŁAŚCIWE USUWANIE TŁA.
            */

            const result =
                await removeBackground(
                    inputBlob,
                    config
                );


            if(
                !result
            ){

                throw new Error(
                    "AI nie zwróciło wyniku."
                );

            }


            /*
               Wynik Blob -> Image.
            */

            const resultURL =
                URL.createObjectURL(
                    result
                );


            const resultImage =
                new Image();


            resultImage.onload =
                function(){

                    /*
                       Canvas może mieć dokładnie
                       ten sam rozmiar co oryginał.
                    */

                    ctx.globalCompositeOperation =
                        "source-over";


                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    ctx.drawImage(
                        resultImage,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    URL.revokeObjectURL(
                        resultURL
                    );


                    setStatus(
                        "✅ Tło zostało usunięte!",
                        100
                    );


                    aiButton.disabled =
                        false;

                };


            resultImage.onerror =
                function(){

                    URL.revokeObjectURL(
                        resultURL
                    );


                    aiButton.disabled =
                        false;


                    setStatus(
                        "❌ Nie udało się otworzyć wyniku AI.",
                        0
                    );

                };


            resultImage.src =
                resultURL;

        }
        catch(error){

            console.error(
                "BACKGROUND REMOVAL ERROR:",
                error
            );


            aiButton.disabled =
                false;


            setStatus(
                "❌ Błąd AI: " +
                (
                    error &&
                    error.message
                    ?
                    error.message
                    :
                    error
                ),
                0
            );

        }

    }
);


/* =====================================================
   DOWNLOAD PNG
===================================================== */

downloadButton.addEventListener(
    "click",
    function(){

        if(
            !canvas.width ||
            !canvas.height
        ){

            setStatus(
                "❌ Najpierw wybierz zdjęcie.",
                0
            );

            return;

        }


        canvas.toBlob(
            function(blob){

                if(
                    !blob
                ){

                    setStatus(
                        "❌ Nie udało się utworzyć PNG.",
                        0
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "usuniete-tlo.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url
                );


                setStatus(
                    "✅ PNG pobrany!",
                    100
                );

            },

            "image/png"

        );

    }
);


/* =====================================================
   START
===================================================== */

setStatus(
    "Gotowe. Wybierz zdjęcie.",
    0
);

</script>

</body>

</html>
