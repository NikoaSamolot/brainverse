<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Background Remover</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#101114;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;

}

    width:min(1100px,100%);

    margin:0 0 8px;
}

.fileButton{

.fileButton:hover{

    background-image:
        linear-gradient(45deg,#bbb 25%,transparent 25%),
        linear-gradient(-45deg,#bbb 25%,transparent 25%),

</head>

<body>

<div class="app">

    <h1>✂️ AI Background Remover</h1>

    <div class="subtitle">
        Wybierz zdjęcie, usuń tło AI i pobierz PNG.
    </div>


    <div class="buttons">

        <label class="fileButton">
            📁 Wybierz zdjęcie

            <input
                id="fileInput"
                type="file"
                accept="image/*"
            >
        </label>


        <button id="aiButton">
            🤖 Usuń tło AI
        </button>


        <button id="removeButton">
            🖌 Usuń ręcznie
        </button>


        <button id="restoreButton">
            🖌 Przywróć
        </button>


        <button id="undoButton">
            ↩ Cofnij
        </button>


        <button id="resetButton">
            ↻ Reset
        </button>


        <button id="downloadButton">
            ⬇ Pobierz PNG
        </button>

    </div>


    <div class="editor">

        <div
            id="placeholder"
            class="placeholder"
        >
            Najpierw wybierz zdjęcie
        </div>

        <canvas id="canvas"></canvas>

    </div>


    <div class="tools">

        <span>
            Rozmiar pędzla:
        </span>

        <input
            id="brush"
            type="range"
            min="5"
            max="300"
            value="80"
        >

        <span id="brushValue">
            80 px
        </span>

    </div>


    <div class="status">

        <span id="statusText">
            Gotowe.
        </span>

        <div class="progress">

            <div
                id="progressBar"
                class="progressBar"
            ></div>

        </div>

    </div>

</div>


<script>

const fileInput =
    document.getElementById("fileInput");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        willReadFrequently:true
    });

const placeholder =
    document.getElementById("placeholder");

const aiButton =
    document.getElementById("aiButton");

const removeButton =
    document.getElementById("removeButton");

const restoreButton =
    document.getElementById("restoreButton");

const undoButton =
    document.getElementById("undoButton");

const resetButton =
    document.getElementById("resetButton");

const downloadButton =
    document.getElementById("downloadButton");

const brush =
    document.getElementById("brush");

const brushValue =
    document.getElementById("brushValue");

const statusText =
    document.getElementById("statusText");

const progressBar =
    document.getElementById("progressBar");


let originalImage = null;

let originalPixels = null;

let history = [];

let mode = "remove";

let drawing = false;


/*
==================================================
STATUS
==================================================
*/

function status(text, progress){

    statusText.textContent = text;

    if(progress !== undefined){

        progressBar.style.width =
            progress + "%";

    }

}


/*
==================================================
WYBÓR PLIKU
==================================================
*/

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            return;

        }


        if(!file.type.startsWith("image/")){

            status(
                "❌ To nie jest plik graficzny.",
                0
            );

            return;

        }


        status(
            "⏳ Ładowanie zdjęcia...",
            20
        );


        const reader =
            new FileReader();


        reader.onload = function(event){

            const img =
                new Image();


            img.onload = function(){

                originalImage = img;


                canvas.width =
                    img.naturalWidth;

                canvas.height =
                    img.naturalHeight;


                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                ctx.drawImage(
                    img,
                    0,
                    0
                );


                originalPixels =
                    ctx.getImageData(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                history = [];


                canvas.style.display =
                    "block";

                placeholder.style.display =
                    "none";


                status(
                    "✅ Zdjęcie załadowane.",
                    100
                );

            };


            img.onerror = function(){

                status(
                    "❌ Nie udało się otworzyć zdjęcia.",
                    0
                );

            };


            img.src =
                event.target.result;

        };


        reader.onerror = function(){

            status(
                "❌ Nie udało się odczytać pliku.",
                0
            );

        };


        reader.readAsDataURL(file);

    }
);


/*
==================================================
HISTORIA
==================================================
*/

function saveHistory(){

    if(!canvas.width) return;


    history.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );


    if(history.length > 15){

        history.shift();

    }

}


/*
==================================================
COFANIE
==================================================
*/

undoButton.addEventListener(
    "click",
    function(){

        if(history.length === 0){

            status(
                "Brak zmian do cofnięcia.",
                0
            );

            return;

        }


        const imageData =
            history.pop();


        ctx.putImageData(
            imageData,
            0,
            0
        );


        status(
            "↩ Cofnięto.",
            100
        );

    }
);


/*
==================================================
RESET
==================================================
*/

resetButton.addEventListener(
    "click",
    function(){

        if(!originalPixels){

            status(
                "Najpierw wybierz zdjęcie.",
                0
            );

            return;

        }


        saveHistory();


        ctx.putImageData(
            originalPixels,
            0,
            0
        );


        status(
            "↻ Przywrócono oryginał.",
            100
        );

    }
);


/*
==================================================
TRYB USUWANIA
==================================================
*/

removeButton.addEventListener(
    "click",
    function(){

        mode = "remove";

        removeButton.style.outline =
            "2px solid white";

        restoreButton.style.outline =
            "none";


        status(
            "🖌 Tryb usuwania. Maluj po tym, co chcesz usunąć.",
            100
        );

    }
);


/*
==================================================
TRYB PRZYWRACANIA
==================================================
*/

restoreButton.addEventListener(
    "click",
    function(){

        mode = "restore";

        restoreButton.style.outline =
            "2px solid white";

        removeButton.style.outline =
            "none";


        status(
            "🖌 Tryb przywracania.",
            100
        );

    }
);


/*
==================================================
ROZMIAR PĘDZLA
==================================================
*/

brush.addEventListener(
    "input",
    function(){

        brushValue.textContent =
            this.value + " px";

    }
);


/*
==================================================
POZYCJA MYSZKI
==================================================
*/

function mousePosition(event){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (event.clientX - rect.left)
            *
            canvas.width /
            rect.width,

        y:
            (event.clientY - rect.top)
            *
            canvas.height /
            rect.height

    };

}


/*
==================================================
RYSOWANIE
==================================================
*/

function paint(x,y){

    const size =
        Number(brush.value);

    const radius =
        size / 2;


    if(mode === "remove"){

        ctx.save();


        ctx.globalCompositeOperation =
            "destination-out";


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

        return;

    }


    /*
    ==============================================
    PRZYWRACANIE ORYGINALNYCH PIKSELI
    ==============================================
    */

    if(!originalPixels) return;


    const left =
        Math.max(
            0,
            Math.floor(x-radius)
        );

    const top =
        Math.max(
            0,
            Math.floor(y-radius)
        );

    const right =
        Math.min(
            canvas.width,
            Math.ceil(x+radius)
        );

    const bottom =
        Math.min(
            canvas.height,
            Math.ceil(y+radius)
        );


    const width =
        right-left;

    const height =
        bottom-top;


    const current =
        ctx.getImageData(
            left,
            top,
            width,
            height
        );


    for(let py=0;py<height;py++){

        for(let px=0;px<width;px++){

            const dx =
                left + px - x;

            const dy =
                top + py - y;


            if(
                dx*dx + dy*dy
                <= radius*radius
            ){

                const local =
                    (py*width+px)*4;

                const original =
                    (
                        (top+py)
                        *
                        canvas.width
                        +
                        (left+px)
                    )
                    *4;


                current.data[local] =
                    originalPixels.data[original];

                current.data[local+1] =
                    originalPixels.data[original+1];

                current.data[local+2] =
                    originalPixels.data[original+2];

                current.data[local+3] =
                    originalPixels.data[original+3];

            }

        }

    }


    ctx.putImageData(
        current,
        left,
        top
    );

}


/*
==================================================
MYSZKA
==================================================
*/

canvas.addEventListener(
    "pointerdown",
    function(event){

        drawing = true;

        canvas.setPointerCapture(
            event.pointerId
        );


        saveHistory();


        const p =
            mousePosition(event);


        paint(
            p.x,
            p.y
        );

    }
);


canvas.addEventListener(
    "pointermove",
    function(event){

        if(!drawing) return;


        const p =
            mousePosition(event);


        paint(
            p.x,
            p.y
        );

    }
);


canvas.addEventListener(
    "pointerup",
    function(){

        drawing = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        drawing = false;

    }
);


/*
==================================================
AI
==================================================

WAŻNE:

Biblioteka nie jest ładowana przy starcie strony.

Dzięki temu wybieranie zdjęć działa nawet,
gdy CDN AI chwilowo nie odpowiada.
*/

aiButton.addEventListener(
    "click",
    async function(){

        if(!originalImage){

            status(
                "❌ Najpierw wybierz zdjęcie.",
                0
            );

            return;

        }


        try{

            aiButton.disabled = true;


            status(
                "🤖 Ładowanie AI...",
                5
            );


            /*
            Dynamiczny import.
            */

            const module =
                await import(
                    "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm"
                );


            const removeBackground =
                module.default;


            status(
                "🤖 AI analizuje zdjęcie...",
                15
            );


            /*
            Zamieniamy canvas na Blob.
            */

            const blob =
                await new Promise(
                    resolve =>
                        canvas.toBlob(
                            resolve,
                            "image/png"
                        )
                );


            if(!blob){

                throw new Error(
                    "Nie udało się przygotować zdjęcia."
                );

            }


            /*
            AI usuwa tło.
            */

            const result =
                await removeBackground(
                    blob,
                    {

                        model:"isnet",

                        output:{
                            format:"image/png"
                        },

                        progress:
                            function(
                                key,
                                current,
                                total
                            ){

                                let percent =
                                    Math.round(
                                        current /
                                        total *
                                        100
                                    );


                                status(
                                    "🤖 AI: "
                                    + key,
                                    percent
                                );

                            }

                    }
                );


            /*
            Wczytujemy wynik.
            */

            const resultURL =
                URL.createObjectURL(result);


            const resultImage =
                new Image();


            resultImage.onload =
                function(){

                    saveHistory();


                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    ctx.drawImage(
                        resultImage,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    URL.revokeObjectURL(
                        resultURL
                    );


                    status(
                        "✅ Gotowe! Tło usunięte.",
                        100
                    );


                    aiButton.disabled =
                        false;

                };


            resultImage.onerror =
                function(){

                    throw new Error(
                        "Nie udało się wyświetlić wyniku AI."
                    );

                };


            resultImage.src =
                resultURL;

        }
        catch(error){

            console.error(error);


            status(
                "❌ AI nie działa: "
                + error.message,
                0
            );


            aiButton.disabled =
                false;

        }

    }
);


/*
==================================================
POBIERANIE PNG
==================================================
*/

downloadButton.addEventListener(
    "click",
    function(){

        if(!canvas.width){

            status(
                "❌ Najpierw wybierz zdjęcie.",
                0
            );

            return;

        }


        canvas.toBlob(
            function(blob){

                if(!blob){

                    status(
                        "❌ Nie udało się utworzyć PNG.",
                        0
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                link.href =
                    url;


                link.download =
                    "usuniete-tlo.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url
                );


                status(
                    "✅ PNG pobrany.",
                    100
                );

            },

            "image/png"
        );

    }
);


/*
==================================================
START
==================================================
*/

status(
    "Gotowe. Wybierz zdjęcie.",
    0
);

</script>

</body>
</html>
```
