<title>Wyszukiwarka Stolic Państw</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #ddd;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #4facfe;
}

.results {
    margin-top: 20px;
}

.country {
    background: #f5f9ff;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 12px;
    border-left: 5px solid #4facfe;
    animation: show 0.2s;
}

.country h2 {
    margin: 0 0 8px;
    color: #333;
    font-size: 20px;
}

.capital {
    color: #555;
    font-size: 16px;
}

.no-results {
    text-align: center;
    color: #777;
    margin-top: 20px;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:400px){
    .container {
        padding: 18px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>
</head>

<div class="subtitle">

const search = document.getElementById("search");
const results = document.getElementById("results");


function showResults(){

let text = search.value.toLowerCase().trim();

results.innerHTML="";

if(text===""){
    return;
}


let found = countries.filter(item =>
item.country.toLowerCase().includes(text)
);


if(found.length===0){
    results.innerHTML =
    `<div class="no-results">
    Nie znaleziono państwa 😢
    </div>`;
    return;
}


found.forEach(item=>{

let capitals = item.capital.join(", ");

results.innerHTML += `
<div class="country">
<h2>${item.country}</h2>
<div class="capital">
🏛️ Stolica: ${capitals}
</div>
</div>
`;

});

}


search.addEventListener("input", showResults);
