<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMAGE → 3D MODEL</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
}

#ui {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 310px;
    background: rgba(15, 15, 15, 0.92);
    border: 1px solid #333;
    border-radius: 14px;
    padding: 16px;
    z-index: 10;
    backdrop-filter: blur(10px);
}

h1 {
    font-size: 19px;
    margin: 0 0 15px;
}

label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-top: 13px;
    margin-bottom: 5px;
}

input[type=file] {
    width: 100%;
    color: white;
    font-size: 12px;
}

input[type=range] {
    width: 100%;
}

button {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 11px;
    margin-top: 10px;
    background: #ffffff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

#status {
    margin-top: 12px;
    font-size: 12px;
    color: #aaa;
    line-height: 1.4;
}

#drop {
    border: 2px dashed #444;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    color: #999;
    transition: 0.2s;
}

#drop.drag {
    border-color: white;
    color: white;
    background: rgba(255,255,255,0.05);
}

#info {
    position: absolute;
    right: 15px;
    bottom: 15px;
    background: rgba(0,0,0,.65);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 11px;
    color: #aaa;
    z-index: 5;
}

.value {
    float: right;
    color: white;
}
</style>
</head>

<body>

<div id="app">

    <div id="ui">

        <h1>IMAGE → 3D MODEL</h1>

        <input
            id="file"
            type="file"
            accept="image/*"
        >

        <div id="drop">
            Przeciągnij tutaj zdjęcie
        </div>

        <label>
            Głębokość
            <span class="value" id="depthValue">2.0</span>
        </label>

        <input
            id="depth"
            type="range"
            min="0"
            max="8"
            step="0.1"
            value="2"
        >

        <label>
            Rozdzielczość siatki
            <span class="value" id="resValue">100</span>
        </label>

        <input
            id="resolution"
            type="range"
            min="20"
            max="180"
            step="10"
            value="100"
        >

        <label>
            Wygładzenie
            <span class="value" id="smoothValue">1</span>
        </label>

        <input
            id="smooth"
            type="range"
            min="0"
            max="3"
            step="1"
            value="1"
        >

        <button id="generate">
            GENERUJ MODEL 3D
        </button>

        <button id="reset">
            RESET KAMERY
        </button>

        <button id="wireframe">
            SIATKA: OFF
        </button>

        <div id="status">
            Wybierz zdjęcie, a następnie kliknij „GENERUJ MODEL 3D”.
        </div>

    </div>

    <div id="info">
        LPM — obrót &nbsp; | &nbsp;
        PPM — przesuwanie &nbsp; | &nbsp;
        Scroll — zoom
    </div>

</div>


<script type="module">

/*
=========================================================
 THREE.JS
=========================================================
*/

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


/*
=========================================================
 ZMIENNE
=========================================================
*/

let scene;
let camera;
let renderer;
let controls;

let model = null;
let texture = null;
let image = null;

let depthAmount = 2;
let resolution = 100;
let smooth = 1;

let wireframe = false;


/*
=========================================================
 ELEMENTY UI
=========================================================
*/

const fileInput =
    document.getElementById("file");

const drop =
    document.getElementById("drop");

const generateButton =
    document.getElementById("generate");

const resetButton =
    document.getElementById("reset");

const wireframeButton =
    document.getElementById("wireframe");


/*
=========================================================
 STATUS
=========================================================
*/

function setStatus(text) {

    document.getElementById("status").textContent = text;
}


/*
=========================================================
 INIT
=========================================================
*/

function init() {

    /*
    SCENE
    */

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x080808);


    /*
    CAMERA
    */

    camera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            0.01,
            1000
        );

    camera.position.set(
        0,
        0,
        6
    );


    /*
    RENDERER
    */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.shadowMap.enabled = true;


    document
        .getElementById("app")
        .appendChild(
            renderer.domElement
        );


    /*
    ORBIT CONTROLS
    */

    controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.minDistance = 0.5;

    controls.maxDistance = 50;

    controls.enablePan = true;


    /*
    ŚWIATŁO
    */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.8
        );

    scene.add(ambient);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    light.position.set(
        4,
        6,
        8
    );

    light.castShadow = true;

    scene.add(light);


    const light2 =
        new THREE.DirectionalLight(
            0xffffff,
            1
        );

    light2.position.set(
        -5,
        -3,
        -5
    );

    scene.add(light2);


    /*
    GRID
    */

    const grid =
        new THREE.GridHelper(
            20,
            20,
            0x333333,
            0x181818
        );

    grid.position.y = -3;

    scene.add(grid);


    /*
    RESIZE
    */

    window.addEventListener(
        "resize",
        resize
    );


    /*
    START ANIMATION
    */

    animate();
}


/*
=========================================================
 RESIZE
=========================================================
*/

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/*
=========================================================
 FILE INPUT
=========================================================
*/

fileInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {

            setStatus(
                "Wybrany plik nie jest obrazem."
            );

            return;
        }

        loadImage(file);
    }
);


/*
=========================================================
 DRAG OVER
=========================================================
*/

drop.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        drop.classList.add("drag");
    }
);


/*
=========================================================
 DRAG LEAVE
=========================================================
*/

drop.addEventListener(
    "dragleave",
    function() {

        drop.classList.remove("drag");
    }
);


/*
=========================================================
 DROP
=========================================================
*/

drop.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        drop.classList.remove("drag");

        const file =
            event.dataTransfer.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {

            setStatus(
                "To nie jest plik graficzny."
            );

            return;
        }

        loadImage(file);
    }
);


/*
=========================================================
 LOAD IMAGE
=========================================================
*/

function loadImage(file) {

    setStatus(
        "Ładowanie zdjęcia..."
    );

    const reader =
        new FileReader();

    reader.onload =
        function(event) {

            const newImage =
                new Image();

            newImage.onload =
                function() {

                    image = newImage;

                    setStatus(
                        "Zdjęcie załadowane. " +
                        "Gotowe do generowania."
                    );
                };

            newImage.onerror =
                function() {

                    setStatus(
                        "Nie udało się odczytać zdjęcia."
                    );
                };

            newImage.src =
                event.target.result;
        };

    reader.onerror =
        function() {

            setStatus(
                "Błąd podczas odczytu pliku."
            );
        };

    reader.readAsDataURL(file);
}


/*
=========================================================
 GENERATE BUTTON
=========================================================
*/

generateButton.addEventListener(
    "click",
    generateModel
);


/*
=========================================================
 GENERATE MODEL
=========================================================
*/

function generateModel() {

    if (!image) {

        setStatus(
            "Najpierw wybierz zdjęcie."
        );

        return;
    }


    setStatus(
        "Generowanie modelu 3D..."
    );


    /*
    USUWANIE STAREGO MODELU
    */

    if (model) {

        scene.remove(model);

        if (model.geometry) {
            model.geometry.dispose();
        }

        if (model.material) {

            if (model.material.map) {
                model.material.map.dispose();
            }

            model.material.dispose();
        }

        model = null;
    }


    /*
    CANVAS
    */

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    if (!ctx) {

        setStatus(
            "Przeglądarka nie obsługuje Canvas 2D."
        );

        return;
    }


    /*
    PROPORCJE
    */

    const aspect =
        image.width /
        image.height;


    let width =
        resolution;

    let height =
        Math.round(
            resolution /
            aspect
        );


    height =
        Math.max(
            2,
            height
        );


    canvas.width =
        width;

    canvas.height =
        height;


    /*
    RYSOWANIE OBRAZU
    */

    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    /*
    PIKSELE
    */

    let pixels;

    try {

        pixels =
            ctx.getImageData(
                0,
                0,
                width,
                height
            ).data;

    } catch (error) {

        console.error(error);

        setStatus(
            "Nie można odczytać pikseli obrazu."
        );

        return;
    }


    /*
    TEXTURE
    */

    if (texture) {
        texture.dispose();
    }


    texture =
        new THREE.Texture(image);

    texture.needsUpdate = true;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.minFilter =
        THREE.LinearFilter;

    texture.magFilter =
        THREE.LinearFilter;

    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;


    /*
    VERTICES
    */

    const vertices = [];

    const uvs = [];

    const indices = [];


    const modelWidth = 5;

    const modelHeight =
        modelWidth /
        aspect;


    /*
    BRIGHTNESS
    */

    function getBrightness(x, y) {

        const index =
            (y * width + x) * 4;

        const r =
            pixels[index];

        const g =
            pixels[index + 1];

        const b =
            pixels[index + 2];

        return (
            0.299 * r +
            0.587 * g +
            0.114 * b
        ) / 255;
    }


    /*
    WYGŁADZANIE
    */

    function getSmoothedBrightness(x, y) {

        if (smooth <= 0) {

            return getBrightness(
                x,
                y
            );
        }


        let total = 0;

        let count = 0;


        for (
            let sy = -smooth;
            sy <= smooth;
            sy++
        ) {

            for (
                let sx = -smooth;
                sx <= smooth;
                sx++
            ) {

                const nx =
                    Math.max(
                        0,
                        Math.min(
                            width - 1,
                            x + sx
                        )
                    );

                const ny =
                    Math.max(
                        0,
                        Math.min(
                            height - 1,
                            y + sy
                        )
                    );

                total +=
                    getBrightness(
                        nx,
                        ny
                    );

                count++;
            }
        }


        return total / count;
    }


    /*
    TWORZENIE WIERZCHOŁKÓW
    */

    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const px =
                x /
                (width - 1);

            const py =
                y /
                (height - 1);


            /*
            POZYCJA X
            */

            const worldX =
                (px - 0.5) *
                modelWidth;


            /*
            POZYCJA Y
            */

            const worldY =
                (0.5 - py) *
                modelHeight;


            /*
            JASNOŚĆ
            */

            const brightness =
                getSmoothedBrightness(
                    x,
                    y
                );


            /*
            GŁĘBOKOŚĆ

            Jasne = dalej
            Ciemne = bliżej
            */

            const z =
                (brightness - 0.5) *
                depthAmount;


            vertices.push(
                worldX,
                worldY,
                z
            );


            /*
            UV
            */

            uvs.push(
                px,
                1 - py
            );
        }
    }


    /*
    TRIANGLES
    */

    for (
        let y = 0;
        y < height - 1;
        y++
    ) {

        for (
            let x = 0;
            x < width - 1;
            x++
        ) {

            const a =
                y * width + x;

            const b =
                y * width + x + 1;

            const c =
                (y + 1) * width + x;

            const d =
                (y + 1) * width + x + 1;


            indices.push(
                a,
                c,
                b
            );

            indices.push(
                b,
                c,
                d
            );
        }
    }


    /*
    GEOMETRY
    */

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );


    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );


    geometry.setIndex(
        indices
    );


    geometry.computeVertexNormals();

    geometry.computeBoundingSphere();


    /*
    MATERIAL
    */

    const material =
        new THREE.MeshStandardMaterial({

            map: texture,

            side: THREE.DoubleSide,

            roughness: 0.75,

            metalness: 0,

            wireframe: wireframe
        });


    /*
    MODEL
    */

    model =
        new THREE.Mesh(
            geometry,
            material
        );


    model.position.set(
        0,
        0,
        0
    );


    model.rotation.set(
        0,
        0,
        0
    );


    model.castShadow = true;

    model.receiveShadow = true;


    scene.add(model);


    /*
    KAMERA
    */

    camera.position.set(
        0,
        0,
        6
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();


    /*
    STATUS
    */

    setStatus(
        "Model 3D wygenerowany. " +
        "Obracaj go myszką."
    );
}


/*
=========================================================
 DEPTH
=========================================================
*/

document
    .getElementById("depth")
    .addEventListener(
        "input",
        function() {

            depthAmount =
                parseFloat(
                    this.value
                );

            document
                .getElementById(
                    "depthValue"
                )
                .textContent =
                depthAmount.toFixed(1);
        }
    );


/*
=========================================================
 RESOLUTION
=========================================================
*/

document
    .getElementById("resolution")
    .addEventListener(
        "input",
        function() {

            resolution =
                parseInt(
                    this.value,
                    10
                );

            document
                .getElementById(
                    "resValue"
                )
                .textContent =
                resolution;
        }
    );


/*
=========================================================
 SMOOTH
=========================================================
*/

document
    .getElementById("smooth")
    .addEventListener(
        "input",
        function() {

            smooth =
                parseInt(
                    this.value,
                    10
                );

            document
                .getElementById(
                    "smoothValue"
                )
                .textContent =
                smooth;
        }
    );


/*
=========================================================
 WIREFRAME
=========================================================
*/

wireframeButton.addEventListener(
    "click",
    function() {

        wireframe =
            !wireframe;


        this.textContent =
            wireframe
                ? "SIATKA: ON"
                : "SIATKA: OFF";


        if (model) {

            model.material.wireframe =
                wireframe;

            model.material.needsUpdate =
                true;
        }
    }
);


/*
=========================================================
 RESET CAMERA
=========================================================
*/

resetButton.addEventListener(
    "click",
    function() {

        camera.position.set(
            0,
            0,
            6
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();
    }
);


/*
=========================================================
 ANIMATION
=========================================================
*/

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/*
=========================================================
 START
=========================================================
*/

init();

</script>

</body>
</html>
