<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMAGE → 3D MODEL</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
}

#ui {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 310px;
    background: rgba(15,15,15,.92);
    border: 1px solid #333;
    border-radius: 14px;
    padding: 16px;
    z-index: 10;
    backdrop-filter: blur(10px);
}

h1 {
    font-size: 19px;
    margin: 0 0 15px;
}

label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-top: 13px;
    margin-bottom: 5px;
}

input[type=file] {
    width: 100%;
    color: white;
    font-size: 12px;
}

input[type=range] {
    width: 100%;
}

button {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 11px;
    margin-top: 10px;
    background: #ffffff;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

#status {
    margin-top: 12px;
    font-size: 12px;
    color: #aaa;
    line-height: 1.4;
}

#drop {
    border: 2px dashed #444;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    color: #999;
}

#drop.drag {
    border-color: white;
    color: white;
}

#info {
    position: absolute;
    right: 15px;
    bottom: 15px;
    background: rgba(0,0,0,.65);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 11px;
    color: #aaa;
}

.value {
    float: right;
    color: white;
}
</style>
</head>

<body>

<div id="app">

    <div id="ui">

        <h1>IMAGE → 3D MODEL</h1>

        <input id="file" type="file" accept="image/*">

        <div id="drop">
            Przeciągnij tutaj zdjęcie
        </div>

        <label>
            Głębokość
            <span class="value" id="depthValue">2.0</span>
        </label>

        <input
            id="depth"
            type="range"
            min="0"
            max="8"
            step="0.1"
            value="2"
        >

        <label>
            Rozdzielczość siatki
            <span class="value" id="resValue">100</span>
        </label>

        <input
            id="resolution"
            type="range"
            min="20"
            max="180"
            step="10"
            value="100"
        >

        <label>
            Wygładzenie
            <span class="value" id="smoothValue">1</span>
        </label>

        <input
            id="smooth"
            type="range"
            min="0"
            max="3"
            step="1"
            value="1"
        >

        <button id="generate">
            GENERUJ MODEL 3D
        </button>

        <button id="reset">
            RESET KAMERY
        </button>

        <button id="wireframe">
            SIATKA: OFF
        </button>

        <div id="status">
            Wybierz zdjęcie, a następnie kliknij „GENERUJ MODEL 3D”.
        </div>

    </div>

    <div id="info">
        LPM — obrót &nbsp; | &nbsp;
        PPM — przesuwanie &nbsp; | &nbsp;
        Scroll — zoom
    </div>

</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- ORBIT CONTROLS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

let scene;
let camera;
let renderer;
let controls;

let model = null;
let texture = null;

let image = null;

let depthAmount = 2;
let resolution = 100;
let smooth = 1;

let wireframe = false;


/* =========================================================
   INIT
========================================================= */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x080808);


    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
    );

    camera.position.set(
        0,
        0,
        6
    );


    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document
        .getElementById("app")
        .appendChild(renderer.domElement);


    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.minDistance = 0.5;

    controls.maxDistance = 50;


    /* ŚWIATŁO */

    const ambient = new THREE.AmbientLight(
        0xffffff,
        1.8
    );

    scene.add(ambient);


    const light = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    light.position.set(
        4,
        6,
        8
    );

    scene.add(light);


    const light2 = new THREE.DirectionalLight(
        0xffffff,
        1
    );

    light2.position.set(
        -5,
        -3,
        -5
    );

    scene.add(light2);


    /* PŁASZCZYZNA PODGLĄDOWA */

    const grid = new THREE.GridHelper(
        20,
        20,
        0x333333,
        0x181818
    );

    grid.rotation.x = 0;

    grid.position.y = -3;

    scene.add(grid);


    window.addEventListener(
        "resize",
        resize
    );


    animate();
}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* =========================================================
   FILE
========================================================= */

const fileInput =
    document.getElementById("file");

fileInput.addEventListener(
    "change",
    function(e) {

        const file = e.target.files[0];

        if (!file) return;

        loadImage(file);
    }
);


/* =========================================================
   DRAG & DROP
========================================================= */

const drop =
    document.getElementById("drop");


drop.addEventListener(
    "dragover",
    function(e) {

        e.preventDefault();

        drop.classList.add("drag");
    }
);


drop.addEventListener(
    "dragleave",
    function() {

        drop.classList.remove("drag");
    }
);


drop.addEventListener(
    "drop",
    function(e) {

        e.preventDefault();

        drop.classList.remove("drag");

        const file =
            e.dataTransfer.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {

            setStatus(
                "To nie jest plik graficzny."
            );

            return;
        }

        loadImage(file);
    }
);


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(file) {

    setStatus(
        "Ładowanie zdjęcia..."
    );

    const reader =
        new FileReader();


    reader.onload = function(e) {

        image = new Image();

        image.onload = function() {

            setStatus(
                "Zdjęcie załadowane. Gotowe do generowania."
            );
        };

        image.src =
            e.target.result;
    };


    reader.readAsDataURL(file);
}


/* =========================================================
   GENERATE
========================================================= */

document
    .getElementById("generate")
    .addEventListener(
        "click",
        generateModel
    );


function generateModel() {

    if (!image) {

        setStatus(
            "Najpierw wybierz zdjęcie."
        );

        return;
    }


    setStatus(
        "Generowanie modelu 3D..."
    );


    /* USUŃ STARY MODEL */

    if (model) {

        scene.remove(model);

        model.geometry.dispose();

        model.material.dispose();

        model = null;
    }


    /* =====================================================
       CANVAS Z OBRAZEM
    ===================================================== */

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");


    /*
       Zachowujemy proporcje zdjęcia.
    */

    const aspect =
        image.width / image.height;


    let width =
        resolution;

    let height =
        Math.round(
            resolution / aspect
        );


    if (height < 2)
        height = 2;


    canvas.width = width;

    canvas.height = height;


    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const pixels =
        ctx.getImageData(
            0,
            0,
            width,
            height
        ).data;


    /* =====================================================
       TEXTURE
    ===================================================== */

    texture =
        new THREE.Texture(image);

    texture.needsUpdate = true;

    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.minFilter =
        THREE.LinearFilter;

    texture.magFilter =
        THREE.LinearFilter;


    /* =====================================================
       VERTICES
    ===================================================== */

    const vertices = [];

    const uvs = [];

    const indices = [];


    const modelWidth = 5;

    const modelHeight =
        modelWidth / aspect;


    /*
       Pobiera jasność piksela.
    */

    function getBrightness(x, y) {

        const i =
            (y * width + x) * 4;

        const r =
            pixels[i];

        const g =
            pixels[i + 1];

        const b =
            pixels[i + 2];

        /*
           Luminancja.
        */

        return (
            0.299 * r +
            0.587 * g +
            0.114 * b
        ) / 255;
    }


    /* =====================================================
       VERTICES
    ===================================================== */

    for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

            const px =
                x / (width - 1);

            const py =
                y / (height - 1);


            /*
               Normalizacja do środka.
            */

            const worldX =
                (px - 0.5) *
                modelWidth;


            const worldY =
                (0.5 - py) *
                modelHeight;


            let brightness =
                getBrightness(x, y);


            /*
               Ciemniejsze miejsca
               są bliżej użytkownika.
            */

            let z =
                (brightness - 0.5) *
                depthAmount;


            /*
               Opcjonalne wygładzenie.
            */

            if (smooth > 0) {

                let total = 0;

                let count = 0;

                for (
                    let sy = -smooth;
                    sy <= smooth;
                    sy++
                ) {

                    for (
                        let sx = -smooth;
                        sx <= smooth;
                        sx++
                    ) {

                        const nx =
                            Math.max(
                                0,
                                Math.min(
                                    width - 1,
                                    x + sx
                                )
                            );

                        const ny =
                            Math.max(
                                0,
                                Math.min(
                                    height - 1,
                                    y + sy
                                )
                            );

                        total +=
                            getBrightness(
                                nx,
                                ny
                            );

                        count++;
                    }
                }

                brightness =
                    total / count;

                z =
                    (brightness - 0.5) *
                    depthAmount;
            }


            vertices.push(
                worldX,
                worldY,
                z
            );


            /*
               UV
            */

            uvs.push(
                px,
                1 - py
            );
        }
    }


    /* =====================================================
       TRIANGLES
    ===================================================== */

    for (
        let y = 0;
        y < height - 1;
        y++
    ) {

        for (
            let x = 0;
            x < width - 1;
            x++
        ) {

            const a =
                y * width + x;

            const b =
                y * width + x + 1;

            const c =
                (y + 1) * width + x;

            const d =
                (y + 1) * width + x + 1;


            /*
               Triangle 1
            */

            indices.push(
                a,
                c,
                b
            );


            /*
               Triangle 2
            */

            indices.push(
                b,
                c,
                d
            );
        }
    }


    /* =====================================================
       GEOMETRY
    ===================================================== */

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );


    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );


    geometry.setIndex(indices);


    geometry.computeVertexNormals();


    /* =====================================================
       MATERIAL
    ===================================================== */

    const material =
        new THREE.MeshStandardMaterial({

            map: texture,

            side: THREE.DoubleSide,

            roughness: 0.75,

            metalness: 0.0,

            wireframe: wireframe
        });


    /* =====================================================
       MODEL
    ===================================================== */

    model =
        new THREE.Mesh(
            geometry,
            material
        );


    model.rotation.x = 0;

    model.rotation.y = 0;

    model.rotation.z = 0;


    scene.add(model);


    /*
       Kamera
    */

    camera.position.set(
        0,
        0,
        6
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();


    setStatus(
        "Model 3D wygenerowany. Obracaj go myszką."
    );
}


/* =========================================================
   DEPTH
========================================================= */

document
    .getElementById("depth")
    .addEventListener(
        "input",
        function() {

            depthAmount =
                parseFloat(this.value);

            document
                .getElementById("depthValue")
                .textContent =
                depthAmount.toFixed(1);
        }
    );


/* =========================================================
   RESOLUTION
========================================================= */

document
    .getElementById("resolution")
    .addEventListener(
        "input",
        function() {

            resolution =
                parseInt(this.value);

            document
                .getElementById("resValue")
                .textContent =
                resolution;
        }
    );


/* =========================================================
   SMOOTH
========================================================= */

document
    .getElementById("smooth")
    .addEventListener(
        "input",
        function() {

            smooth =
                parseInt(this.value);

            document
                .getElementById("smoothValue")
                .textContent =
                smooth;
        }
    );


/* =========================================================
   WIREFRAME
========================================================= */

document
    .getElementById("wireframe")
    .addEventListener(
        "click",
        function() {

            wireframe =
                !wireframe;

            this.textContent =
                wireframe
                    ? "SIATKA: ON"
                    : "SIATKA: OFF";


            if (model) {

                model.material.wireframe =
                    wireframe;
            }
        }
    );


/* =========================================================
   RESET
========================================================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        function() {

            camera.position.set(
                0,
                0,
                6
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();
        }
    );


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    document
        .getElementById("status")
        .textContent =
        text;
}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
