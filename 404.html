<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - BrainVerse</title>

<link rel="icon" href="brainverse_icon.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

font-family:"Roboto",sans-serif;

color:white;

overflow:hidden;

background:

radial-gradient(circle at 15% 15%,rgba(255,180,70,.35),transparent 30%),
radial-gradient(circle at 85% 80%,rgba(255,80,0,.35),transparent 35%),
linear-gradient(135deg,#7d2600,#d64a00,#ff7100);

}



body::before{

content:"";

position:fixed;

inset:0;

background:linear-gradient(
115deg,
transparent,
rgba(255,255,255,.08),
transparent
);

animation:move 12s linear infinite;

}


@keyframes move{

from{
transform:translateX(-30%);
}

to{
transform:translateX(30%);
}

}



body::after{

content:"";

position:fixed;

width:650px;

height:650px;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:url("brainverse_icon.png") center/contain no-repeat;

opacity:.06;

z-index:-1;

}



.topBar{

position:fixed;

top:0;

left:0;

width:100%;

height:88px;

display:flex;

align-items:center;

justify-content:space-between;

padding:15px clamp(20px,5vw,70px);

background:rgba(20,8,2,.8);

backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,180,90,.35);

z-index:10;

}



.brand{

display:flex;

align-items:center;

gap:14px;

}


.brandLogo{

width:56px;
height:56px;

}



.brandText{

font-family:"Orbitron";

font-size:38px;

font-weight:900;

text-shadow:

0 0 10px #ff7800,
0 0 30px #ff7800;

}



.brandSubtitle{

font-size:12px;

letter-spacing:2px;

opacity:.7;

}



.gamePortal{

display:flex;

align-items:center;

gap:15px;

padding:18px 35px;

background:linear-gradient(135deg,#ff4500,#ff9900);

border-radius:25px;

color:white;

text-decoration:none;

box-shadow:

0 0 25px rgba(255,120,0,.8);

transition:.3s;

}



.gamePortal:hover{

transform:scale(1.08) translateY(-4px);

}



.gamePortal strong{

display:block;

font-size:22px;

font-weight:900;

}



.gamePortal small{

display:block;

}



.gameIcon{

font-size:45px;

}



main{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:120px 20px 130px;

}



.card{

width:min(750px,100%);

padding:55px;

text-align:center;

border-radius:35px;

background:

linear-gradient(
135deg,
rgba(255,255,255,.20),
rgba(255,255,255,.08)
);

border:1px solid rgba(255,255,255,.25);

backdrop-filter:blur(22px);

box-shadow:0 30px 80px rgba(0,0,0,.4);

}



.logo{

width:120px;

filter:drop-shadow(0 0 25px orange);

}



.error{

font-family:"Orbitron";

font-size:140px;

font-weight:900;

line-height:1;

margin:10px;

text-shadow:

0 0 20px #ff7800,
0 0 60px #ff4500;

}



h2{

font-family:"Orbitron";

font-size:32px;

}



.desc{

opacity:.75;

font-size:18px;

margin-bottom:35px;

}



.homeButton{

display:inline-flex;

padding:22px 45px;

border-radius:100px;

background:linear-gradient(135deg,#ff3d00,#ff9500);

color:white;

font-size:20px;

font-weight:900;

text-decoration:none;

box-shadow:0 15px 40px rgba(255,80,0,.5);

transition:.25s;

}



.homeButton:hover{

transform:translateY(-5px) scale(1.05);

}





footer{

position:fixed;

bottom:0;

left:0;

width:100%;

padding:12px clamp(15px,4vw,50px);

background:rgba(15,5,0,.86);

backdrop-filter:blur(15px);

border-top:1px solid rgba(255,145,35,.45);

z-index:10;

}



.footerContent{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

}



.footerText{

font-size:12px;

color:rgba(255,255,255,.75);

line-height:1.55;

}



.footerText b{

color:white;

}



.footerText a{

color:#ffad45;

font-weight:800;

}



.publicAccount{

color:#ffb34e;

font-weight:800;

}



@media(max-width:700px){


.brandText{

font-size:25px;

}


.gamePortal{

padding:12px;

}


.gamePortal small{

display:none;

}


.error{

font-size:90px;

}


.card{

padding:30px 20px;

}


.footerContent{

flex-direction:column;

align-items:flex-start;

}


}

</style>

</head>


<body>



<header class="topBar">


<div class="brand">

<img class="brandLogo" src="brainverse_icon.png">

<div>

<div class="brandText">

</div>

</div>

</div>



<a href="https://brainverse.pl/gry/" class="gamePortal">

<span>

</span>

</a>

</a>


</div>


</main>

</span>


<br>


<a href="https://brainverse.pl/privacy-policy.html">

Polityka prywatności

</a>


</div>








</span>

</a>


</div>


</footer>



</body>

</html>
