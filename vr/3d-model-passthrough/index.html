/* =====================================================

function createLaser(){

    const geometry =
        new THREE.BufferGeometry();


    geometry.setFromPoints([

        new THREE.Vector3(
            0,0,0
        ),

        new THREE.Vector3(
            0,0,-1
        )

    ]);


    const material =
        new THREE.LineBasicMaterial({

            color:0x00ffff,

            transparent:true,

            opacity:.95

        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    line.scale.z = 8;


    return line;

}

/* =====================================================
   RAYCASTER
===================================================== */

const raycaster =
    new THREE.Raycaster();


const tempMatrix =
    new THREE.Matrix4();


function controllerRay(
    controller
){

    controller.updateMatrixWorld(
        true
    );


    tempMatrix
        .identity()
        .extractRotation(
            controller.matrixWorld
        );


    raycaster.ray.origin
        .setFromMatrixPosition(
            controller.matrixWorld
        );


    raycaster.ray.direction
        .set(
            0,
            0,
            -1
        )
        .applyMatrix4(
            tempMatrix
        );

}


/* =====================================================
   WORLD POSITION HELPERS
===================================================== */

function getWorldPosition(
    object
){

    const position =
        new THREE.Vector3();

    object.getWorldPosition(
        position
    );

    return position;

}


/* =====================================================
   GET XR CAMERA
===================================================== */

function getXRCamera(){

    return renderer.xr.getCamera();

}


/* =====================================================
   USER FORWARD
===================================================== */

function getViewerForward(){

    const xrCamera =
        getXRCamera();


    const quaternion =
        new THREE.Quaternion();


    xrCamera.getWorldQuaternion(
        quaternion
    );


    return new THREE.Vector3(
        0,
        0,
        -1
    )
        .applyQuaternion(
            quaternion
        )
        .normalize();

}


/* =====================================================
   PLACE OBJECT IN FRONT OF USER
===================================================== */

function placeObjectInFront(
    object,
    distance = 2
){

    const xrCamera =
        getXRCamera();


    const position =
        new THREE.Vector3();


    xrCamera.getWorldPosition(
        position
    );


    const forward =
        getViewerForward();


    position.add(
        forward.multiplyScalar(
            distance
        )
    );


    object.position.copy(
        position
    );


    object.position.y +=
        0;


    object.rotation.set(
        0,
        0,
        0
    );

}

/* =====================================================
   LOAD MODEL
===================================================== */

async function loadModel(
    file
){

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const url =
        URL.createObjectURL(
            file
        );


    try{

        let object = null;


        if(
            extension === "glb" ||
            extension === "gltf"
        ){

            object =
                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        gltfLoader.load(

                            url,

                            gltf => {

                                resolve(
                                    gltf.scene
                                );

                            },

                            undefined,

                            reject

                        );

                    }
                );

        }


        else if(
            extension === "obj"
        ){

            object =
                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        objLoader.load(

                            url,

                            resolve,

                            undefined,

                            reject

                        );

                    }
                );

        }


        else if(
            extension === "fbx"
        ){

            object =
                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        fbxLoader.load(

                            url,

                            resolve,

                            undefined,

                            reject

                        );

                    }
                );

        }


        else{

            throw new Error(
                "Nieobsługiwany format."
            );

        }


        if(!object){

            throw new Error(
                "Loader nie zwrócił modelu."
            );

        }


        prepareModel(
            object,
            file.name
        );

    }

    finally{

        URL.revokeObjectURL(
            url
        );

    }

}


/* =====================================================
   PREPARE MODEL
===================================================== */

function prepareModel(
    object,
    name
){

    object.userData.name =
        name || "3D MODEL";


    object.traverse(
        child => {

            if(
                !child.isMesh
            )
                return;


            child.castShadow =
                false;

            child.receiveShadow =
                false;


            if(
                child.material
            ){

                if(
                    Array.isArray(
                        child.material
                    )
                ){

                    child.material =
                        child.material.map(
                            material => {

                                const clone =
                                    material.clone();

                                clone.transparent =
                                    true;

                                return clone;

                            }
                        );

                }
                else{

                    child.material =
                        child.material.clone();

                    child.material.transparent =
                        true;

                }

            }

        }
    );


    /*
        Najpierw obliczamy rozmiar.
    */

    const box =
        new THREE.Box3()
            .setFromObject(
                object
            );


    const size =
        new THREE.Vector3();


    box.getSize(
        size
    );


    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        maxDimension > 0
    ){

        const targetSize =
            1;


        const scale =
            targetSize /
            maxDimension;


        object.scale.setScalar(
            scale
        );

    }


    /*
        Przeliczamy bounding box.
    */

    object.updateMatrixWorld(
        true
    );


    const normalizedBox =
        new THREE.Box3()
            .setFromObject(
                object
            );


    const center =
        normalizedBox.getCenter(
            new THREE.Vector3()
        );


    /*
        Tworzymy pivot.

        Dzięki temu model może być
        przesuwany/skalowany wokół
        własnego środka.
    */

    const pivot =
        new THREE.Group();


    pivot.userData.isModelPivot =
        true;


    scene.add(
        pivot
    );


    /*
        Model zachowuje swoją pozycję
        względem pivota.
    */

    object.position.sub(
        center
    );


    pivot.add(
        object
    );


    pivot.userData.name =
        name || "3D MODEL";


    pivot.userData.content =
        object;


    pivot.scale.setScalar(
        1
    );


    placeObjectInFront(
        pivot,
        2
    );


    models.push(
        pivot
    );


    currentModelIndex =
        models.length - 1;


    modelOpacity =
        1;


    locked =
        false;


    selectModel(
        pivot
    );


    /*
        Jeżeli XR już działa,
        model od razu jest widoczny.

        Jeżeli jeszcze nie działa,
        zostanie ustawiony przed użytkownikiem
        po wejściu do XR.
    */

}

/* =====================================================
   TEXTURE TEXT
===================================================== */

function textTexture(
    text,
    width = 1024,
    height = 256,
    fontSize = 60
){

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold " +
        fontSize +
        "px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.shadowColor =
        "rgba(0,255,255,.9)";


    ctx.shadowBlur =
        15;


    ctx.fillText(
        text,
        width / 2,
        height / 2
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}

function createButton(

    group.position.set(

        y,
        .03

    const body =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                .23

            new THREE.MeshBasicMaterial({

                color:0x06151b,

                transparent:true,

                opacity:.95,

                side:
                    THREE.DoubleSide

            })

        );


    body.userData.button =
        true;

    body.userData.action =
        action;

    body.userData.normal =
        0x06151b;

    body.userData.hover =
        0x00dfff;


    group.add(
        body
    );


    const border =
        new THREE.LineSegments(

            new THREE.EdgesGeometry(

                new THREE.PlaneGeometry(
                    .49,
                    .23
                )

            ),

            new THREE.LineBasicMaterial({

                color:0x00ffff,

                transparent:true,

                opacity:.6

            })

        );


    border.position.z =
        .006;


    group.add(
        border
    );


    const text =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                .45,
                .09
            ),

            new THREE.MeshBasicMaterial({

                map:
                    textTexture(
                        label,
                        512,
                        128,
                        42
                    ),

                transparent:true,

                side:
                    THREE.DoubleSide

            })

        );


    text.position.z =
        .012;


    text.position.y =
        -.055;


    group.add(
        text
    );


    body.userData.border =
        border;

    body.userData.group =
        group;


    menu.add(
        group
    );


    menuButtons.push(
        body
    );


    return body;

}

/* =====================================================
   PLACE MENU
===================================================== */

function placeMenu(){

    if(!menu)
        return;


    const xrCamera =
        getXRCamera();


    const position =
        new THREE.Vector3();


    xrCamera.getWorldPosition(
        position
    );


    const forward =
        getViewerForward();


    position.add(
        forward.multiplyScalar(
            1.25
        )
    );


    menu.position.copy(
        position
    );


    menu.position.y =
        position.y;


    const look =
        new THREE.Vector3();


    xrCamera.getWorldPosition(
        look
    );


    look.y =
        menu.position.y;


    menu.lookAt(
        look
    );

}


/* =====================================================
   PLACE MINI
===================================================== */

function placeMini(){

    if(!miniMenu)
        return;


    const xrCamera =
        getXRCamera();


    const position =
        new THREE.Vector3();


    xrCamera.getWorldPosition(
        position
    );


    const forward =
        getViewerForward();


    position.add(
        forward.multiplyScalar(
            1
        )
    );


    miniMenu.position.copy(

    );

        new THREE.Vector3();

    );

    );

    menuVisible =

}

function startMenuMove(

){

    menuMoveController =

        );

        );

/* =====================================================
   UPDATE MENU MOVE
===================================================== */

function updateMenuMove(){

    if(
        !menuMoving ||
        !menuMoveController ||

    )

    controllerRay(

    );

   RESET MODEL
===================================================== */

function resetModel(){

    if(!model)
        return;


    model.scale.setScalar(
        1
    );


    model.rotation.set(
        0,
        0,
        0
    );


    placeObjectInFront(
        model,
        2
    );


    modelOpacity =
        1;


    setModelOpacity(
        1
    );


    locked =
        false;


    updateFrame();

}

   CENTER
===================================================== */

function centerModel(){

        return;

    );

}


/* =====================================================
   HIDE
===================================================== */

function hideModel(){

    if(!model)
        return;


    model.visible =
        !model.visible;

}


/* =====================================================
   NEXT MODEL
===================================================== */

function nextModel(){

    if(
        models.length === 0
    )
        return;


    currentModelIndex++;


    if(
        currentModelIndex >=
        models.length
    ){

        currentModelIndex =
            0;

    }


    selectModel(
        models[
            currentModelIndex
        ]
    );

}


/* =====================================================
   DELETE MODEL
===================================================== */

function deleteModel(){

    if(!model)
        return;


    const index =
        models.indexOf(
            model
        );


    if(index === -1)
        return;


    scene.remove(
        model
    );


    model.traverse(
        child => {

            if(
                child.isMesh
            ){

                if(
                    child.geometry
                ){

                    child.geometry.dispose();

                }


                if(
                    child.material
                ){

                    const materials =
                        Array.isArray(
                            child.material
                        )
                        ?
                        child.material
                        :
                        [
                            child.material
                        ];


                    materials.forEach(
                        material => {

                            material.dispose();

                        }
                    );

                }

            }

        }
    );


    models.splice(
        index,
        1
    );


    if(
        models.length > 0
    ){

        currentModelIndex =
            Math.min(
                index,
                models.length - 1
            );


        selectModel(
            models[
                currentModelIndex
            ]
        );

    }
    else{

        model =
            null;

        currentModelIndex =
            -1;

    }


    updateFrame();

}


/* =====================================================
   OPACITY
===================================================== */

function setModelOpacity(
    opacity
){

    if(!model)
        return;


    model.traverse(
        child => {

            if(
                !child.isMesh ||
                !child.material
            )
                return;


            const materials =
                Array.isArray(
                    child.material
                )
                ?
                child.material
                :
                [
                    child.material
                ];


            materials.forEach(
                material => {

                    material.transparent =
                        true;

                    material.opacity =
                        opacity;

                    material.needsUpdate =
                        true;

                }
            );

        }
    );

}


function cycleOpacity(){

    if(!model)
        return;


    modelOpacity -= .2;


    if(
        modelOpacity < .2
    ){

        modelOpacity =
            1;

    }


    setModelOpacity(
        modelOpacity
    );

}


/* =====================================================
   FRAME
===================================================== */

function toggleFrame(){

    frameEnabled =
        !frameEnabled;


    updateFrame();

}


function updateFrame(){

    if(frameMesh){

        scene.remove(
            frameMesh
        );


        frameMesh.geometry.dispose();

        frameMesh.material.dispose();

        frameMesh =
            null;

    }


    if(
        !model ||
        !frameEnabled
    )
        return;


    model.updateMatrixWorld(
        true
    );


    const box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    const size =
        new THREE.Vector3();


    box.getSize(
        size
    );


    const center =
        new THREE.Vector3();


    box.getCenter(
        center
    );


    const geometry =
        new THREE.BoxGeometry(
            size.x + .06,
            size.y + .06,
            size.z + .06
        );


    const edges =
        new THREE.EdgesGeometry(
            geometry
        );


    geometry.dispose();


    const material =
        new THREE.LineBasicMaterial({

            color:0x00ffff,

            transparent:true,

            opacity:.9

        });


    frameMesh =
        new THREE.LineSegments(
            edges,
            material
        );


    frameMesh.position.copy(
        center
    );


    scene.add(
        frameMesh
    );

}

function clearHover(){

        );

}

){

/* =====================================================
   LASER UPDATE
===================================================== */

function updateLaser(
    controller,
    laser,
    dot
){

    controllerRay(
        controller
    );


    laser.visible =
        renderer.xr.isPresenting;


    dot.visible =
        renderer.xr.isPresenting;


    const targets = [];


    if(
        menu &&
        menu.visible
    ){

        targets.push(
            ...menuButtons
        );

    }


    if(
        miniMenu &&
        miniMenu.visible
    ){

        for(
            const child
            of miniMenu.children
        ){

            if(
                child.userData.miniButton
            ){

                targets.push(
                    child
                );

            }

        }

    }


    if(model){

        model.traverse(
            child => {

                if(
                    child.isMesh &&
                    child.visible
                ){

                    targets.push(
                        child
                    );

                }

            }
        );

    }


    const hits =
        raycaster.intersectObjects(
            targets,
            false
        );


    if(
        hits.length > 0
    ){

        const point =
            hits[0].point;


        dot.position.copy(
            point
        );


        const local =
            controller.worldToLocal(
                point.clone()
            );


        laser.scale.z =
            Math.max(
                .15,
                Math.abs(
                    local.z
                )
            );


        const hitObject =
            hits[0].object;


        if(
            hitObject.userData.button
        ){

            setHover(
                hitObject
            );

        }
        else{

            clearHover();

        }

    }
    else{

        const far =
            raycaster.ray.origin
                .clone()
                .add(
                    raycaster.ray.direction
                        .clone()
                        .multiplyScalar(
                            8
                        )
                );


        dot.position.copy(
            far
        );


        laser.scale.z =
            8;


        clearHover();

    }

}


/* =====================================================
   CONTROLLER SELECT
===================================================== */

function controllerSelect(
    controller
){

    controllerRay(
        controller
    );


    /*
        MINI MENU
    */

    if(
        miniMenu &&
        miniMenu.visible
    ){

        const hits =
            raycaster.intersectObjects(
                miniMenu.children,
                false
            );


        if(
            hits.length
        ){

            const object =
                hits[0].object;


            if(
                object.userData.miniButton
            ){

                object.userData.action();

                return;

            }

        }

    }


    /*
        MAIN MENU
    */

    if(
        menu &&
        menu.visible
    ){

        const hits =
            raycaster.intersectObjects(
                menuButtons,
                false
            );


        if(
            hits.length
        ){

            const button =
                hits[0].object;


            button.userData.action();

            return;

        }


        /*
            MOVE UI mode:
            Trigger na panelu
            pozwala przesuwać menu.
        */

        if(
            mode === "MENU"
        ){

            const all =
                raycaster.intersectObject(
                    menu,
                    true
                );


            if(
                all.length
            ){

                startMenuMove(
                    controller
                );

                return;

            }

        }

    }


    /*
        MODEL
    */

    if(
        !model ||
        locked
    )
        return;


    const modelMeshes = [];


    model.traverse(
        child => {

            if(
                child.isMesh &&
                child.visible
            ){

                modelMeshes.push(
                    child
                );

            }

        }
    );


    const hits =
        raycaster.intersectObjects(
            modelMeshes,
            false
        );


    if(
        !hits.length
    )
        return;


    dragging =
        true;


    activeController =
        controller;


    const controllerPos =
        getWorldPosition(
            controller
        );


    const modelPos =
        getWorldPosition(
            model
        );


    dragDistance =
        controllerPos.distanceTo(
            modelPos
        );


    startScale =
        model.scale.x;

}

/* =====================================================
   THUMBSTICK
===================================================== */

function getThumbstickY(){

    const xrSession =
        renderer.xr.getSession();


    if(!xrSession)
        return 0;


    for(
        const source
        of xrSession.inputSources
    ){

        if(
            source.targetRayMode !==
            "tracked-pointer"
        )
            continue;


        const gamepad =
            source.gamepad;


        if(!gamepad)
            continue;


        if(
            gamepad.axes.length >= 4
        ){

            const y =
                gamepad.axes[3];


            if(
                Math.abs(y) > .15
            )
                return y;

        }


        if(
            gamepad.axes.length >= 2
        ){

            const y =
                gamepad.axes[1];


            if(
                Math.abs(y) > .15
            )
                return y;

        }

    }


    return 0;

}


/* =====================================================
   JOYSTICK ZOOM
===================================================== */

function updateJoystickZoom(){

    if(
        !model ||
        locked
    )
        return;


    const y =
        getThumbstickY();


    if(
        Math.abs(y) < .12
    )
        return;


    const speed =
        .018;


    const factor =
        1 -
        y * speed;


    const next =
        THREE.MathUtils.clamp(

            model.scale.x *
            factor,

            .02,
            50

        );


    model.scale.setScalar(
        next
    );


    updateFrame();

}


/* =====================================================
   MODEL MOVEMENT
===================================================== */

function updateModelMovement(){

    if(
        !model ||
        locked
    )
        return;


    updateJoystickZoom();


    /*
        TWO HAND SCALE
    */

    if(
        mode === "SCALE"
    ){

        const pos1 =
            getWorldPosition(
                controller1
            );


        const pos2 =
            getWorldPosition(
                controller2
            );


        const distance =
            pos1.distanceTo(
                pos2
            );


        if(
            distance > .08
        ){

            if(!twoHandStart){

                twoHandStart = {

                    distance:
                        distance,

                    scale:
                        model.scale.x

                };

            }
            else{

                const factor =
                    distance /
                    twoHandStart.distance;


                const scale =
                    THREE.MathUtils.clamp(

                        twoHandStart.scale *
                        factor,

                        .02,
                        50

                    );


                model.scale.setScalar(
                    scale
                );


                updateFrame();

            }

        }
        else{

            twoHandStart =
                null;

        }

    }
    else{

        twoHandStart =
            null;

    }


    updateMenuMove();


    /*
        DRAG
    */

    if(
        !dragging ||
        !activeController
    )
        return;


    /*
        MOVE
    */

    if(
        mode === "MOVE"
    ){

        controllerRay(
            activeController
        );


        const target =
            raycaster.ray.origin
                .clone()
                .add(
                    raycaster.ray.direction
                        .clone()
                        .multiplyScalar(
                            dragDistance
                        )
                );


        model.position.lerp(
            target,
            .28
        );

    }


    /*
        SCALE
    */

    if(
        mode === "SCALE"
    ){

        const controllerPos =
            getWorldPosition(
                activeController
            );


        const modelPos =
            getWorldPosition(
                model
            );


        const d =
            controllerPos.distanceTo(
                modelPos
            );


        const scale =
            THREE.MathUtils.clamp(

                startScale *
                (
                    d /
                    Math.max(
                        .01,
                        dragDistance
                    )
                ),

                .02,
                50

            );


        model.scale.setScalar(
            scale
        );

    }


    /*
        ROTATE
    */

    if(
        mode === "ROTATE"
    ){

        const controllerPos =
            getWorldPosition(
                activeController
            );


        const modelPos =
            getWorldPosition(
                model
            );


        const dx =
            controllerPos.x -
            modelPos.x;


        const dz =
            controllerPos.z -
            modelPos.z;


        model.rotation.y =
            Math.atan2(
                dx,
                dz
            );

    }


    updateFrame();

}


/* =====================================================
   CHECK XR SUPPORT
===================================================== */

async function checkXRSupport(){

    clearError();


    startXR.disabled =
        true;


    if(
        !("xr" in navigator)
    ){

        status.textContent =
            "WebXR niedostępny.";


        showError(
            "navigator.xr nie jest dostępne. " +
            "Uruchom stronę w przeglądarce z obsługą WebXR " +
            "na Quest 3 i użyj HTTPS."
        );


        return;

    }


    let arSupported =
        false;

    let vrSupported =
        false;


    try{

        arSupported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );

    }
    catch(error){

        console.warn(
            "AR support check failed:",
            error
        );

    }


    try{

        vrSupported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-vr"
                );

    }
    catch(error){

        console.warn(
            "VR support check failed:",
            error
        );

    }


    if(arSupported){

        status.textContent =
            "WebXR OK — passthrough AR dostępne.";

        startXR.disabled =
            false;

        return;

    }


    if(vrSupported){

        status.textContent =
            "WebXR OK — VR dostępne.";

        startXR.disabled =
            false;

        return;

    }


    status.textContent =
        "Brak obsługiwanej sesji XR.";


    showError(
        "Urządzenie/przeglądarka nie zgłasza " +
        "immersive-ar ani immersive-vr."
    );

}


/* =====================================================
   START XR
===================================================== */

startXR.addEventListener(
    "click",
    async () => {

        clearError();


        if(
            !navigator.xr
        ){

            showError(
                "WebXR nie jest dostępny."
            );

            return;

        }


        startXR.disabled =
            true;


        status.textContent =
            "Uruchamianie XR...";


        try{

            /*
                Najpierw próbujemy passthrough AR.

                Quest 3 może wtedy działać jako
                mixed reality.
            */

            let modeToUse =
                "immersive-ar";


            let supported =
                false;


            try{

                supported =
                    await navigator.xr
                        .isSessionSupported(
                            "immersive-ar"
                        );

            }
            catch(error){

                console.warn(
                    error
                );

            }


            /*
                Jeżeli AR nie jest dostępne,
                próbujemy zwykłego VR.
            */

            if(!supported){

                modeToUse =
                    "immersive-vr";


                supported =
                    await navigator.xr
                        .isSessionSupported(
                            "immersive-vr"
                        );

            }


            if(!supported){

                throw new Error(
                    "Brak obsługiwanej sesji immersive-ar/immersive-vr."
                );

            }


            const optionalFeatures = [

                "local-floor",

                "bounded-floor",

                "hand-tracking"

            ];


            /*
                Dom overlay nie jest wymagany.
                Dzięki temu jego brak nie zablokuje XR.
            */

            const sessionOptions = {

                optionalFeatures

            };


            /*
                Przy AR próbujemy DOM overlay.

                Jeżeli implementacja go nie obsługuje,
                sama sesja nadal może działać,
                ponieważ feature jest opcjonalny.
            */

            if(
                modeToUse ===
                "immersive-ar"
            ){

                sessionOptions.optionalFeatures =
                    [
                        ...optionalFeatures,
                        "dom-overlay"
                    ];


                sessionOptions.domOverlay = {

                    root:
                        document.body

                };

            }


            const newSession =
                await navigator.xr.requestSession(
                    modeToUse,
                    sessionOptions
                );


            await renderer.xr.setSession(
                newSession
            );


            /*
                To jest prawdziwy moment
                wejścia do XR.
            */

            session =
                newSession;


            xrMode =
                modeToUse;


            onXRStarted();

        }
        catch(error){

            console.error(
                "XR START ERROR:",
                error
            );


            startXR.disabled =
                false;


            status.textContent =
                "Nie udało się uruchomić XR.";


            showError(
                "XR ERROR: " +
                (
                    error.message ||
                    error.name ||
                    String(error)
                )
            );

        }

    }
);


/* =====================================================
   XR STARTED
===================================================== */

function onXRStarted(){

    startScreen.style.display =
        "none";


    info.style.display =
        "block";


    if(!menu){

        createMenu();

    }


    if(!miniMenu){

        createMiniMenu();

    }


    menu.visible =
        true;


    menuVisible =
        true;


    miniMenu.visible =
        false;


    /*
        XR kamera musi już istnieć.
    */

    setTimeout(
        () => {

            placeMenu();

            placeMini();


            /*
                Jeżeli model był wybrany
                jeszcze przed XR,
                przenosimy go przed użytkownika.
            */

            if(model){

                placeObjectInFront(
                    model,
                    2
                );

            }

        },
        100
    );


    status.textContent =
        xrMode === "immersive-ar"
        ?
        "PASSTHROUGH AR ONLINE"
        :
        "VR ONLINE";


    setTimeout(
        () => {

            info.style.display =
                "none";

        },
        5000
    );

}


/* =====================================================
   XR END
===================================================== */

renderer.xr.addEventListener(
    "sessionend",
    () => {

        session =
            null;


        xrMode =
            null;


        if(menu){

            scene.remove(
                menu
            );

            menu =
                null;

            menuButtons.length =
                0;

        }


        if(miniMenu){

            scene.remove(
                miniMenu
            );

            miniMenu =
                null;

        }


        selectedButton =
            null;


        dragging =
            false;


        menuMoving =
            false;


        activeController =
            null;


        menuMoveController =
            null;


        twoHandStart =
            null;


        startScreen.style.display =
            "flex";


        startXR.disabled =
            false;


        status.textContent =
            "XR zakończony.";

    }
);


/* =====================================================
   RENDER LOOP
===================================================== */

function render(){

    if(
        renderer.xr.isPresenting
    ){

        updateLaser(
            controller1,
            laser1,
            dot1
        );


        updateLaser(
            controller2,
            laser2,
            dot2
        );


        updateModelMovement();

    }


    renderer.render(
        scene,
        camera
    );

}


renderer.setAnimationLoop(
    render
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   INITIAL CHECK
===================================================== */

checkXRSupport();


</script>

</body>
</html>
