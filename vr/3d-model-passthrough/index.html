async function loadModel(file){

    const extension=
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const url=
        URL.createObjectURL(
            file
        );


    let object=null;


    try{

        /* =============================================
           GLB / GLTF
        ============================================= */

        if(
            extension==="glb" ||
            extension==="gltf"
        ){

            object=
                await new Promise(
                    (resolve,reject)=>{

                        gltfLoader.load(
                            url,

                            gltf=>{
                                resolve(
                                    gltf.scene
                                );
                            },

                            undefined,

                            reject
                        );

                    }
                );

        }


        /* =============================================
           OBJ
        ============================================= */

        else if(
            extension==="obj"
        ){

            object=
                await new Promise(
                    (resolve,reject)=>{

                        objLoader.load(
                            url,

                            resolve,

                            undefined,

                            reject
                        );

                    }
                );

        }


        /* =============================================
           FBX
        ============================================= */

        else if(
            extension==="fbx"
        ){

            object=
                await new Promise(
                    (resolve,reject)=>{

                        fbxLoader.load(
                            url,

                            resolve,

                            undefined,

                            reject
                        );

                    }
                );

        }


        else{

            throw new Error(
                "Unsupported 3D format"
            );

        }


        /* =============================================
           PREPARE MODEL
        ============================================= */

        prepareModel(
            object,
            file.name
        );

    }
    finally{

        URL.revokeObjectURL(
            url
        );

    }

}


/* =====================================================
   PREPARE MODEL
===================================================== */

function prepareModel(
    object,
    name
){

    object.userData.name=
        name || "3D MODEL";


    object.traverse(
        child=>{

            if(
                child.isMesh
            ){

                child.castShadow=true;

                child.receiveShadow=true;


                if(
                    child.material
                ){

                    if(
                        Array.isArray(
                            child.material
                        )
                    ){

                        child.material=
                            child.material.map(
                                material=>{

                                    material=
                                        material.clone();

                                    material.transparent=true;

                                    return material;

                                }
                            );

                    }
                    else{

                        child.material=
                            child.material.clone();

                        child.material.transparent=true;

                    }

                }

            }

        }
    );


    /*
       Obliczamy bounding box.
    */

    const box=
        new THREE.Box3()
        .setFromObject(
            object
        );


    const size=
        new THREE.Vector3();

    box.getSize(
        size
    );


    const maxDimension=
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        maxDimension>0
    ){

        /*
           Normalizujemy model,
           żeby każdy model miał
           sensowny rozmiar w VR.
        */

        const targetSize=1;

        const scale=
            targetSize/
            maxDimension;

        object.scale.setScalar(
            scale
        );

    }


    /*
       Ponownie obliczamy box
       po skalowaniu.
    */

    const normalizedBox=
        new THREE.Box3()
        .setFromObject(
            object
        );


    const center=
        new THREE.Vector3();

    normalizedBox.getCenter(
        center
    );


    /*
       Przenosimy środek modelu
       do jego lokalnego centrum.
    */

    object.position.sub(
        center
    );


    /*
       Model pojawia się
       2 metry przed użytkownikiem.
    */

    const direction=
        new THREE.Vector3(
            0,0,-1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    object.position=
        camera.position.clone()
        .add(
            direction.multiplyScalar(
                2
            )
        );


    object.position.y=
        camera.position.y;


    scene.add(
        object
    );


    models.push(
        object
    );


    currentModelIndex=
        models.length-1;


    modelOpacity=1;

    locked=false;


    selectModel(
        object
    );


    if(
        renderer.xr.isPresenting
    ){

        return;

    }


    /*
       Jeżeli jesteśmy poza XR,
       automatycznie uruchamiamy AR.
    */

    arButton.click();

}

function textTexture(
    text,
    width=1024,
    height=256,
    fontSize=60
){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=width;
    canvas.height=height;

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle="#ffffff";

    ctx.font=
        "bold "+
        fontSize+
        "px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.shadowColor=
        "rgba(0,255,255,.9)";

    ctx.shadowBlur=15;

    ctx.fillText(
        text,
        width/2,
        height/2
    );

    const texture=
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    return texture;

}

function placeMenu(){

    if(!menu)
        return;


    const direction=
        new THREE.Vector3(
            0,0,-1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    const pos=
        camera.position.clone();


    pos.add(
        direction.multiplyScalar(
            1.25
        )
    );


    pos.y=
        camera.position.y;


    menu.position.copy(
        pos
    );


    const look=
        camera.position.clone();


    look.y=
        menu.position.y;


    menu.lookAt(
        look
    );

}

/* =====================================================
   MENU MOVEMENT
===================================================== */

function startMenuMove(
    controller
){

    menuMoving=true;

    menuMoveController=
        controller;

    menuMoveDistance=
        controller.position
        .distanceTo(
            menu.position
        );

}


function updateMenuMove(){

    if(
        !menuMoving ||
        !menuMoveController ||
        !menu
    )
        return;


    controllerRay(
        menuMoveController
    );


    const target=
        raycaster.ray.origin.clone()
        .add(
            raycaster.ray.direction
            .clone()
            .multiplyScalar(
                menuMoveDistance
            )
        );


    menu.position.lerp(
        target,
        .2
    );


    const look=
        camera.position.clone();


    look.y=
        menu.position.y;


    menu.lookAt(
        look
    );

}

function resetModel(){

    if(!model)
        return;


    model.scale.setScalar(
        1
    );


    model.rotation.set(
        0,
        0,
        0
    );


    const direction=
        new THREE.Vector3(
            0,0,-1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    model.position=
        camera.position.clone()
        .add(
            direction.multiplyScalar(
                2
            )
        );


    model.position.y=
        camera.position.y;


    modelOpacity=1;

    setModelOpacity(
        1
    );


    locked=false;

    updateFrame();

}


/* =====================================================
   RESET ZOOM
===================================================== */

function resetZoom(){

    if(model){

        model.scale.setScalar(
            1
        );

        updateFrame();

    }

}


/* =====================================================
   CENTER MODEL
===================================================== */

function centerModel(){

    if(!model)
        return;


    const dir=
        new THREE.Vector3(
            0,0,-1
        );


    dir.applyQuaternion(
        camera.quaternion
    );


    model.position=
        camera.position.clone()
        .add(
            dir.multiplyScalar(
                2
            )
        );


    model.position.y=
        camera.position.y;


    updateFrame();

}


/* =====================================================
   HIDE MODEL
===================================================== */

function hideModel(){

    if(model){

        model.visible=
            !model.visible;

    }

}


/* =====================================================
   NEXT MODEL
===================================================== */

function nextModel(){

    if(
        models.length===0
    )
        return;


    currentModelIndex++;


    if(
        currentModelIndex>=
        models.length
    ){

        currentModelIndex=0;

    }


    selectModel(
        models[
            currentModelIndex
        ]
    );

}


/* =====================================================
   DELETE MODEL
===================================================== */

function deleteModel(){

    if(!model)
        return;


    const index=
        models.indexOf(
            model
        );


    scene.remove(
        model
    );


    model.traverse(
        child=>{

            if(
                child.isMesh
            ){

                child.geometry?.dispose();


                if(
                    child.material
                ){

                    if(
                        Array.isArray(
                            child.material
                        )
                    ){

                        child.material.forEach(
                            material=>{
                                material.dispose();
                            }
                        );

                    }
                    else{

                        child.material.dispose();

                    }

                }

            }

        }
    );


    models.splice(
        index,
        1
    );


    if(
        models.length
    ){

        currentModelIndex=
            Math.max(
                0,
                index-1
            );


        selectModel(
            models[
                currentModelIndex
            ]
        );

    }
    else{

        model=null;

    }


    updateFrame();

}


/* =====================================================
   MODEL OPACITY
===================================================== */

function setModelOpacity(
    opacity
){

    if(!model)
        return;


    model.traverse(
        child=>{

            if(
                !child.isMesh ||
                !child.material
            )
                return;


            const materials=
                Array.isArray(
                    child.material
                )
                ?
                child.material
                :
                [child.material];


            materials.forEach(
                material=>{

                    material.transparent=true;

                    material.opacity=
                        opacity;

                    material.needsUpdate=
                        true;

                }
            );

        }
    );

}


function cycleOpacity(){

    if(!model)
        return;


    modelOpacity-=.2;


    if(
        modelOpacity<.2
    )
        modelOpacity=1;


    setModelOpacity(
        modelOpacity
    );

}


/* =====================================================
   MODEL FRAME
===================================================== */

function toggleFrame(){

    frameEnabled=
        !frameEnabled;

    updateFrame();

}


function updateFrame(){

    if(frameMesh){

        scene.remove(
            frameMesh
        );


        frameMesh.geometry.dispose();

        frameMesh.material.dispose();

        frameMesh=null;

    }


    if(
        !model ||
        !frameEnabled
    )
        return;


    const box=
        new THREE.Box3()
        .setFromObject(
            model
        );


    const size=
        new THREE.Vector3();


    box.getSize(
        size
    );


    const center=
        new THREE.Vector3();


    box.getCenter(
        center
    );


    const geometry=
        new THREE.BoxGeometry(
            size.x+.06,
            size.y+.06,
            size.z+.06
        );


    const edges=
        new THREE.EdgesGeometry(
            geometry
        );


    geometry.dispose();


    const material=
        new THREE.LineBasicMaterial({

            color:0x00ffff,

            transparent:true,

            opacity:.9

        });


    frameMesh=
        new THREE.LineSegments(
            edges,
            material
        );


    frameMesh.position.copy(
        center
    );


    scene.add(
        frameMesh
    );

}


/* =====================================================
   GRID
===================================================== */

function toggleGrid(){

    if(gridMesh){

        scene.remove(
            gridMesh
        );


        gridMesh.geometry.dispose();

        gridMesh.material.dispose();

        gridMesh=null;

        return;

    }


    gridMesh=
        new THREE.GridHelper(
            10,
            20,
            0x00ffff,
            0x004455
        );


    gridMesh.position.y=.01;

    scene.add(
        gridMesh
    );

}

/* =====================================================
   HOVER
===================================================== */

function clearHover(){

    if(!selectedButton)
        return;


    if(
        selectedButton.userData.button
    ){

        selectedButton.material.color
            .setHex(
                selectedButton.userData.normal
            );

    }


    selectedButton=null;

}


function setHover(
    button
){

    if(
        selectedButton===button
    )
        return;


    clearHover();


    selectedButton=
        button;


    if(
        button.userData.button
    ){

        button.material.color
            .setHex(
                button.userData.hover
            );

    }

}


/* =====================================================
   LASER
===================================================== */

function updateLaser(
    controller,
    laser,
    dot
){

    controllerRay(
        controller
    );


    laser.visible=
        renderer.xr.isPresenting;


    dot.visible=
        renderer.xr.isPresenting;


    const targets=[];


    if(
        menu &&
        menu.visible
    ){

        targets.push(
            ...menuButtons
        );

    }


    if(
        miniMenu &&
        miniMenu.visible
    ){

        targets.push(
            ...miniMenu.children
                .filter(
                    x =>
                        x.userData
                        .miniButton
                )
        );

    }


    if(model){

        model.traverse(
            child=>{

                if(
                    child.isMesh &&
                    child.visible
                ){

                    targets.push(
                        child
                    );

                }

            }
        );

    }


    const hits=
        raycaster.intersectObjects(
            targets,
            false
        );


    if(hits.length){

        const point=
            hits[0].point;


        dot.position.copy(
            point
        );


        const local=
            controller.worldToLocal(
                point.clone()
            );


        laser.scale.z=
            Math.max(
                .15,
                Math.abs(local.z)
            );


        if(
            hits[0].object.userData.button
        ){

            setHover(
                hits[0].object
            );

        }
        else if(
            hits[0].object.userData.miniButton
        ){

            clearHover();

        }

    }
    else{

        const far=
            raycaster.ray.origin.clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    8
                )
            );


        dot.position.copy(
            far
        );


        laser.scale.z=8;

        clearHover();

    }

}


/* =====================================================
   CONTROLLER CLICK
===================================================== */

function controllerSelect(
    controller
){

    controllerRay(
        controller
    );


    /* MINI MENU */

    if(
        miniMenu &&
        miniMenu.visible
    ){

        const hits=
            raycaster.intersectObjects(
                miniMenu.children,
                false
            );


        if(hits.length){

            const obj=
                hits[0].object;


            if(
                obj.userData.miniButton
            ){

                obj.userData.action();

                return;

            }

        }

    }


    /* MAIN MENU */

    if(
        menu &&
        menu.visible
    ){

        const hits=
            raycaster.intersectObjects(
                menuButtons,
                false
            );


        if(hits.length){

            const button=
                hits[0].object;


            button.userData.action();

            return;

        }


        if(
            mode==="MENU"
        ){

            const all=
                raycaster.intersectObject(
                    menu,
                    true
                );


            if(all.length){

                startMenuMove(
                    controller
                );

                return;

            }

        }

    }


    /* MODEL */

    if(
        !model ||
        locked
    )
        return;


    const modelMeshes=[];


    model.traverse(
        child=>{

            if(
                child.isMesh
            ){

                modelMeshes.push(
                    child
                );

            }

        }
    );


    const hits=
        raycaster.intersectObjects(
            modelMeshes,
            false
        );


    if(!hits.length)
        return;


    dragging=true;

    activeController=
        controller;


    dragDistance=
        controller.position
        .distanceTo(
            model.position
        );


    startScale=
        model.scale.x;

}

/* =====================================================
   QUEST JOYSTICK
===================================================== */

function getThumbstickY(){

    const inputSources=
        renderer.xr
            .getSession()
            ?.inputSources;


    if(!inputSources)
        return 0;


    for(
        const source
        of inputSources
    ){

        if(
            source.targetRayMode!==
            "tracked-pointer"
        )
            continue;


        const gamepad=
            source.gamepad;


        if(!gamepad)
            continue;


        if(
            gamepad.axes.length>=4
        ){

            const y=
                gamepad.axes[3];


            if(
                Math.abs(y)>.15
            )
                return y;

        }


        if(
            gamepad.axes.length>=2
        ){

            const y=
                gamepad.axes[1];


            if(
                Math.abs(y)>.15
            )
                return y;

        }

    }


    return 0;

}


/* =====================================================
   JOYSTICK ZOOM
===================================================== */

function updateJoystickZoom(){

    if(
        !model ||
        locked
    )
        return;


    const y=
        getThumbstickY();


    if(
        Math.abs(y)<.12
    )
        return;


    const speed=.018;


    const factor=
        1-
        y*speed;


    const next=
        THREE.MathUtils.clamp(

            model.scale.x*
            factor,

            .02,
            50

        );


    model.scale.setScalar(
        next
    );


    updateFrame();

}


/* =====================================================
   MODEL MOVEMENT
===================================================== */

function updateModelMovement(){

    if(
        !model ||
        locked
    )
        return;


    updateJoystickZoom();


    /* TWO CONTROLLER SCALE */

    const distance=
        controller1.position
        .distanceTo(
            controller2.position
        );


    if(
        distance>.08 &&
        mode==="SCALE"
    ){

        if(!twoHandStart){

            twoHandStart={

                distance,

                scale:model.scale.x

            };

        }
        else{

            const factor=
                distance/
                twoHandStart.distance;


            const scale=
                THREE.MathUtils.clamp(

                    twoHandStart.scale*
                    factor,

                    .02,
                    50

                );


            model.scale.setScalar(
                scale
            );


            updateFrame();

        }

    }
    else{

        twoHandStart=null;

    }


    updateMenuMove();


    /* DRAG */

    if(
        !dragging ||
        !activeController
    )
        return;


    if(
        mode==="MOVE"
    ){

        controllerRay(
            activeController
        );


        const target=
            raycaster.ray.origin.clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    dragDistance
                )
            );


        model.position.lerp(
            target,
            .28
        );

    }


    if(
        mode==="SCALE"
    ){

        const d=
            activeController.position
            .distanceTo(
                model.position
            );


        const scale=
            THREE.MathUtils.clamp(

                startScale*
                (
                    d/
                    Math.max(
                        .01,
                        dragDistance
                    )
                ),

                .02,
                50

            );


        model.scale.setScalar(
            scale
        );

    }


    if(
        mode==="ROTATE"
    ){

        const dx=
            activeController.position.x-
            model.position.x;


        const dz=
            activeController.position.z-
            model.position.z;


        model.rotation.y=
            Math.atan2(
                dx,
                dz
            );

    }


    updateFrame();

}
