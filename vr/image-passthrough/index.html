========================= */

/* =====================================================

/* =====================================================

/* =====================================================
   LASERY QUEST
===================================================== */

function createLaser(){

    const geometry =
        new THREE.BufferGeometry();

    geometry.setFromPoints([
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(0,0,-1)
    ]);

    const material =
        new THREE.LineBasicMaterial({
            color:0x00ffff,
            transparent:true,
            opacity:.95
        });

    const line =
        new THREE.Line(
            geometry,
            material
        );

    line.scale.z = 8;

    return line;
}

const laser1 =
    createLaser();

const laser2 =
    createLaser();

controller1.add(laser1);
controller2.add(laser2);

   STAN

let objects = [];

/* =====================================================
   ŁADOWANIE PLIKU
===================================================== */

async function loadFile(file){

    const name =
        file.name.toLowerCase();

    const ext =
        name.split(".").pop();

    const url =
        URL.createObjectURL(file);

    try{

        /* IMAGE */

        if([
            "jpg",
            "jpeg",
            "png",
            "webp",
            "bmp",
            "gif"
        ].includes(ext)){

            return await loadImage(url);
        }


        /* GLB / GLTF */

        if(
            ext === "glb" ||
            ext === "gltf"
        ){

            const loader =
                new GLTFLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        result => {

                            result.scene.userData.kind =
                                "model";

                            resolve(
                                result.scene
                            );

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* STL */

        if(ext === "stl"){

            const loader =
                new STLLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        geometry => {

                            geometry.computeVertexNormals();

                            const material =
                                new THREE.MeshStandardMaterial({
                                    color:0xd8d8d8,
                                    roughness:.55,
                                    metalness:.15
                                });

                            const mesh =
                                new THREE.Mesh(
                                    geometry,
                                    material
                                );

                            mesh.userData.kind =
                                "model";

                            resolve(mesh);

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* OBJ */

        if(ext === "obj"){

            const loader =
                new OBJLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        object => {

                            object.traverse(
                                child => {

                                    if(
                                        child.isMesh &&
                                        !child.material
                                    ){

                                        child.material =
                                            new THREE.MeshStandardMaterial({
                                                color:0xd8d8d8
                                            });

                                    }

                                }
                            );

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* FBX */

        if(ext === "fbx"){

            const loader =
                new FBXLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        object => {

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* PLY */

        if(ext === "ply"){

            const loader =
                new PLYLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        geometry => {

                            geometry.computeVertexNormals();

                            const material =
                                new THREE.MeshStandardMaterial({
                                    color:0xd8d8d8,
                                    roughness:.5
                                });

                            const mesh =
                                new THREE.Mesh(
                                    geometry,
                                    material
                                );

                            mesh.userData.kind =
                                "model";

                            resolve(mesh);

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* 3MF */

        if(ext === "3mf"){

            const loader =
                new ThreeMFLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        object => {

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* DAE */

        if(ext === "dae"){

            const loader =
                new ColladaLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        result => {

                            result.scene.userData.kind =
                                "model";

                            resolve(
                                result.scene
                            );

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        /* 3DS */

        if(ext === "3ds"){

            const loader =
                new TDSLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(

                        url,

                        object => {

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );
        }


        throw new Error(
            "Nieobsługiwany format: ." +
            ext
        );

    }
    finally{

        setTimeout(
            () => {
                URL.revokeObjectURL(url);
            },
            1000
        );

    }
}


/* =====================================================
   OBRAZ
===================================================== */

async function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.onload = () => {

                const texture =
                    new THREE.Texture(img);

                texture.colorSpace =
                    THREE.SRGBColorSpace;

                texture.needsUpdate =
                    true;

                const aspect =
                    img.naturalWidth /
                    img.naturalHeight;

                const geometry =
                    new THREE.PlaneGeometry(
                        aspect,
                        1
                    );

                const material =
                    new THREE.MeshBasicMaterial({
                        map:texture,
                        transparent:true,
                        depthWrite:false,
                        side:THREE.DoubleSide
                    });

                const mesh =
                    new THREE.Mesh(
                        geometry,
                        material
                    );

                mesh.userData.kind =
                    "image";

                resolve(mesh);
            };

            img.onerror = () => {

                reject(
                    new Error(
                        "Nie można odczytać obrazu."
                    )
                );

            };

            img.src = url;

        }
    );
}


/* =====================================================
   NORMALIZACJA MODELU
===================================================== */

function normalizeObject(object){

    const box =
        new THREE.Box3()
        .setFromObject(object);

    if(box.isEmpty())
        return;

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if(
        !Number.isFinite(max) ||
        max <= 0
    )
        return;

    object.scale.setScalar(
        1 / max
    );

    const newBox =
        new THREE.Box3()
        .setFromObject(object);

    const center =
        newBox.getCenter(
            new THREE.Vector3()
        );

    object.position.sub(center);
}


/* =====================================================
   DODAJ OBIEKT
===================================================== */

function addObject(
    object,
    filename
){

    objectCounter++;

    object.userData.id =
        objectCounter;

    object.userData.filename =
        filename;

    normalizeObject(object);

    object.position.set(
        0,
        1.4,
        -2
    );

    scene.add(object);

    objects.push(object);

    selectedObject =
        object;

    updateStatus(filename);
}


/* =====================================================
   TEKST DO MENU
===================================================== */

function textTexture(
    text,
    size=38
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 1024;
    canvas.height = 180;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font =
        "bold " +
        size +
        "px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "#00ffff";

    ctx.shadowBlur =
        20;

    ctx.fillText(
        text,
        512,
        90
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


/* =====================================================
   PRZYCISK MENU
===================================================== */

function makeButton(
    label,
    action,
    x,
    y
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        .06
    );

    const geometry =
        new THREE.PlaneGeometry(
            .47,
            .19
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:0x06171d,
            transparent:true,
            opacity:.98,
            side:THREE.DoubleSide
        });

    const body =
        new THREE.Mesh(
            geometry,
            material
        );

    body.userData.button =
        true;

    body.userData.action =
        action;

    group.add(body);

    const border =
        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                geometry
            ),

            new THREE.LineBasicMaterial({
                color:0x00ffff
            })

        );

    border.position.z =
        .008;

    group.add(border);

    const text =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                .42,
                .065
            ),

            new THREE.MeshBasicMaterial({
                map:textTexture(
                    label,
                    35
                ),
                transparent:true,
                side:THREE.DoubleSide
            })

        );

    text.position.z =
        .015;

    group.add(text);

    menu.add(group);

    buttons.push(body);
}

/* =====================================================
   POZYCJA MENU
===================================================== */

function placeMenu(){

    if(!menu)
        return;

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );

    menu.position.copy(
        camera.position
    );

    menu.position.add(
        direction.multiplyScalar(1.35)
    );

    menu.lookAt(
        camera.position
    );
}

        return;

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );

    miniMenu.position.copy(
        camera.position
    );

    miniMenu.position.add(
        direction.multiplyScalar(1)
    );

    miniMenu.lookAt(
        camera.position
    );
}


/* =====================================================
   MENU
===================================================== */

function toggleMenu(){

    menuOpen =
        !menuOpen;

    menu.visible =
        menuOpen;

    miniMenu.visible =
        !menuOpen;

    if(!menuOpen)
        placeMiniMenu();
}

   NOWY PLIK

function chooseAnotherFile(){

/* =====================================================
   FUNKCJE OBIEKTU
===================================================== */

function toggleLock(){

    locked =
        !locked;

    updateStatus(
        locked
            ? "OBIEKT ZABLOKOWANY"
            : "OBIEKT ODBLOKOWANY"
    );
}


function toggleAutoRotate(){

    autoRotate =
        !autoRotate;
}


function scaleObject(
    factor
){

    if(
        !selectedObject ||
        locked
    )
        return;

    const value =
        THREE.MathUtils.clamp(
            selectedObject.scale.x *
            factor,
            .01,
            50
        );

    selectedObject.scale.setScalar(
        value
    );
}


function rotateAxis(
    axis
){

    if(
        !selectedObject ||
        locked
    )
        return;

    selectedObject.rotation[axis] +=
        THREE.MathUtils.degToRad(15);
}


function centerObject(){

    if(
        !selectedObject ||
        locked
    )
        return;

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );

    selectedObject.position.copy(
        camera.position
    );

    selectedObject.position.add(
        direction.multiplyScalar(2)
    );
}


function fitObject(){

    if(!selectedObject)
        return;

    const box =
        new THREE.Box3()
        .setFromObject(
            selectedObject
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if(
        max > 0 &&
        Number.isFinite(max)
    ){

        selectedObject.scale.multiplyScalar(
            1/max
        );

    }
}


function resetObject(){

    if(
        !selectedObject ||
        locked
    )
        return;

    selectedObject.position.set(
        0,
        1.4,
        -2
    );

    selectedObject.rotation.set(
        0,
        0,
        0
    );

    selectedObject.scale.setScalar(
        1
    );

    fitObject();
}


function nextObject(){

    if(objects.length===0)
        return;

    const index =
        objects.indexOf(
            selectedObject
        );

    const next =
        (index+1)%objects.length;

    selectedObject =
        objects[next];

    updateStatus(
        selectedObject.userData.filename
    );
}


function deleteObject(){

    if(!selectedObject)
        return;

    const index =
        objects.indexOf(
            selectedObject
        );

    if(index>=0)
        objects.splice(
            index,
            1
        );

    scene.remove(
        selectedObject
    );

    selectedObject =
        objects.length
            ? objects[0]
            : null;
}


function toggleGrid(){

    if(!grid){

        grid =
            new THREE.GridHelper(
                10,
                20,
                0x00ffff,
                0x003344
            );

        scene.add(grid);

    }
    else{

        grid.visible =
            !grid.visible;

    }
}


/* =====================================================
   RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();

const rayMatrix =
    new THREE.Matrix4();


function setRay(controller){

    rayMatrix
        .identity()
        .extractRotation(
            controller.matrixWorld
        );

    raycaster.ray.origin
        .setFromMatrixPosition(
            controller.matrixWorld
        );

    raycaster.ray.direction
        .set(
            0,
            0,
            -1
        )
        .applyMatrix4(
            rayMatrix
        );
}


/* =====================================================
   KLIK CONTROLLERA
===================================================== */

function controllerSelect(
    controller
){

    setRay(controller);


    /* MINI MENU */

    if(
        miniMenu &&
        miniMenu.visible
    ){

        const hits =
            raycaster.intersectObjects(
                miniMenu.children,
                true
            );

        if(hits.length){

            let obj =
                hits[0].object;

            while(
                obj &&
                !obj.userData.mini
            ){

                obj =
                    obj.parent;

            }

            if(
                obj &&
                obj.userData.mini
            ){

                obj.userData.action();

                return;
            }
        }
    }


    /* PEŁNE MENU */

    if(
        menu &&
        menu.visible
    ){

        const hits =
            raycaster.intersectObjects(
                buttons,
                false
            );

        if(hits.length){

            hits[0]
                .object
                .userData
                .action();

            return;
        }
    }


    /* OBIEKT */

    const hits =
        raycaster.intersectObjects(
            objects,
            true
        );

    if(!hits.length)
        return;

    let object =
        hits[0].object;

    while(
        object.parent &&
        !objects.includes(object)
    ){

        object =
            object.parent;
    }

    if(
        !objects.includes(object)
    )
        return;

    selectedObject =
        object;

    updateStatus(
        object.userData.filename
    );

    if(locked)
        return;

    grabbed =
        true;

    grabbedController =
        controller;

    grabDistance =
        controller.position.distanceTo(
            object.position
        );

    grabScale =
        object.scale.x;
}


function controllerRelease(
    controller
){

    if(
        grabbedController ===
        controller
    ){

        grabbed = false;

        grabbedController =
            null;
    }
}


/* =====================================================
   CONTROLLERY
===================================================== */

controller1.addEventListener(
    "selectstart",
    () => controllerSelect(
        controller1
    )
);

controller2.addEventListener(
    "selectstart",
    () => controllerSelect(
        controller2
    )
);

controller1.addEventListener(
    "selectend",
    () => controllerRelease(
        controller1
    )
);

controller2.addEventListener(
    "selectend",
    () => controllerRelease(
        controller2
    )
);


/* =====================================================
   JOYSTICK
===================================================== */

function getJoystick(){

    if(!session)
        return {
            x:0,
            y:0
        };

    for(
        const source of
        session.inputSources
    ){

        if(!source.gamepad)
            continue;

        const axes =
            source.gamepad.axes;

        let x=0;
        let y=0;

        if(axes.length>=4){

            x =
                axes[2] || 0;

            y =
                axes[3] || 0;

        }
        else if(axes.length>=2){

            x =
                axes[0] || 0;

            y =
                axes[1] || 0;

        }

        if(
            Math.abs(x)>.12 ||
            Math.abs(y)>.12
        ){

            return {x,y};

        }
    }

    return {
        x:0,
        y:0
    };
}


/* =====================================================
   UPDATE OBIEKTU
===================================================== */

function updateObject(){

    if(!selectedObject)
        return;


    if(
        autoRotate &&
        !locked
    ){

        selectedObject.rotation.y +=
            .006;

    }


    const stick =
        getJoystick();


    /* JOYSTICK = ZOOM */

    if(
        Math.abs(stick.y)>.12 &&
        !locked
    ){

        scaleObject(
            1 -
            stick.y*.025
        );

    }


    /* ROTACJA */

    if(
        mode==="ROTATE" &&
        Math.abs(stick.x)>.12 &&
        !locked
    ){

        selectedObject.rotation.y +=
            stick.x*.035;

    }


    /* PRZESUWANIE */

    if(
        grabbed &&
        grabbedController &&
        !locked &&
        mode==="MOVE"
    ){

        setRay(
            grabbedController
        );

        const position =
            raycaster.ray.origin
            .clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    grabDistance
                )
            );

        selectedObject.position.lerp(
            position,
            .25
        );
    }


    /* SKALOWANIE */

    if(
        grabbed &&
        grabbedController &&
        !locked &&
        mode==="SCALE"
    ){

        const distance =
            grabbedController.position
            .distanceTo(
                selectedObject.position
            );

        const scale =
            THREE.MathUtils.clamp(
                grabScale *
                distance /
                Math.max(
                    .01,
                    grabDistance
                ),
                .01,
                50
            );

        selectedObject.scale.setScalar(
            scale
        );
    }
}


/* =====================================================
   DWIE RĘCE
===================================================== */

function updateTwoHands(){

    if(
        !selectedObject ||
        locked ||
        mode!=="SCALE"
    ){

        twoHandStart =
            null;

        return;
    }


    const distance =
        controller1.position
        .distanceTo(
            controller2.position
        );


    if(distance<.1){

        twoHandStart =
            null;

        return;
    }


    if(!twoHandStart){

        twoHandStart = {
            distance,
            scale:
                selectedObject.scale.x
        };

        return;
    }


    const factor =
        distance /
        twoHandStart.distance;


    selectedObject.scale.setScalar(

        THREE.MathUtils.clamp(
            twoHandStart.scale *
            factor,
            .01,
            50
        )

    );
}


/* =====================================================
   LASER
===================================================== */

function updateLaser(
    controller,
    laser
){

    if(
        !renderer.xr.isPresenting
    ){

        laser.visible=false;

        return;
    }


    laser.visible=true;

    setRay(controller);


    const menuObjects=[];


    if(
        menu &&
        menu.visible
    ){

        menuObjects.push(
            ...buttons
        );
    }


    if(
        miniMenu &&
        miniMenu.visible
    ){

        menuObjects.push(
            ...miniMenu.children
        );
    }


    const hits =
        raycaster.intersectObjects(
            menuObjects,
            true
        );


    if(hits.length){

        laser.scale.z =
            Math.max(
                .1,
                hits[0].distance
            );

    }
    else{

        laser.scale.z=8;

    }
}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(text){

    xrStatus.textContent =
        text || "";

    xrStatus.classList.add(
        "show"
    );

    clearTimeout(
        updateStatus.timer
    );

    updateStatus.timer =
        setTimeout(
            () => {

                xrStatus.classList.remove(
                    "show"
                );

            },
            1800
        );
}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

    errorText.textContent =
        text;

    errorBox.style.display =
        "block";

    setTimeout(
        () => {

            errorBox.style.display =
                "none";

        },
        8000
    );
}


/* =====================================================
   START XR
===================================================== */

async function enterAR(){

    /*
       NAJWAŻNIEJSZE:

       Przycisk zawsze działa.
       Dopiero tutaj sprawdzamy plik.
    */

    if(!selectedFile){

        message.textContent =
            "⚠ Najpierw wybierz zdjęcie lub model 3D.";

        return;
    }


    if(!navigator.xr){

        showError(
            "WebXR nie jest dostępny."
        );

        return;
    }


    try{

        message.textContent =
            "Sprawdzanie WebXR...";


        const supported =
            await navigator.xr
            .isSessionSupported(
                "immersive-ar"
            );


        if(!supported){

            showError(
                "immersive-ar nie jest obsługiwane."
            );

            return;
        }


        message.textContent =
            "Uruchamianie Passthrough...";


        session =
            await navigator.xr.requestSession(
                "immersive-ar",
                {

                    requiredFeatures:[
                        "local"
                    ],

                    optionalFeatures:[
                        "local-floor",
                        "bounded-floor",
                        "hand-tracking",
                        "anchors",
                        "hit-test",
                        "dom-overlay"
                    ],

                    domOverlay:{
                        root:
                            document.getElementById(
                                "xrOverlay"
                            )
                    }

                }
            );


        await renderer.xr.setSession(
            session
        );


        desktopUI.style.display =
            "none";


        createMenu();

        createMiniMenu();


        /* ŁADOWANIE PLIKU DOPIERO TERAZ */

        updateStatus(
            "Wczytywanie " +
            selectedFile.name
        );


        try{

            const object =
                await loadFile(
                    selectedFile
                );

            addObject(
                object,
                selectedFile.name
            );

            updateStatus(
                "GOTOWE"
            );

        }
        catch(error){

            console.error(error);

            showError(
                "Nie udało się wczytać pliku:\n\n" +
                error.message
            );

        }


        setTimeout(
            () => {
                placeMenu();
            },
            100
        );


        session.addEventListener(
            "end",
            () => {

                desktopUI.style.display =
                    "flex";

                session =
                    null;

                if(menu)
                    menu.visible=false;

                if(miniMenu)
                    miniMenu.visible=false;

            }
        );

    }
    catch(error){

        console.error(error);

        showError(
            "Nie udało się uruchomić Passthrough:\n\n" +
            error.name +
            "\n" +
            error.message
        );

    }
}


/* =====================================================
   PRZYCISK
===================================================== */

enterXR.addEventListener(
    "click",
    enterAR
);


/* =====================================================
   RENDER
===================================================== */

renderer.setAnimationLoop(
    () => {

        if(
            renderer.xr.isPresenting
        ){

            updateLaser(
                controller1,
                laser1
            );

            updateLaser(
                controller2,
                laser2
            );

            updateObject();

            updateTwoHands();

        }


        renderer.render(
            scene,
            camera
        );

    }
);

===================================================== */

window.addEventListener(

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
