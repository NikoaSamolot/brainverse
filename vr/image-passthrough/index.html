<html lang="pl">

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js";

import { ARButton } from
"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/webxr/ARButton.js";


/* =====================================================
   GLOBAL
===================================================== */

let renderer;
let scene;
let camera;

let controller1;
let controller2;

let session=null;

let photo=null;

let photos=[];

let currentPhotoIndex=-1;

let texture=null;


/* MENU */

let menu=null;

let miniMenu=null;

let menuButtons=[];

let selectedButton=null;

let menuVisible=true;

let menuMoving=false;

let menuMoveController=null;

let menuMoveDistance=1.2;


/* PHOTO */

let mode="MOVE";

let locked=false;

let dragging=false;

let activeController=null;

let dragDistance=2;

let startScale=1;

let twoHandStart=null;

let frameEnabled=false;

let frameMesh=null;

let gridMesh=null;

let photoOpacity=1;


/* =====================================================
   DOM
===================================================== */

const startScreen =
document.getElementById("start");

const fileInput =
document.getElementById("file");

const startVR =
document.getElementById("startVR");

const info =
document.getElementById("info");


/* =====================================================
   THREE
===================================================== */

scene=new THREE.Scene();

camera=
new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .01,
    100
);


renderer=
new THREE.WebGLRenderer({

    antialias:true,

    alpha:true,

    powerPreference:
        "high-performance"

});


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.xr.enabled=true;

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.setClearColor(
    0x000000,
    0
);

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   WEBXR
===================================================== */

const arButton=
ARButton.createButton(
    renderer,
    {

        requiredFeatures:[
            "local-floor"
        ],

        optionalFeatures:[
            "hand-tracking",
            "anchors",
            "hit-test",
            "bounded-floor"
        ]

    }
);

arButton.style.display="none";

document.body.appendChild(
    arButton
);


/* =====================================================
   CONTROLLERS
===================================================== */

controller1=
renderer.xr.getController(0);

controller2=
renderer.xr.getController(1);

scene.add(
    controller1,
    controller2
);


/* =====================================================
   LASERS
===================================================== */

function createLaser(){

    const geometry=
        new THREE.BufferGeometry();

    geometry.setFromPoints([

        new THREE.Vector3(0,0,0),

        new THREE.Vector3(0,0,-1)

    ]);

    const material=
        new THREE.LineBasicMaterial({

            color:0x00ffff,

            transparent:true,

            opacity:.95

        });

    const line=
        new THREE.Line(
            geometry,
            material
        );

    line.scale.z=8;

    return line;

}


const laser1=createLaser();
const laser2=createLaser();

controller1.add(laser1);
controller2.add(laser2);


/* =====================================================
   LASER DOTS
===================================================== */

function createDot(){

    return new THREE.Mesh(

        new THREE.SphereGeometry(
            .018,
            12,
            12
        ),

        new THREE.MeshBasicMaterial({
            color:0x00ffff
        })

    );

}

const dot1=createDot();
const dot2=createDot();

scene.add(
    dot1,
    dot2
);


/* =====================================================
   RAYCASTER
===================================================== */

const raycaster=
    new THREE.Raycaster();

const tempMatrix=
    new THREE.Matrix4();


function controllerRay(
    controller
){

    tempMatrix
        .identity()
        .extractRotation(
            controller.matrixWorld
        );

    raycaster.ray.origin
        .setFromMatrixPosition(
            controller.matrixWorld
        );

    raycaster.ray.direction
        .set(0,0,-1)
        .applyMatrix4(
            tempMatrix
        );

}


/* =====================================================
   IMAGE LOADING
===================================================== */

fileInput.addEventListener(
    "change",
    ()=>{

        const file=
            fileInput.files?.[0];

        if(!file)
            return;

        const url=
            URL.createObjectURL(file);

        const img=
            new Image();

        img.onload=()=>{

            addPhoto(
                img,
                file.name
            );

            URL.revokeObjectURL(
                url
            );

            if(
                !renderer.xr.isPresenting
            ){

                arButton.click();

            }

        };

        img.src=url;

    }
);


/* =====================================================
   CREATE PHOTO
===================================================== */

function addPhoto(
    img,
    name
){

    const tex=
        new THREE.Texture(img);

    tex.colorSpace=
        THREE.SRGBColorSpace;

    tex.needsUpdate=true;


    const aspect=
        img.naturalWidth/
        img.naturalHeight;


    const h=1;

    const w=h*aspect;


    const geometry=
        new THREE.PlaneGeometry(
            w,
            h
        );


    const material=
        new THREE.MeshBasicMaterial({

            map:tex,

            transparent:true,

            opacity:1,

            depthWrite:false,

            side:THREE.DoubleSide

        });


    const mesh=
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        0,
        1.5,
        -2
    );


    mesh.userData.name=
        name || "PHOTO";


    scene.add(mesh);

    photos.push(mesh);

    currentPhotoIndex=
        photos.length-1;

    selectPhoto(mesh);

}


/* =====================================================
   SELECT PHOTO
===================================================== */

function selectPhoto(
    mesh
){

    photo=mesh;

    updateFrame();

}


/* =====================================================
   TEXTURE TEXT
===================================================== */

function textTexture(
    text,
    width=1024,
    height=256,
    fontSize=60
){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=width;
    canvas.height=height;

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle="#ffffff";

    ctx.font=
        "bold "+
        fontSize+
        "px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.shadowColor=
        "rgba(0,255,255,.9)";

    ctx.shadowBlur=15;

    ctx.fillText(
        text,
        width/2,
        height/2
    );

    const texture=
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    return texture;

}


/* =====================================================
   MENU BUTTON
===================================================== */

function createButton(
    label,
    action,
    x,
    y
){

    const group=
        new THREE.Group();

    group.position.set(
        x,
        y,
        .03
    );


    const body=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                .49,
                .23
            ),

            new THREE.MeshBasicMaterial({

                color:0x06151b,

                transparent:true,

                opacity:.95,

                side:THREE.DoubleSide

            })

        );


    body.userData.button=true;

    body.userData.action=
        action;

    body.userData.normal=
        0x06151b;

    body.userData.hover=
        0x00dfff;


    group.add(body);


    const border=
        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                new THREE.PlaneGeometry(
                    .49,
                    .23
                )
            ),

            new THREE.LineBasicMaterial({

                color:0x00ffff,

                transparent:true,

                opacity:.6

            })

        );


    border.position.z=.006;

    group.add(border);


    const text=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                .45,
                .09
            ),

            new THREE.MeshBasicMaterial({

                map:
                    textTexture(
                        label,
                        512,
                        128,
                        42
                    ),

                transparent:true,

                side:THREE.DoubleSide

            })

        );


    text.position.z=.012;

    text.position.y=-.055;

    group.add(text);


    body.userData.border=
        border;

    body.userData.group=
        group;


    menu.add(group);

    menuButtons.push(
        body
    );


    return body;

}


/* =====================================================
   CREATE MAIN MENU
===================================================== */

function createMenu(){

    menu=
        new THREE.Group();


    /* BACKGROUND */

    const bg=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                3.15,
                1.65
            ),

            new THREE.MeshBasicMaterial({

                color:0x02090d,

                transparent:true,

                opacity:.96,

                side:THREE.DoubleSide

            })

        );


    bg.position.z=-.03;

    bg.userData.menuBackground=
        true;

    menu.add(bg);


    /* BORDER */

    const border=
        new THREE.LineSegments(

            new THREE.EdgesGeometry(
                new THREE.PlaneGeometry(
                    3.15,
                    1.65
                )
            ),

            new THREE.LineBasicMaterial({

                color:0x00ffff,

                transparent:true,

                opacity:.9

            })

        );


    border.position.z=.01;

    menu.add(border);


    /* TITLE */

    const title=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                2.9,
                .16
            ),

            new THREE.MeshBasicMaterial({

                map:
                    textTexture(
                        "PHOTO//SPACE",
                        1024,
                        128,
                        72
                    ),

                transparent:true

            })

        );


    title.position.set(
        0,
        .68,
        .02
    );

    menu.add(title);


    /* SUBTITLE */

    const subtitle=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                2.8,
                .08
            ),

            new THREE.MeshBasicMaterial({

                map:
                    textTexture(
                        "QUEST 3 // MIXED REALITY CONTROL",
                        1024,
                        128,
                        32
                    ),

                transparent:true

            })

        );


    subtitle.position.set(
        0,
        .54,
        .02
    );

    menu.add(subtitle);


    /* =================================================
       ROW 1
    ================================================= */

    const row1=[

        ["MOVE",()=>{
            mode="MOVE";
        }],

        ["SCALE",()=>{
            mode="SCALE";
        }],

        ["ROTATE",()=>{
            mode="ROTATE";
        }],

        ["ANCHOR",()=>{
            locked=true;
        }],

        ["LOCK",()=>{
            locked=!locked;
        }],

        ["MOVE UI",()=>{
            mode="MENU";
        }]

    ];


    for(
        let i=0;
        i<row1.length;
        i++
    ){

        createButton(
            row1[i][0],
            row1[i][1],
            -1.35+i*.54,
            .30
        );

    }


    /* =================================================
       ROW 2
    ================================================= */

    const row2=[

        ["PHOTOS",nextPhoto],

        ["ADD PHOTO",addPhotoVR],

        ["FRAME",toggleFrame],

        ["OPACITY",cycleOpacity],

        ["GRID",toggleGrid],

        ["CENTER",centerPhoto]

    ];


    for(
        let i=0;
        i<row2.length;
        i++
    ){

        createButton(
            row2[i][0],
            row2[i][1],
            -1.35+i*.54,
            -.01
        );

    }


    /* =================================================
       ROW 3
    ================================================= */

    const row3=[

        ["RESET",resetPhoto],

        ["HIDE",hidePhoto],

        ["DELETE",deletePhoto],

        ["MENU",toggleMenu],

        ["MINI",toggleMini],

        ["ZOOM 1:1",resetZoom]

    ];


    for(
        let i=0;
        i<row3.length;
        i++
    ){

        createButton(
            row3[i][0],
            row3[i][1],
            -1.35+i*.54,
            -.32
        );

    }


    /* STATUS */

    const status=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                2.8,
                .10
            ),

            new THREE.MeshBasicMaterial({

                map:
                    textTexture(
                        "● SYSTEM ONLINE   //   JOYSTICK = ZOOM",
                        1024,
                        128,
                        30
                    ),

                transparent:true

            })

        );


    status.position.set(
        0,
        -.62,
        .02
    );

    menu.add(status);


    scene.add(menu);

}


/* =====================================================
   MINI MENU
===================================================== */

function createMiniMenu(){

    miniMenu=
        new THREE.Group();


    miniMenu.visible=false;


    const bg=
        new THREE.Mesh(

            new THREE.CircleGeometry(
                .115,
                32
            ),

            new THREE.MeshBasicMaterial({

                color:0x04141a,

                transparent:true,

                opacity:.96,

                side:THREE.DoubleSide

            })

        );


    bg.userData.miniButton=true;

    bg.userData.action=
        toggleMenu;


    miniMenu.add(bg);


    const ring=
        new THREE.Mesh(

            new THREE.RingGeometry(
                .115,
                .13,
                32
            ),

            new THREE.MeshBasicMaterial({

                side:THREE.DoubleSide

        new THREE.Mesh(

            new THREE.PlaneGeometry(

                .08

/* =====================================================
   PLACE MENU IN FRONT
===================================================== */

function placeMenu(){

    if(!menu)
        return;


    const direction=
        new THREE.Vector3(
            0,0,-1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    const pos=
        camera.position.clone();


    pos.add(
        direction.multiplyScalar(
            1.25
        )
    );


    pos.y=
        camera.position.y;


    menu.position.copy(pos);


    const look=
        camera.position.clone();


    look.y=
        menu.position.y;


    menu.lookAt(
        look
    );

}


/* =====================================================
   MINI POSITION
===================================================== */

function placeMini(){

    if(!miniMenu)
        return;


    const direction=
        new THREE.Vector3(
            0,0,-1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    const pos=
        camera.position.clone();


    pos.add(
        direction.multiplyScalar(
            1.0
        )
    );


    pos.y=
        camera.position.y;


    miniMenu.position.copy(
        pos
    );


    const look=
        camera.position.clone();


    look.y=
        miniMenu.position.y;


    miniMenu.lookAt(
        look
    );

}


/* =====================================================
   MENU TOGGLE
===================================================== */

function toggleMenu(){

    if(!menu)
        return;


    menuVisible=
        !menuVisible;


    menu.visible=
        menuVisible;


    if(miniMenu){

        miniMenu.visible=
            !menuVisible;

        if(
            !menuVisible
        ){

            placeMini();

        }

    }

}


/* =====================================================
   MINI TOGGLE
===================================================== */

function toggleMini(){

    toggleMenu();

}


/* =====================================================
   MENU MOVEMENT
===================================================== */

function startMenuMove(
    controller
){

    menuMoving=true;

    menuMoveController=
        controller;

    menuMoveDistance=
        controller.position
        .distanceTo(
            menu.position
        );

}


function updateMenuMove(){

    if(
        !menuMoving ||
        !menuMoveController ||
        !menu
    )
        return;


    controllerRay(
        menuMoveController
    );


    const target=
        raycaster.ray.origin.clone()
        .add(
            raycaster.ray.direction
            .clone()
            .multiplyScalar(
                menuMoveDistance
            )
        );


    menu.position.lerp(
        target,
        .2
    );


    const look=
        camera.position.clone();


    look.y=
        menu.position.y;


    menu.lookAt(
        look
    );

}


/* =====================================================
   PHOTO FUNCTIONS
===================================================== */

function resetPhoto(){

    if(!photo)
        return;


    photo.position.set(
        0,
        camera.position.y,
        -2
    );

    photo.rotation.set(
        0,0,0
    );

    photo.scale.setScalar(
        1
    );

    photo.material.opacity=1;

    locked=false;

    photoOpacity=1;

}


function resetZoom(){

    if(photo)
        photo.scale.setScalar(
            1
        );

}


function centerPhoto(){

    if(!photo)
        return;


    const dir=
        new THREE.Vector3(
            0,0,-1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    photo.position=
        camera.position.clone()
        .add(
            dir.multiplyScalar(
                2
            )
        );

}


function hidePhoto(){

    if(photo)
        photo.visible=
            !photo.visible;

}


function nextPhoto(){

    if(
        photos.length===0
    )
        return;


    currentPhotoIndex++;

    if(
        currentPhotoIndex>=
        photos.length
    )
        currentPhotoIndex=0;


    selectPhoto(
        photos[
            currentPhotoIndex
        ]
    );

}


function deletePhoto(){

    if(!photo)
        return;


    const index=
        photos.indexOf(
            photo
        );


    scene.remove(
        photo
    );


    photo.geometry.dispose();

    photo.material.map?.dispose();

    photo.material.dispose();


    photos.splice(
        index,
        1
    );


    if(
        photos.length
    ){

        currentPhotoIndex=
            Math.max(
                0,
                index-1
            );

        selectPhoto(
            photos[
                currentPhotoIndex
            ]
        );

    }
    else{

        photo=null;

    }

}


function toggleFrame(){

    frameEnabled=
        !frameEnabled;

    updateFrame();

}


function updateFrame(){

    if(frameMesh){

        scene.remove(
            frameMesh
        );

        frameMesh.geometry.dispose();

        frameMesh.material.dispose();

        frameMesh=null;

    }


    if(
        !photo ||
        !frameEnabled
    )
        return;


    const width=
        photo.geometry.parameters.width;

    const height=
        photo.geometry.parameters.height;


    const geometry=
        new THREE.EdgesGeometry(

            new THREE.PlaneGeometry(
                width+.06,
                height+.06
            )

        );


    const material=
        new THREE.LineBasicMaterial({

            color:0x00ffff,

            transparent:true,

            opacity:.9

        });


    frameMesh=
        new THREE.LineSegments(
            geometry,
            material
        );


    frameMesh.position.copy(
        photo.position
    );

    frameMesh.rotation.copy(
        photo.rotation
    );

    frameMesh.scale.copy(
        photo.scale
    );


    scene.add(
        frameMesh
    );

}


function cycleOpacity(){

    if(!photo)
        return;


    photoOpacity-=.2;


    if(
        photoOpacity<.2
    )
        photoOpacity=1;


    photo.material.opacity=
        photoOpacity;

}


function toggleGrid(){

    if(gridMesh){

        scene.remove(
            gridMesh
        );

        gridMesh.geometry.dispose();

        gridMesh.material.dispose();

        gridMesh=null;

        return;

    }


    gridMesh=
        new THREE.GridHelper(
            10,
            20,
            0x00ffff,
            0x004455
        );


    gridMesh.position.y=.01;

    scene.add(
        gridMesh
    );

}


/* =====================================================
   ADD PHOTO FROM VR
===================================================== */

async function addPhotoVR(){

    if(session){

        await session.end();

    }


    setTimeout(
        ()=>{
            fileInput.click();
        },
        400
    );

}


/* =====================================================
   HOVER
===================================================== */

function clearHover(){

    if(!selectedButton)
        return;


    if(
        selectedButton.userData.button
    ){

        selectedButton.material.color
            .setHex(
                selectedButton.userData.normal
            );

    }


    selectedButton=null;

}


function setHover(
    button
){

    if(
        selectedButton===button
    )
        return;


    clearHover();


    selectedButton=
        button;


    if(
        button.userData.button
    ){

        button.material.color
            .setHex(
                button.userData.hover
            );

    }

}


/* =====================================================
   LASER
===================================================== */

function updateLaser(
    controller,
    laser,
    dot
){

    controllerRay(
        controller
    );


    laser.visible=
        renderer.xr.isPresenting;


    dot.visible=
        renderer.xr.isPresenting;


    const targets=[];


    if(
        menu &&
        menu.visible
    ){

        targets.push(
            ...menuButtons
        );

    }


    if(
        miniMenu &&
        miniMenu.visible
    ){

        targets.push(
            ...miniMenu.children
                .filter(
                    x =>
                        x.userData
                        .miniButton
                )
        );

    }


    if(photo)
        targets.push(photo);


    const hits=
        raycaster.intersectObjects(
            targets,
            false
        );


    if(hits.length){

        const point=
            hits[0].point;


        dot.position.copy(
            point
        );


        const local=
            controller.worldToLocal(
                point.clone()
            );


        laser.scale.z=
            Math.max(
                .15,
                Math.abs(local.z)
            );


        if(
            hits[0].object.userData.button
        ){

            setHover(
                hits[0].object
            );

        }
        else if(
            hits[0].object.userData.miniButton
        ){

            clearHover();

        }

    }
    else{

        const far=
            raycaster.ray.origin.clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    8
                )
            );


        dot.position.copy(
            far
        );

        laser.scale.z=8;

        clearHover();

    }

}


/* =====================================================
   CONTROLLER CLICK
===================================================== */

function controllerSelect(
    controller
){

    controllerRay(
        controller
    );


    /* MINI MENU */

    if(
        miniMenu &&
        miniMenu.visible
    ){

        const hits=
            raycaster.intersectObjects(
                miniMenu.children,
                false
            );


        if(hits.length){

            const obj=
                hits[0].object;


            if(
                obj.userData.miniButton
            ){

                obj.userData.action();

                return;

            }

        }

    }


    /* MAIN MENU */

    if(
        menu &&
        menu.visible
    ){

        const hits=
            raycaster.intersectObjects(
                menuButtons,
                false
            );


        if(hits.length){

            const button=
                hits[0].object;


            button.userData.action();

            return;

        }


        /*
           Jeśli tryb MOVE UI,
           kliknięcie w panel chwyta panel.
        */

        if(
            mode==="MENU"
        ){

            const all=
                raycaster.intersectObject(
                    menu,
                    true
                );


            if(all.length){

                startMenuMove(
                    controller
                );

                return;

            }

        }

    }


    /* PHOTO */

    if(
        !photo ||
        locked
    )
        return;


    const hits=
        raycaster.intersectObject(
            photo,
            false
        );


    if(!hits.length)
        return;


    dragging=true;

    activeController=
        controller;


    dragDistance=
        controller.position
        .distanceTo(
            photo.position
        );


    startScale=
        photo.scale.x;

}


/* =====================================================
   CONTROLLER SELECT EVENTS
===================================================== */

controller1.addEventListener(
    "selectstart",
    ()=>{
        controllerSelect(
            controller1
        );
    }
);


controller2.addEventListener(
    "selectstart",
    ()=>{
        controllerSelect(
            controller2
        );
    }
);


controller1.addEventListener(
    "selectend",
    ()=>{
        if(
            activeController===
            controller1
        ){

            dragging=false;

            activeController=null;

        }


        if(
            menuMoveController===
            controller1
        ){

            menuMoving=false;

            menuMoveController=null;

        }

    }
);


controller2.addEventListener(
    "selectend",
    ()=>{
        if(
            activeController===
            controller2
        ){

            dragging=false;

            activeController=null;

        }


        if(
            menuMoveController===
            controller2
        ){

            menuMoving=false;

            menuMoveController=null;

        }

    }
);


/* =====================================================
   QUEST JOYSTICKS
===================================================== */

function getThumbstickY(
    controller
){

    const inputSources=
        renderer.xr
            .getSession()
            ?.inputSources;


    if(!inputSources)
        return 0;


    for(
        const source
        of inputSources
    ){

        if(
            source.targetRayMode!==
            "tracked-pointer"
        )
            continue;


        const gamepad=
            source.gamepad;


        if(!gamepad)
            continue;


        /*
           Quest Touch Plus zwykle udostępnia
           stick jako axes[2] / axes[3].
        */

        if(
            gamepad.axes.length>=4
        ){

            const x=
                gamepad.axes[2];

            const y=
                gamepad.axes[3];


            if(
                Math.abs(y)>.15
            )
                return y;

        }


        /*
           Fallback dla innych mappingów.
        */

        if(
            gamepad.axes.length>=2
        ){

            const y=
                gamepad.axes[1];


            if(
                Math.abs(y)>.15
            )
                return y;

        }

    }


    return 0;

}


/* =====================================================
   JOYSTICK ZOOM
===================================================== */

function updateJoystickZoom(){

    if(
        !photo ||
        locked
    )
        return;


    const y=
        getThumbstickY();


    if(
        Math.abs(y)<.12
    )
        return;


    /*
       W dół = oddalenie
       W górę = przybliżenie
    */

    const speed=.018;


    const factor=
        1 -
        y*speed;


    const next=
        THREE.MathUtils.clamp(
            photo.scale.x *
            factor,
            .05,
            20
        );


    photo.scale.setScalar(
        next
    );


    if(frameMesh){

        frameMesh.scale.copy(
            photo.scale
        );

    }

}


/* =====================================================
   PHOTO MOVEMENT
===================================================== */

function updatePhotoMovement(){

    if(
        !photo ||
        locked
    )
        return;


    updateJoystickZoom();


    /*
       TWO CONTROLLER SCALE
    */

    const distance=
        controller1.position
        .distanceTo(
            controller2.position
        );


    if(
        distance>.08 &&
        mode==="SCALE"
    ){

        if(!twoHandStart){

            twoHandStart={
                distance,
                scale:photo.scale.x
            };

        }
        else{

            const factor=
                distance/
                twoHandStart.distance;


            const scale=
                THREE.MathUtils.clamp(
                    twoHandStart.scale*
                    factor,
                    .05,
                    20
                );


            photo.scale.setScalar(
                scale
            );

        }

    }
    else{

        twoHandStart=null;

    }


    /*
       MENU MOVEMENT
    */

    updateMenuMove();


    /*
       PHOTO DRAG
    */

    if(
        !dragging ||
        !activeController
    )
        return;


    if(mode==="MOVE"){

        controllerRay(
            activeController
        );


        const target=
            raycaster.ray.origin.clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    dragDistance
                )
            );


        photo.position.lerp(
            target,
            .28
        );

    }


    if(mode==="SCALE"){

        const d=
            activeController.position
            .distanceTo(
                photo.position
            );


        const scale=
            THREE.MathUtils.clamp(

                startScale*
                (
                    d/
                    Math.max(
                        .01,
                        dragDistance
                    )
                ),

                .05,
                20

            );


        photo.scale.setScalar(
            scale
        );

    }


    if(mode==="ROTATE"){

        const dx=
            activeController.position.x-
            photo.position.x;


        const dz=
            activeController.position.z-
            photo.position.z;


        photo.rotation.y=
            Math.atan2(
                dx,
                dz
            );

    }


    if(frameMesh){

        frameMesh.position.copy(
            photo.position
        );

        frameMesh.rotation.copy(
            photo.rotation
        );

        frameMesh.scale.copy(
            photo.scale
        );

    }

}


/* =====================================================
   START VR
===================================================== */

startVR.onclick=()=>{

    if(!photo){

        alert(
            "Najpierw wybierz zdjęcie."
        );

        return;

    }


    arButton.click();

};


/* =====================================================
   XR START
===================================================== */

renderer.xr.addEventListener(
    "sessionstart",
    ()=>{

        session=
            renderer.xr.getSession();


        startScreen.style.display=
            "none";


        info.style.display=
            "block";


        if(!menu)
            createMenu();


        if(!miniMenu)
            createMiniMenu();


        menu.visible=true;

        menuVisible=true;

        miniMenu.visible=false;


        setTimeout(
            ()=>{
                placeMenu();
                placeMini();
            },
            200
        );


        setTimeout(
            ()=>{
                info.style.display=
                    "none";
            },
            5000
        );

    }
);


/* =====================================================
   XR END
===================================================== */

renderer.xr.addEventListener(
    "sessionend",
    ()=>{

        session=null;

        if(menu){

            scene.remove(menu);

            menu=null;

            menuButtons=[];

        }


        if(miniMenu){

            scene.remove(
                miniMenu
            );

            miniMenu=null;

        }


        selectedButton=null;

        dragging=false;

        menuMoving=false;

        activeController=null;

        menuMoveController=null;


        startScreen.style.display=
            "flex";

    }
);


/* =====================================================
   RENDER LOOP
===================================================== */

function render(){

    if(
        renderer.xr.isPresenting
    ){

        updateLaser(
            controller1,
            laser1,
            dot1
        );


        updateLaser(
            controller2,
            laser2,
            dot2
        );


        updatePhotoMovement();

    }


    renderer.render(
        scene,
        camera
    );

}


renderer.setAnimationLoop(
    render
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
