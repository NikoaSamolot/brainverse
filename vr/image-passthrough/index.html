<script type="module">

/* ======================================================

import {GLTFLoader} from

import {OBJLoader} from

import {FBXLoader} from
"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/FBXLoader.js";

import {PLYLoader} from
"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/PLYLoader.js";

import {ThreeMFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/3MFLoader.js";

"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/ColladaLoader.js";

"https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/3DSLoader.js";


/* ======================================================
   DOM
====================================================== */

const desktopUI =

const fileInput =

const enterXR =

const message =

const errorBox =

const errorText =

const xrStatus =

/* ======================================================
   THREE
====================================================== */

const scene =

const camera =
    new THREE.PerspectiveCamera(

        window.innerHeight,
        0.01,
        100

const renderer =

====================================================== */

let objects=[];

let session=null;

let menu=null;

let miniMenu=null;

let mode="MOVE";

   CONTROLLERS

/* ======================================================
   LASER
====================================================== */

function createLaser(){

    const geometry =
        new THREE.BufferGeometry();

    geometry.setFromPoints([
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(0,0,-1)
    ]);

    const material =
        new THREE.LineBasicMaterial({
            color:0x00ffff
        });

    const line =
        new THREE.Line(
            geometry,
            material
        );

    line.scale.z=10;

    return line;
}


const laser1 =
    createLaser();

const laser2 =
    createLaser();


controller1.add(
    laser1
);

controller2.add(
    laser2
);


/* ======================================================
   RAYCAST
====================================================== */

const raycaster =
    new THREE.Raycaster();

const rayMatrix =
    new THREE.Matrix4();


function setRay(
    controller
){

    rayMatrix
        .identity()
        .extractRotation(
            controller.matrixWorld
        );

    raycaster.ray.origin
        .setFromMatrixPosition(
            controller.matrixWorld
        );

    raycaster.ray.direction
        .set(0,0,-1)
        .applyMatrix4(
            rayMatrix
        );
}


/* ======================================================
   FILE SELECT
====================================================== */

fileInput.addEventListener(
    "change",
    async ()=>{

        const file =
            fileInput.files?.[0];

        if(!file)
            return;

        selectedFile=file;

        message.textContent =
            "Wczytywanie: "+
            file.name;

        try{

            const object =
                await loadFile(file);

            addObject(
                object,
                file.name
            );

            enterXR.disabled=false;

            message.textContent =
                "Gotowe: "+
                file.name;

        }catch(error){

            console.error(error);

            showError(
                "Nie udało się wczytać pliku:\n"+
                error.message
            );

        }

    }
);


/* ======================================================
   LOAD FILE
====================================================== */

async function loadFile(file){

    const name =
        file.name.toLowerCase();

    const ext =
        name.split(".").pop();

    const url =
        URL.createObjectURL(file);

    try{

        if(
            [
                "jpg",
                "jpeg",
                "png",
                "webp",
                "bmp",
                "gif"
            ].includes(ext)
        ){

            return await loadImage(
                url
            );

        }


        if(
            ext==="glb" ||
            ext==="gltf"
        ){

            const loader =
                new GLTFLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        gltf=>{

                            gltf.scene.userData.kind =
                                "model";

                            resolve(
                                gltf.scene
                            );

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="stl"){

            const loader =
                new STLLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        geometry=>{

                            geometry.computeVertexNormals();

                            const material =
                                new THREE.MeshStandardMaterial({
                                    color:0xdddddd,
                                    roughness:.55,
                                    metalness:.15
                                });

                            const mesh =
                                new THREE.Mesh(
                                    geometry,
                                    material
                                );

                            mesh.userData.kind =
                                "model";

                            resolve(mesh);

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="obj"){

            const loader =
                new OBJLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        object=>{

                            object.traverse(
                                child=>{

                                    if(
                                        child.isMesh &&
                                        !child.material
                                    ){

                                        child.material =
                                            new THREE.MeshStandardMaterial({
                                                color:0xdddddd
                                            });

                                    }

                                }
                            );

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="fbx"){

            const loader =
                new FBXLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        object=>{

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="ply"){

            const loader =
                new PLYLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        geometry=>{

                            geometry.computeVertexNormals();

                            const material =
                                new THREE.MeshStandardMaterial({
                                    color:0xdddddd,
                                    roughness:.5
                                });

                            const mesh =
                                new THREE.Mesh(
                                    geometry,
                                    material
                                );

                            mesh.userData.kind =
                                "model";

                            resolve(mesh);

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="3mf"){

            const loader =
                new ThreeMFLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        object=>{

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="dae"){

            const loader =
                new ColladaLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        result=>{

                            result.scene.userData.kind =
                                "model";

                            resolve(
                                result.scene
                            );

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        if(ext==="3ds"){

            const loader =
                new TDSLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,

                        object=>{

                            object.userData.kind =
                                "model";

                            resolve(object);

                        },

                        undefined,

                        reject
                    );

                }
            );

        }


        throw new Error(
            "Nieobsługiwany format ."+
            ext
        );

    }finally{

        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            1000
        );

    }

}


/* ======================================================
   IMAGE
====================================================== */

async function loadImage(url){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.onload=()=>{

                const texture =
                    new THREE.Texture(img);

                texture.colorSpace =
                    THREE.SRGBColorSpace;

                texture.needsUpdate=true;


                const aspect =
                    img.naturalWidth /
                    img.naturalHeight;


                const height=1;

                const width =
                    height*aspect;


                const mesh =
                    new THREE.Mesh(

                        new THREE.PlaneGeometry(
                            width,
                            height
                        ),

                        new THREE.MeshBasicMaterial({
                            map:texture,
                            transparent:true,
                            side:THREE.DoubleSide,
                            depthWrite:false
                        })

                    );


                mesh.userData.kind =
                    "image";


                resolve(mesh);

            };


            img.onerror=()=>{
                reject(
                    new Error(
                        "Nie można odczytać obrazu."
                    )
                );
            };


            img.src=url;

        }
    );

}


/* ======================================================
   ADD OBJECT
====================================================== */

function addObject(
    object,
    filename
){

    objectID++;

    object.userData.id =
        objectID;

    object.userData.filename =
        filename;

    normalizeObject(
        object
    );


    object.position.set(
        0,
        1.4,
        -2
    );


    scene.add(
        object
    );

    objects.push(
        object
    );

    selectObject(
        object
    );

}


/* ======================================================
   NORMALIZE
====================================================== */

function normalizeObject(
    object
){

    const box =
        new THREE.Box3()
        .setFromObject(object);

    if(box.isEmpty())
        return;


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(
        max<=0 ||
        !Number.isFinite(max)
    )
        return;


    const factor =
        1/max;


    object.scale.setScalar(
        factor
    );


    const newBox =
        new THREE.Box3()
        .setFromObject(object);


    const center =
        newBox.getCenter(
            new THREE.Vector3()
        );


    object.position.sub(
        center
    );

}


/* ======================================================
   SELECT
====================================================== */

function selectObject(
    object
){

    selectedObject =
        object;

}


/* ======================================================
   MENU TEXTURE
====================================================== */

function createText(
    text,
    width=512,
    height=128,
    size=40
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width=width;
    canvas.height=height;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.font =
        "bold "+
        size+
        "px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillStyle="white";

    ctx.shadowColor="#00ffff";
    ctx.shadowBlur=18;

    ctx.fillText(
        text,
        width/2,
        height/2
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;

}

====================================================== */

                map:createText(

            })

        body,

    );

    );

    );

}

/* ======================================================
   PLACE UI
====================================================== */

function placeMenu(){

    if(!menu)
        return;


    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    menu.position.copy(
        camera.position
    );

    menu.position.add(
        dir.multiplyScalar(
            1.35
        )
    );


    menu.lookAt(
        camera.position
    );

}


function placeMiniMenu(){

    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    miniMenu.position.copy(
        camera.position
    );

    miniMenu.position.add(
        dir.multiplyScalar(
            1
        )
    );


    miniMenu.lookAt(
        camera.position
    );

}


/* ======================================================
   MENU TOGGLE
====================================================== */

function toggleMenu(){

    menuOpen =
        !menuOpen;

    menu.visible =
        menuOpen;

    miniMenu.visible =
        !menuOpen;

    if(!menuOpen)
        placeMiniMenu();

}


/* ======================================================
   OBJECT ACTIONS
====================================================== */

function toggleLock(){

    locked=!locked;

}


function toggleAutoRotate(){

    autoRotate=!autoRotate;

}


function rotateAxis(
    axis
){

    if(
        !selectedObject ||
        locked
    )
        return;


    selectedObject.rotation[axis]+=
        THREE.MathUtils.degToRad(
            15
        );

}


function scaleObject(
    factor
){

    if(
        !selectedObject ||
        locked
    )
        return;


    const scale =
        THREE.MathUtils.clamp(
            selectedObject.scale.x*
            factor,
            .01,
            50
        );


    selectedObject.scale.setScalar(
        scale
    );

}


function centerObject(){

    if(
        !selectedObject ||
        locked
    )
        return;


    const dir =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    selectedObject.position.copy(
        camera.position
    );

    selectedObject.position.add(
        dir.multiplyScalar(
            2
        )
    );

}


function fitObject(){

    if(
        !selectedObject
    )
        return;


    const box =
        new THREE.Box3()
        .setFromObject(
            selectedObject
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(max<=0)
        return;


    selectedObject.scale.multiplyScalar(
        .8/max
    );

}


function resetObject(){

    if(
        !selectedObject ||
        locked
    )
        return;


    selectedObject.position.set(
        0,
        1.4,
        -2
    );

    selectedObject.rotation.set(
        0,
        0,
        0
    );

    selectedObject.scale.setScalar(
        1
    );

    fitObject();

}


function nextObject(){

    if(
        objects.length===0
    )
        return;


    const index =
        objects.indexOf(
            selectedObject
        );


    const next =
        (index+1) %
        objects.length;


    selectObject(
        objects[next]
    );

}


function deleteObject(){

    if(!selectedObject)
        return;


    const index =
        objects.indexOf(
            selectedObject
        );


    if(index>=0)
        objects.splice(
            index,
            1
        );


    disposeObject(
        selectedObject
    );


    scene.remove(
        selectedObject
    );


    selectedObject =
        objects.length
        ? objects[0]
        : null;

}


function disposeObject(
    object
){

    object.traverse(
        child=>{

            if(!child.isMesh)
                return;


            child.geometry?.dispose();


            if(
                Array.isArray(
                    child.material
                )
            ){

                child.material.forEach(
                    material=>{
                        material.dispose();
                    }
                );

            }else{

                child.material?.dispose();

            }

        }
    );

}


function toggleGrid(){

    let grid =
        scene.getObjectByName(
            "XR_GRID"
        );


    if(!grid){

        grid =
            new THREE.GridHelper(
                10,
                20,
                0x00ffff,
                0x003344
            );

        grid.name =
            "XR_GRID";

        scene.add(
            grid
        );

    }else{

        grid.visible=
            !grid.visible;

    }

}


/* ======================================================
   CONTROLLER CLICK
====================================================== */

function controllerSelect(
    controller
){

    setRay(
        controller
    );


    /* MINI MENU */

    if(
        miniMenu.visible
    ){

        const hits =
            raycaster.intersectObjects(
                miniMenu.children,
                true
            );


        if(hits.length){

            const object =
                hits[0].object;


            if(
                object.userData.mini
            ){

                object.userData.action();

                return;

            }

        }

    }


    /* MENU */

    if(
        menu.visible
    ){

        const hits =
            raycaster.intersectObjects(
                buttons,
                false
            );


        if(hits.length){

            hits[0]
                .object
                .userData
                .action();

            return;

        }

    }


    /* OBJECT */

    const hits =
        raycaster.intersectObjects(
            objects,
            true
        );


    if(!hits.length)
        return;


    let object =
        hits[0].object;


    while(
        object.parent &&
        !objects.includes(object)
    ){

        object =
            object.parent;

    }


    if(
        !objects.includes(object)
    )
        return;


    selectObject(
        object
    );


    if(locked)
        return;


    grabbed=true;

    grabbedController =
        controller;


    grabDistance =
        controller.position.distanceTo(
            object.position
        );


    grabScale =
        object.scale.x;

}


function controllerRelease(
    controller
){

    if(
        grabbedController ===
        controller
    ){

        grabbed=false;

        grabbedController=null;

    }

}


/* ======================================================
   EVENTS
====================================================== */

controller1.addEventListener(
    "selectstart",
    ()=>{
        controllerSelect(
            controller1
        );
    }
);

controller2.addEventListener(
    "selectstart",
    ()=>{
        controllerSelect(
            controller2
        );
    }
);

controller1.addEventListener(
    "selectend",
    ()=>{
        controllerRelease(
            controller1
        );
    }
);

controller2.addEventListener(
    "selectend",
    ()=>{
        controllerRelease(
            controller2
        );
    }
);


/* ======================================================
   JOYSTICK
====================================================== */

function readJoystick(){

    if(!session)
        return {
            x:0,
            y:0
        };


    for(
        const source
        of session.inputSources
    ){

        if(!source.gamepad)
            continue;


        const axes =
            source.gamepad.axes;


        if(
            axes.length>=4
        ){

            const x=axes[2];
            const y=axes[3];


            if(
                Math.abs(x)>.12 ||
                Math.abs(y)>.12
            ){

                return {
                    x,
                    y
                };

            }

        }


        if(
            axes.length>=2
        ){

            const x=axes[0];
            const y=axes[1];


            if(
                Math.abs(x)>.12 ||
                Math.abs(y)>.12
            ){

                return {
                    x,
                    y
                };

            }

        }

    }


    return {
        x:0,
        y:0
    };

}


/* ======================================================
   MOVEMENT
====================================================== */

function updateObject(){

    if(
        !selectedObject
    )
        return;


    if(autoRotate){

        selectedObject.rotation.y +=
            .006;

    }


    const stick =
        readJoystick();


    /*
       JOYSTICK UP/DOWN
       = ZOOM
    */

    if(
        Math.abs(stick.y)>.12 &&
        !locked
    ){

        scaleObject(
            1-stick.y*.025
        );

    }


    /*
       ROTATE MODE
    */

    if(
        mode==="ROTATE" &&
        Math.abs(stick.x)>.12 &&
        !locked
    ){

        selectedObject.rotation.y +=
            stick.x*.035;

    }


    /*
       GRAB
    */

    if(
        !grabbed ||
        !grabbedController ||
        locked
    )
        return;


    if(
        mode==="MOVE"
    ){

        setRay(
            grabbedController
        );


        const position =
            raycaster.ray.origin
            .clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    grabDistance
                )
            );


        selectedObject.position.lerp(
            position,
            .25
        );

    }


    if(
        mode==="ROTATE"
    ){

        selectedObject.rotation.y +=
            grabbedController.rotation.y*
            .02;

    }


    if(
        mode==="SCALE"
    ){

        const distance =
            grabbedController.position
            .distanceTo(
                selectedObject.position
            );


        const scale =
            THREE.MathUtils.clamp(
                grabScale*
                distance/
                Math.max(
                    .01,
                    grabDistance
                ),
                .01,
                50
            );


        selectedObject.scale
            .setScalar(
                scale
            );

    }

}


/* ======================================================
   TWO HAND SCALE
====================================================== */

function updateTwoHands(){

    if(
        !selectedObject ||
        locked ||
        mode!=="SCALE"
    ){

        twoHandStart=null;

        return;

    }


    const distance =
        controller1.position
        .distanceTo(
            controller2.position
        );


    if(
        distance<.1
    ){

        twoHandStart=null;

        return;

    }


    if(!twoHandStart){

        twoHandStart={
            distance,
            scale:selectedObject.scale.x
        };

        return;

    }


    const factor =
        distance /
        twoHandStart.distance;


    selectedObject.scale.setScalar(
        THREE.MathUtils.clamp(
            twoHandStart.scale*
            factor,
            .01,
            50
        )
    );

}


/* ======================================================
   LASERS
====================================================== */

function updateLaser(
    controller,
    laser
){

    if(
        !renderer.xr.isPresenting
    ){

        laser.visible=false;

        return;

    }


    laser.visible=true;


    setRay(
        controller
    );


    const hits =
        raycaster.intersectObjects(
            [
                ...buttons,
                ...(miniMenu.visible
                    ? miniMenu.children
                    : [])
            ],
            true
        );


    if(hits.length){

        const distance =
            hits[0].distance;

        laser.scale.z =
            Math.max(
                .1,
                distance
            );

    }else{

        laser.scale.z=8;

    }

}


/* ======================================================
   XR SESSION
====================================================== */

async function enterAR(){

    if(
        !navigator.xr
    ){

        showError(
            "Ta przeglądarka nie udostępnia WebXR."
        );

        return;

    }


    try{

        const supported =
            await navigator.xr
                .isSessionSupported(
                    "immersive-ar"
                );


        if(!supported){

            showError(
                "Meta Quest / przeglądarka nie zgłasza obsługi immersive-ar."
            );

            return;

        }


        /*
           Najważniejsza zmiana:
           bezpośredni requestSession("immersive-ar").
        */

        session =
            await navigator.xr.requestSession(
                "immersive-ar",
                {
                    requiredFeatures:[
                        "local"
                    ],

                    optionalFeatures:[
                        "local-floor",
                        "bounded-floor",
                        "hand-tracking",
                        "anchors",
                        "hit-test",
                        "dom-overlay"
                    ],

                    domOverlay:{
                        root:
                            document.getElementById(
                                "xrOverlay"
                            )
                    }

                }
            );


        await renderer.xr.setSession(
            session
        );


        desktopUI.style.display=
            "none";


        createMenu();
        createMiniMenu();


        session.addEventListener(
            "end",
            ()=>{
                desktopUI.style.display=
                    "flex";

                session=null;

                if(menu)
                    menu.visible=false;

                if(miniMenu)
                    miniMenu.visible=false;

            }
        );


        setTimeout(
            ()=>{
                placeMenu();
            },
            100
        );


    }catch(error){

        console.error(error);

        showError(
            "Nie udało się uruchomić Mixed Reality:\n\n"+
            error.name+
            "\n"+
            error.message
        );

    }

}


enterXR.addEventListener(
    "click",
    enterAR
);


/* ======================================================
   ERROR
====================================================== */

function showError(
    text
){

    errorText.textContent=
        text;

    errorBox.style.display=
        "block";

    setTimeout(
        ()=>{
            errorBox.style.display=
                "none";
        },
        8000
    );

}


/* ======================================================
   RENDER
====================================================== */

renderer.setAnimationLoop(
    ()=>{

        if(
            renderer.xr.isPresenting
        ){

            updateLaser(
                controller1,
                laser1
            );

            updateLaser(
                controller2,
                laser2
            );

            updateObject();

            updateTwoHands();

        }


        renderer.render(
            scene,
            camera
        );

    }
);


/* ======================================================
   RESIZE
====================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ======================================================
   INITIAL STATUS
====================================================== */

if(
    !window.isSecureContext
){

    message.textContent =
        "⚠ Ta strona nie działa w bezpiecznym kontekście HTTPS.";

}


if(
    !navigator.xr
){

    message.textContent =
        "⚠ WebXR nie jest dostępny w tej przeglądarce.";

}
