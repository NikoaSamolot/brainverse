function makeLaser(){

    const geometry=
        new THREE.BufferGeometry();

    geometry.setFromPoints([
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(0,0,-1)
    ]);

    const material=
        new THREE.LineBasicMaterial({
            color:0x00ffff,
            transparent:true,
            opacity:.95
        });

    const line=
        new THREE.Line(
            geometry,
            material
        );

    line.scale.z=8;

    return line;
}

function makeDot(){

    return new THREE.Mesh(
        new THREE.SphereGeometry(
            .018,
            12,
            12
        ),
        new THREE.MeshBasicMaterial({
            color:0x00ffff
        })
    );
}

const laser1=makeLaser();
const laser2=makeLaser();

const dot1=makeDot();
const dot2=makeDot();

controller1.add(laser1);
controller2.add(laser2);

scene.add(

    dot2
);


/* =========================================================
   RAYCAST
========================================================= */

const raycaster=
    new THREE.Raycaster();

const tempMatrix=
    new THREE.Matrix4();

function controllerRay(controller){

    tempMatrix
        .identity()
        .extractRotation(
            controller.matrixWorld
        );

    raycaster.ray.origin
        .setFromMatrixPosition(
            controller.matrixWorld
        );

    raycaster.ray.direction
        .set(0,0,-1)
        .applyMatrix4(
            tempMatrix
        );
}

            );

        fileInput.value="";

    }
);


/* =========================================================
   LOAD FILE
========================================================= */

async function loadFile(file){

    const name=
        file.name.toLowerCase();

    const ext=
        name.split(".").pop();

    const url=
        URL.createObjectURL(file);

    try{

        if(
            ["jpg","jpeg","png","webp","gif","bmp"].includes(ext)
        ){

            return await loadImage(
                url,
                file.name
            );

        }


        if(ext==="glb" || ext==="gltf"){

            const loader=
                new GLTFLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        gltf=>{

                            const root=
                                gltf.scene;

                            root.userData.type=
                                "model";

                            resolve(root);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="stl"){

            const loader=
                new STLLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        geometry=>{

                            geometry.computeVertexNormals();

                            const material=
                                new THREE.MeshStandardMaterial({
                                    color:0xdddddd,
                                    metalness:.25,
                                    roughness:.55
                                });

                            const mesh=
                                new THREE.Mesh(
                                    geometry,
                                    material
                                );

                            mesh.userData.type=
                                "model";

                            resolve(mesh);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="obj"){

            const loader=
                new OBJLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        object=>{

                            object.traverse(
                                child=>{

                                    if(
                                        child.isMesh
                                    ){

                                        if(
                                            !child.material
                                        ){

                                            child.material=
                                                new THREE.MeshStandardMaterial({
                                                    color:0xdddddd,
                                                    roughness:.55,
                                                    metalness:.1
                                                });

                                        }

                                    }

                                }
                            );

                            object.userData.type=
                                "model";

                            resolve(object);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="fbx"){

            const loader=
                new FBXLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        object=>{

                            object.userData.type=
                                "model";

                            resolve(object);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="ply"){

            const loader=
                new PLYLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        geometry=>{

                            geometry.computeVertexNormals();

                            const material=
                                new THREE.MeshStandardMaterial({
                                    color:0xdddddd,
                                    roughness:.5,
                                    metalness:.15,
                                    vertexColors:
                                        geometry.hasAttribute(
                                            "color"
                                        )
                                });

                            const mesh=
                                new THREE.Mesh(
                                    geometry,
                                    material
                                );

                            mesh.userData.type=
                                "model";

                            resolve(mesh);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="3mf"){

            const loader=
                new ThreeMFLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        object=>{

                            object.userData.type=
                                "model";

                            resolve(object);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="dae"){

            const loader=
                new ColladaLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        result=>{

                            result.scene.userData.type=
                                "model";

                            resolve(
                                result.scene
                            );

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        if(ext==="3ds"){

            const loader=
                new TDSLoader();

            return await new Promise(
                (resolve,reject)=>{

                    loader.load(
                        url,
                        object=>{

                            object.userData.type=
                                "model";

                            resolve(object);

                        },
                        undefined,
                        reject
                    );

                }
            );

        }


        throw new Error(
            "Nieobsługiwane rozszerzenie: ."+ext
        );

    }finally{

        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            1000
        );

    }

}


/* =========================================================
   IMAGE
========================================================= */

async function loadImage(
    url,
    name
){

    return await new Promise(
        (resolve,reject)=>{

            const img=
                new Image();

            img.onload=()=>{

                const texture=
                    new THREE.Texture(img);

                texture.colorSpace=
                    THREE.SRGBColorSpace;

                texture.needsUpdate=true;

                const aspect=
                    img.naturalWidth/
                    img.naturalHeight;

                const height=1;

                const width=
                    height*aspect;

                const mesh=
                    new THREE.Mesh(

                        new THREE.PlaneGeometry(
                            width,
                            height
                        ),

                        new THREE.MeshBasicMaterial({
                            map:texture,
                            transparent:true,
                            side:THREE.DoubleSide,
                            depthWrite:false
                        })

                    );

                mesh.userData.type=
                    "image";

                resolve(mesh);

            };

            img.onerror=reject;

            img.src=url;

        }
    );

}


/* =========================================================
   ADD OBJECT
========================================================= */

function addObject(
    object,
    filename
){

    objectCounter++;

    object.userData.id=
        "object_"+objectCounter;

    object.userData.filename=
        filename;

    object.userData.type=
        object.userData.type ||
        "model";

    object.userData.locked=false;

    object.userData.autoRotate=false;


    normalizeObject(
        object
    );


    object.position.set(
        0,
        camera.position.y,
        -2
    );


    scene.add(object);

    objects.push(object);

    selectObject(object);

}


/* =========================================================
   NORMALIZE MODEL
========================================================= */

function normalizeObject(
    object
){

    const box=
        new THREE.Box3()
        .setFromObject(object);

    if(box.isEmpty())
        return;

    const size=
        box.getSize(
            new THREE.Vector3()
        );

    const maxSize=
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if(maxSize<=0)
        return;

    /*
       Automatycznie sprowadzamy każdy model
       do rozsądnego rozmiaru MR.
    */

    const target=1;

    const factor=
        target/maxSize;

    object.scale.setScalar(
        factor
    );


    /*
       Po skalowaniu przesuwamy środek
       modelu do jego lokalnego centrum.
    */

    const center=
        box.getCenter(
            new THREE.Vector3()
        );

    object.position.sub(
        center.multiplyScalar(factor)
    );

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(
    object
){

    selectedObject=
        object;

    updateBoundingBox();

}


/* =========================================================
   BOUNDING BOX
========================================================= */

function updateBoundingBox(){

    if(boundingBox){

        scene.remove(
            boundingBox
        );

        boundingBox.geometry.dispose();

        boundingBox.material.dispose();

        boundingBox=null;

    }

    if(!selectedObject)
        return;


    const box=
        new THREE.Box3()
        .setFromObject(
            selectedObject
        );

    if(box.isEmpty())
        return;


    const size=
        box.getSize(
            new THREE.Vector3()
        );

    const center=
        box.getCenter(
            new THREE.Vector3()
        );


    boundingBox=
        new THREE.LineSegments(

            new THREE.EdgesGeometry(

                new THREE.BoxGeometry(
                    size.x+.08,
                    size.y+.08,
                    size.z+.08
                )

            ),

            new THREE.LineBasicMaterial({

                color:0x00ffff,

                transparent:true,

                opacity:.85

            })

        );


    boundingBox.position.copy(
        center
    );

    scene.add(
        boundingBox
    );

}


/* =========================================================
   UPDATE BOUNDING BOX
========================================================= */

function syncBoundingBox(){

    if(
        !boundingBox ||
        !selectedObject
    )
        return;


    const box=
        new THREE.Box3()
        .setFromObject(
            selectedObject
        );

    const size=
        box.getSize(
            new THREE.Vector3()
        );

    const center=
        box.getCenter(
            new THREE.Vector3()
        );


    boundingBox.position.copy(
        center
    );

    boundingBox.geometry.dispose();

    boundingBox.geometry=
        new THREE.EdgesGeometry(

            new THREE.BoxGeometry(
                size.x+.08,
                size.y+.08,
                size.z+.08
            )

        );

}


/* =========================================================
   FUTURISTIC TEXT
========================================================= */

function textTexture(
    text,
    width=1024,
    height=256,
    fontSize=50
){

    const canvas=
        document.createElement(
            "canvas"
        );

    canvas.width=width;
    canvas.height=height;

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        width,
        height
    );

    ctx.font=
        "bold "+
        fontSize+
        "px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillStyle="#ffffff";

    ctx.shadowColor=
        "#00ffff";

    ctx.shadowBlur=15;

    ctx.fillText(
        text,
        width/2,
        height/2
    );

    const tex=
        new THREE.CanvasTexture(
            canvas
        );

    tex.colorSpace=
        THREE.SRGBColorSpace;

    return tex;

}

    footer.position.z=.02;

    menu.add(footer);


    scene.add(menu);

}


/* =========================================================
   MINI MENU
========================================================= */

function createMiniMenu(){

    miniMenu=
        new THREE.Group();

    miniMenu.visible=false;


    const bg=
        new THREE.Mesh(

            new THREE.CircleGeometry(
                .12,
                32
            ),

            new THREE.MeshBasicMaterial({

                color:0x03141a,

                side:THREE.DoubleSide

            })

        );


    bg.userData.miniButton=true;
    bg.userData.action=
        toggleMenu;


    const ring=
        new THREE.Mesh(

            new THREE.RingGeometry(
                .12,
                .135,
                32
            ),

            new THREE.MeshBasicMaterial({
                color:0x00ffff,
                side:THREE.DoubleSide
            })

        );


    ring.position.z=.005;


    const text=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                .14,
                .07
            ),

            new THREE.MeshBasicMaterial({

                map:
                    textTexture(
                        "MENU",
                        256,
                        128,
                        35
                    ),

                transparent:true

            })

        );


    text.position.z=.01;


    miniMenu.add(
        bg,
        ring,
        text
    );


    scene.add(
        miniMenu
    );

}


/* =========================================================
   MENU POSITION
========================================================= */

function placeMenu(){

    if(!menu)
        return;

    const direction=
        new THREE.Vector3(
            0,0,-1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    menu.position.copy(
        camera.position
    );

    menu.position.add(
        direction.multiplyScalar(
            1.3
        )
    );

    menu.lookAt(
        camera.position
    );

}


function placeMini(){

    if(!miniMenu)
        return;

    const direction=
        new THREE.Vector3(
            0,0,-1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    miniMenu.position.copy(
        camera.position
    );

    miniMenu.position.add(
        direction.multiplyScalar(
            1
        )
    );

    miniMenu.lookAt(
        camera.position
    );

}


/* =========================================================
   MENU TOGGLE
========================================================= */

function toggleMenu(){

    menuVisible=
        !menuVisible;

    menu.visible=
        menuVisible;

    miniMenu.visible=
        !menuVisible;

    if(
        !menuVisible
    )
        placeMini();

}


/* =========================================================
   OBJECT ACTIONS
========================================================= */

function toggleLock(){

    if(!selectedObject)
        return;

    selectedObject.userData.locked=
        !selectedObject.userData.locked;

}


function toggleAutoRotate(){

    if(!selectedObject)
        return;

    selectedObject.userData.autoRotate=
        !selectedObject.userData.autoRotate;

}


function rotateObject(axis){

    if(
        !selectedObject ||
        selectedObject.userData.locked
    )
        return;

    if(axis==="x")
        selectedObject.rotation.x+=
            THREE.MathUtils.degToRad(15);

    if(axis==="y")
        selectedObject.rotation.y+=
            THREE.MathUtils.degToRad(15);

    if(axis==="z")
        selectedObject.rotation.z+=
            THREE.MathUtils.degToRad(15);

}


function scaleObject(factor){

    if(
        !selectedObject ||
        selectedObject.userData.locked
    )
        return;

    const s=
        THREE.MathUtils.clamp(
            selectedObject.scale.x*
            factor,
            .02,
            30
        );

    selectedObject.scale.setScalar(s);

}


function resetObject(){

    if(
        !selectedObject ||
        selectedObject.userData.locked
    )
        return;

    selectedObject.position.set(
        0,
        camera.position.y,
        -2
    );

    selectedObject.rotation.set(
        0,0,0
    );

    selectedObject.scale.setScalar(
        1
    );

    fitObject();

}


function centerObject(){

    if(
        !selectedObject ||
        selectedObject.userData.locked
    )
        return;


    const dir=
        new THREE.Vector3(
            0,0,-1
        );

    dir.applyQuaternion(
        camera.quaternion
    );


    selectedObject.position=
        camera.position.clone()
        .add(
            dir.multiplyScalar(
                2
            )
        );


    selectedObject.position.y=
        camera.position.y;

}


function fitObject(){

    if(!selectedObject)
        return;

    const box=
        new THREE.Box3()
        .setFromObject(
            selectedObject
        );

    if(box.isEmpty())
        return;

    const size=
        box.getSize(
            new THREE.Vector3()
        );

    const max=
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if(max<=0)
        return;

    const factor=
        .8/max;

    selectedObject.scale.multiplyScalar(
        factor
    );

}


function nextObject(){

    if(
        objects.length===0
    )
        return;

    let index=
        objects.indexOf(
            selectedObject
        );

    index++;

    if(
        index>=objects.length
    )
        index=0;

    selectObject(
        objects[index]
    );

}


function deleteObject(){

    if(!selectedObject)
        return;

    const index=
        objects.indexOf(
            selectedObject
        );

    if(index>=0)
        objects.splice(
            index,
            1
        );

    disposeObject(
        selectedObject
    );

    scene.remove(
        selectedObject
    );

    selectedObject=
        objects.length
        ? objects[Math.max(0,index-1)]
        : null;

    updateBoundingBox();

}


function disposeObject(
    object
){

    object.traverse(
        child=>{

            if(!child.isMesh)
                return;

            child.geometry?.dispose();

            if(
                Array.isArray(
                    child.material
                )
            ){

                child.material.forEach(
                    m=>m.dispose()
                );

            }else{

                child.material?.dispose();

            }

        }
    );

}


function openFilePicker(){

    fileInput.click();

}


function toggleGrid(){

    gridVisible=
        !gridVisible;

    if(
        gridVisible &&
        !scene.getObjectByName(
            "MR_GRID"
        )
    ){

        const grid=
            new THREE.GridHelper(
                10,
                20,
                0x00ffff,
                0x003b44
            );

        grid.name=
            "MR_GRID";

        grid.position.y=.01;

        scene.add(grid);

    }else{

        const grid=
            scene.getObjectByName(
                "MR_GRID"
            );

        if(grid)
            grid.visible=
                gridVisible;

    }

}


/* =========================================================
   LASER INTERACTION
========================================================= */

function getInteractiveObjects(){

    const result=[];

    if(
        menu &&
        menu.visible
    )
        result.push(
            ...menuButtons
        );

    if(
        miniMenu &&
        miniMenu.visible
    ){

        result.push(
            ...miniMenu.children
                .filter(
                    x=>
                        x.userData.miniButton
                )
        );

    }

    for(
        const object
        of objects
    ){

        if(
            object.visible
        )
            result.push(object);

    }

    return result;

}


function updateLaser(
    controller,
    laser,
    dot
){

    controllerRay(
        controller
    );

    const targets=
        getInteractiveObjects();

    const hits=
        raycaster.intersectObjects(
            targets,
            true
        );


    laser.visible=
        renderer.xr.isPresenting;

    dot.visible=
        renderer.xr.isPresenting;


    if(hits.length){

        const point=
            hits[0].point;

        dot.position.copy(
            point
        );


        const local=
            controller.worldToLocal(
                point.clone()
            );

        laser.scale.z=
            Math.max(
                .1,
                Math.abs(local.z)
            );


        let button=
            hits[0].object;

        while(
            button &&
            !button.userData.button &&
            !button.userData.miniButton
        ){

            button=
                button.parent;

        }


        if(
            button &&
            button.userData.button
        ){

            if(
                selectedButton!==button
            ){

                clearHover();

                selectedButton=
                    button;

                button.material.color
                    .setHex(
                        button.userData.hover
                    );

            }

        }else{

            clearHover();

        }

    }else{

        laser.scale.z=8;

        dot.position.copy(
            raycaster.ray.origin
            .clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(8)
            )
        );

        clearHover();

    }

}


function clearHover(){

    if(
        selectedButton
    ){

        selectedButton.material.color
            .setHex(
                selectedButton.userData.normal
            );

        selectedButton=null;

    }

}


/* =========================================================
   CONTROLLER SELECT
========================================================= */

function controllerSelect(
    controller
){

    controllerRay(
        controller
    );


    /* MINI */

    if(
        miniMenu &&
        miniMenu.visible
    ){

        const hits=
            raycaster.intersectObjects(
                miniMenu.children,
                false
            );

        if(hits.length){

            const object=
                hits[0].object;

            if(
                object.userData.miniButton
            ){

                object.userData.action();

                return;

            }

        }

    }


    /* MENU */

    if(
        menu &&
        menu.visible
    ){

        const hits=
            raycaster.intersectObjects(
                menuButtons,
                false
            );

        if(hits.length){

            hits[0]
                .object
                .userData
                .action();

            return;

        }


        if(
            mode==="MENU"
        ){

            const panelHits=
                raycaster.intersectObject(
                    menu,
                    true
                );

            if(panelHits.length){

                menuMoving=true;

                menuController=
                    controller;

                return;

            }

        }

    }


    /* OBJECT */

    const hits=
        raycaster.intersectObjects(
            objects,
            true
        );


    if(!hits.length)
        return;


    let object=
        hits[0].object;

    while(
        object.parent &&
        !objects.includes(object)
    ){

        object=
            object.parent;

    }


    if(
        !objects.includes(object)
    )
        return;


    selectObject(object);


    if(
        object.userData.locked
    )
        return;


    dragging=true;

    activeController=
        controller;

    dragDistance=
        controller.position.distanceTo(
            object.position
        );

    startScale=
        object.scale.x;

}


/* =========================================================
   SELECT END
========================================================= */

function controllerSelectEnd(
    controller
){

    if(
        activeController===
        controller
    ){

        dragging=false;

        activeController=null;

    }


    if(
        menuController===
        controller
    ){

        menuMoving=false;

        menuController=null;

    }

}


controller1.addEventListener(
    "selectstart",
    ()=>controllerSelect(
        controller1
    )
);

controller2.addEventListener(
    "selectstart",
    ()=>controllerSelect(
        controller2
    )
);

controller1.addEventListener(
    "selectend",
    ()=>controllerSelectEnd(
        controller1
    )
);

controller2.addEventListener(
    "selectend",
    ()=>controllerSelectEnd(
        controller2
    )
);


/* =========================================================
   JOYSTICK
========================================================= */

function getThumbsticks(){

    const result={
        x:0,
        y:0
    };

    const sources=
        renderer.xr
            .getSession()
            ?.inputSources;

    if(!sources)
        return result;


    for(
        const source
        of sources
    ){

        const gp=
            source.gamepad;

        if(!gp)
            continue;


        if(
            gp.axes.length>=4
        ){

            const x=
                gp.axes[2];

            const y=
                gp.axes[3];

            if(
                Math.abs(x)>.1 ||
                Math.abs(y)>.1
            ){

                result.x=x;
                result.y=y;

                return result;

            }

        }


        if(
            gp.axes.length>=2
        ){

            const x=
                gp.axes[0];

            const y=
                gp.axes[1];

            if(
                Math.abs(x)>.1 ||
                Math.abs(y)>.1
            ){

                result.x=x;
                result.y=y;

                return result;

            }

        }

    }

    return result;

}


/* =========================================================
   JOYSTICK CONTROL
========================================================= */

function updateJoystick(){

    if(
        !selectedObject ||
        selectedObject.userData.locked
    )
        return;


    const stick=
        getThumbsticks();


    /*
       Y = ZOOM
    */

    if(
        Math.abs(stick.y)>.12
    ){

        const factor=
            1-stick.y*.025;

        scaleObject(
            factor
        );

    }


    /*
       X = ROTATE
    */

    if(
        Math.abs(stick.x)>.12 &&
        mode==="ROTATE"
    ){

        selectedObject.rotation.y+=
            stick.x*.035;

    }

}


/* =========================================================
   TWO HAND SCALE
========================================================= */

function updateTwoHandScale(){

    if(
        !selectedObject ||
        selectedObject.userData.locked
    )
        return;


    if(
        mode!=="SCALE"
    ){

        twoHandStart=null;

        return;

    }


    const distance=
        controller1.position
        .distanceTo(
            controller2.position
        );


    if(distance<.08){

        twoHandStart=null;

        return;

    }


    if(!twoHandStart){

        twoHandStart={
            distance,
            scale:
                selectedObject.scale.x
        };

        return;

    }


    const factor=
        distance/
        twoHandStart.distance;


    const scale=
        THREE.MathUtils.clamp(
            twoHandStart.scale*
            factor,
            .02,
            30
        );


    selectedObject.scale.setScalar(
        scale
    );

}


/* =========================================================
   OBJECT MOVEMENT
========================================================= */

function updateObjectMovement(){

    if(
        !selectedObject
    )
        return;


    if(
        selectedObject.userData.autoRotate
    ){

        selectedObject.rotation.y+=
            .008;

    }


    updateJoystick();

    updateTwoHandScale();


    /* MENU MOVE */

    if(
        menuMoving &&
        menuController
    ){

        controllerRay(
            menuController
        );


        const target=
            raycaster.ray.origin
            .clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    1.2
                )
            );


        menu.position.lerp(
            target,
            .2
        );


        menu.lookAt(
            camera.position
        );

    }


    /* OBJECT MOVE */

    if(
        !dragging ||
        !activeController
    )
        return;


    if(
        mode==="MOVE"
    ){

        controllerRay(
            activeController
        );


        const target=
            raycaster.ray.origin
            .clone()
            .add(
                raycaster.ray.direction
                .clone()
                .multiplyScalar(
                    dragDistance
                )
            );


        selectedObject.position.lerp(
            target,
            .28
        );

    }


    if(
        mode==="ROTATE"
    ){

        const p=
            activeController.position;

        const dx=
            p.x-
            selectedObject.position.x;

        const dz=
            p.z-
            selectedObject.position.z;


        selectedObject.rotation.y=
            Math.atan2(
                dx,
                dz
            );

    }


    if(
        mode==="SCALE"
    ){

        const distance=
            activeController.position
            .distanceTo(
                selectedObject.position
            );


        const scale=
            THREE.MathUtils.clamp(
                startScale*
                distance/
                Math.max(
                    .01,
                    dragDistance
                ),
                .02,
                30
            );


        selectedObject.scale
            .setScalar(
                scale
            );

    }

}

   START
========================================================= */

startVR.onclick=()=>{

    if(
        objects.length===0
    ){

        alert(
            "Najpierw wybierz zdjęcie lub model 3D."
        );

        return;

    }

    arButton.click();

};


/* =========================================================
   XR START
========================================================= */

renderer.xr.addEventListener(
    "sessionstart",
    ()=>{

        xrSession=
            renderer.xr.getSession();

        startScreen.style.display=
            "none";

        status.style.display=
            "block";


        if(!menuInitialized){

            createMenu();
            createMiniMenu();

            menuInitialized=true;

        }


        menu.visible=true;

        miniMenu.visible=false;

        menuVisible=true;


        setTimeout(
            ()=>{
                placeMenu();
                placeMini();
            },
            150
        );


        setTimeout(
            ()=>{
                status.style.display=
                    "none";
            },
            5000
        );

    }
);


/* =========================================================
   XR END
========================================================= */

renderer.xr.addEventListener(
    "sessionend",
    ()=>{

        xrSession=null;

        dragging=false;

        menuMoving=false;

        activeController=null;

        menuController=null;

        if(menu)
            menu.visible=false;

        if(miniMenu)
            miniMenu.visible=false;

        startScreen.style.display=
            "flex";

    }
);


/* =========================================================
   RENDER
========================================================= */

function render(){

    if(
        renderer.xr.isPresenting
    ){

        updateLaser(
            controller1,
            laser1,
            dot1
        );

        updateLaser(
            controller2,
            laser2,
            dot2
        );

        updateObjectMovement();

        syncBoundingBox();

    }


    renderer.render(
        scene,
        camera
    );

}

renderer.setAnimationLoop(
    render
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
