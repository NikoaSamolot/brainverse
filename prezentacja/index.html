<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrainVerse - Prezentacje</title>

<link rel="icon" href="brainverse_icon.png">


<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

font-family:"Roboto",sans-serif;

color:white;

background:

radial-gradient(circle at 20% 20%,rgba(255,160,50,.35),transparent 30%),

radial-gradient(circle at 80% 80%,rgba(255,60,0,.3),transparent 35%),

linear-gradient(135deg,#6e2100,#d94d00,#ff7300);

overflow-x:hidden;

}



/* logo w tle */

body::before{

content:"";

position:fixed;

width:650px;
height:650px;

top:50%;
left:50%;

transform:translate(-50%,-50%);

background:url("brainverse_icon.png") center/contain no-repeat;

opacity:.05;

z-index:-1;

}



/* pasek góra */

.topBar{

position:fixed;

top:0;
left:0;

width:100%;

height:90px;

display:flex;

align-items:center;

justify-content:space-between;

padding:15px 50px;

background:rgba(20,5,0,.75);

backdrop-filter:blur(15px);

border-bottom:1px solid rgba(255,180,80,.3);

z-index:10;

}



.brand{

display:flex;

align-items:center;

gap:15px;

}



.brand img{

width:55px;
height:55px;

filter:drop-shadow(0 0 15px orange);

}



.logoText{

font-family:"Orbitron";

font-size:35px;

font-weight:900;

text-shadow:

0 0 10px white,

0 0 30px #ff7000;

}



.subtitle{

font-size:12px;

letter-spacing:3px;

opacity:.7;

}



/* główna karta */

main{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:130px 20px 80px;

}



.container{

width:min(1100px,100%);

padding:45px;

border-radius:35px;

background:

rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.25);

backdrop-filter:blur(20px);

box-shadow:

0 30px 80px rgba(0,0,0,.4);

}



.title{

text-align:center;

font-family:"Orbitron";

font-size:45px;

margin:0;

text-shadow:0 0 20px orange;

}



.description{

text-align:center;

opacity:.7;

margin-bottom:40px;

}



/* prezentacje */


.grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(260px,1fr));

gap:25px;

}



.presentation{

background:

linear-gradient(

145deg,

rgba(255,255,255,.18),

rgba(0,0,0,.15)

);

border:1px solid rgba(255,255,255,.2);

border-radius:25px;

overflow:hidden;

transition:.3s;

}



.presentation:hover{

transform:translateY(-10px);

box-shadow:

0 20px 50px rgba(255,100,0,.5);

}



.presentation img{

width:100%;

height:180px;

object-fit:cover;

}



.content{

padding:25px;

text-align:center;

}



.content h2{

font-family:"Orbitron";

margin:0 0 20px;

font-size:25px;

}



.open{

display:block;

padding:14px;

border-radius:15px;

background:

linear-gradient(135deg,#ff4200,#ff9900);

color:white;

font-weight:800;

text-decoration:none;

transition:.2s;

}



.open:hover{

transform:scale(1.05);

filter:brightness(1.15);

}



/* stopka */


footer{

position:fixed;

bottom:0;

width:100%;

padding:12px;

text-align:center;

background:rgba(0,0,0,.7);

border-top:1px solid rgba(255,150,50,.3);

font-size:13px;

opacity:.8;

}



@media(max-width:600px){

.topBar{

padding:15px;

}


.logoText{

font-size:25px;

}


.container{

padding:25px;

}


.title{

font-size:32px;

}

}


</style>

</head>


<body>



<header class="topBar">


<div class="brand">


<img src="brainverse_icon.png">


<div>

<div class="logoText">
BrainVerse
</div>

<div class="subtitle">
PROJEKTY • PREZENTACJE
</div>


</div>


</div>


</header>




<main>


<div class="container">


<h1 class="title">
📚 Prezentacje
</h1>


<p class="description">
Wybierz prezentację
</p>



<div class="grid" id="presentations">

</div>



</div>


</main>




<footer>

BrainVerse • Projekty • Kreatywność

</footer>




<script>


const presentations = [


{

name:"Antarktyda",

image:"images/antarktyda.jpg",

icon:"❄️",

link:"https://drive.google.com/drive/folders/1aEseAWkTPx7YMvk0v1cNJRftvgfVlN32?usp=sharing"

},


{

name:"Liechtenstein",

image:"images/liechtenstein.jpg",

icon:"🏔️",

link:"https://drive.google.com/drive/folders/1BcAtCvyDqPLPk9b2qoY1saOTa_BE-2EL?usp=sharing"

}


];



const box=document.getElementById("presentations");



presentations.forEach(p=>{


box.innerHTML += `


<div class="presentation">


<img src="${p.image}">


<div class="content">


<h2>${p.icon} ${p.name}</h2>


<a class="open" href="${p.link}" target="_blank">

OTWÓRZ →

</a>


</div>


</div>


`;


});


</script>



</body>

</html>
