<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WebXR Mini Desktop</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:Arial,sans-serif; }
  #info {
    position:fixed; z-index:10; left:50%; top:18px; transform:translateX(-50%);
    color:white; background:rgba(0,0,0,.65); padding:12px 16px; border-radius:12px;
    text-align:center; max-width:90%; line-height:1.35;
  }
  #vr {
    position:fixed; z-index:11; left:50%; bottom:24px; transform:translateX(-50%);
    border:0; border-radius:14px; padding:15px 24px; font-size:18px;
    background:#fff; color:#111; font-weight:bold;
  }
</style>
</head>
<body>
<div id="info">
  <b>WebXR Mini Desktop</b><br>
  Załóż Quest 3 i kliknij „VR”.<br>
  W VR zobaczysz ręce i monitor przed sobą.
</div>
<button id="vr">WEJDŹ DO VR</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { VRButton } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";

let scene, camera, renderer, clock;
let leftHand, rightHand;
let monitor, screen;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let desktopGroup;
let hovered = null;

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x10131a);

  clock = new THREE.Clock();

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 100);
  camera.position.set(0, 1.65, 2.5);

  // Światło
  scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2.2));

  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(2, 4, 2);
  scene.add(key);

  // Podłoga
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(20,20),
    new THREE.MeshStandardMaterial({color:0x22262d, roughness:0.9})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // Kilka prostych ścian dla orientacji
  const wallMat = new THREE.MeshStandardMaterial({color:0x181c24});
  const back = new THREE.Mesh(new THREE.BoxGeometry(8,4,0.15), wallMat);
  back.position.set(0,2,-3);
  scene.add(back);

  // Biurko
  const desk = new THREE.Mesh(
    new THREE.BoxGeometry(2.8,0.12,1.2),
    new THREE.MeshStandardMaterial({color:0x563b29, roughness:.7})
  );
  desk.position.set(0,1.05,-1.15);
  scene.add(desk);

  const legMat = new THREE.MeshStandardMaterial({color:0x292929});
  for (const x of [-1.2,1.2]) {
    for (const z of [-.45,.45]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(.1,1.05,.1), legMat);
      leg.position.set(x,0.52,-1.15+z);
      scene.add(leg);
    }
  }

  // Monitor
  monitor = new THREE.Group();
  monitor.position.set(0,1.72,-1.15);

  const bezel = new THREE.Mesh(
    new THREE.BoxGeometry(2.15,1.25,.12),
    new THREE.MeshStandardMaterial({color:0x080808, roughness:.35})
  );
  monitor.add(bezel);

  screen = new THREE.Mesh(
    new THREE.PlaneGeometry(1.88,1.02),
    new THREE.MeshBasicMaterial({color:0xeeeeee})
  );
  screen.position.z = .07;
  monitor.add(screen);

  const stand = new THREE.Mesh(
    new THREE.BoxGeometry(.12,.48,.12),
    new THREE.MeshStandardMaterial({color:0x111111})
  );
  stand.position.set(0,-.83,.0);
  monitor.add(stand);

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(.65,.06,.4),
    new THREE.MeshStandardMaterial({color:0x111111})
  );
  base.position.set(0,-1.06,.02);
  monitor.add(base);

  scene.add(monitor);

  // Mała „przeglądarka” na ekranie.
  // To jest lokalna imitacja Google — nie próbujemy ładować Google
  // jako tekstury WebGL.
  desktopGroup = new THREE.Group();
  desktopGroup.position.set(0,1.72,-1.07);

  const white = new THREE.MeshBasicMaterial({color:0xffffff});
  const barMat = new THREE.MeshBasicMaterial({color:0xf1f3f4});
  const blue = new THREE.MeshBasicMaterial({color:0x4285f4});

  // Pasek adresu
  const bar = new THREE.Mesh(new THREE.PlaneGeometry(1.58,.16), barMat);
  bar.position.set(0,.27,.001);
  desktopGroup.add(bar);

  // Logo
  const logoCanvas = document.createElement("canvas");
  logoCanvas.width = 900;
  logoCanvas.height = 300;
  const ctx = logoCanvas.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,900,300);
  ctx.font="bold 150px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="#4285F4"; ctx.fillText("G",450,150);

  const logoTex = new THREE.CanvasTexture(logoCanvas);
  const logo = new THREE.Mesh(
    new THREE.PlaneGeometry(.48,.16),
    new THREE.MeshBasicMaterial({map:logoTex,transparent:true})
  );
  logo.position.set(0,.05,.001);
  desktopGroup.add(logo);

  // Pole wyszukiwania
  const search = new THREE.Mesh(
    new THREE.PlaneGeometry(1.05,.16),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  search.position.set(0,-.18,.002);
  desktopGroup.add(search);

  // Przycisk
  const button = new THREE.Mesh(
    new THREE.PlaneGeometry(.32,.13),
    blue
  );
  button.position.set(0,-.43,.003);
  button.userData.clickable = true;
  desktopGroup.add(button);

  scene.add(desktopGroup);

  // VR renderer
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Oficjalny przycisk WebXR
  const vrButton = VRButton.createButton(renderer);
  vrButton.style.display = "none";
  document.body.appendChild(vrButton);

  document.getElementById("vr").onclick = async () => {
    if (!navigator.xr) {
      alert("Ta przeglądarka nie udostępnia WebXR. Otwórz stronę w przeglądarce Meta Quest.");
      return;
    }
    try {
      const supported = await navigator.xr.isSessionSupported("immersive-vr");
      if (!supported) {
        alert("Immersive VR nie jest dostępne w tej przeglądarce.");
        return;
      }
      vrButton.click();
    } catch(e) {
      alert("Nie udało się uruchomić VR: " + e.message);
    }
  };

  // Ręce jako proste modele kontrolerów.
  leftHand = makeHand(0x4ea1ff);
  rightHand = makeHand(0xff6b6b);
  scene.add(leftHand);
  scene.add(rightHand);

  renderer.xr.addEventListener("sessionstart", () => {
    document.getElementById("info").style.display="none";
    document.getElementById("vr").style.display="none";
  });

  renderer.xr.addEventListener("sessionend", () => {
    document.getElementById("info").style.display="block";
    document.getElementById("vr").style.display="block";
  });

  // Zwykły tryb myszką też działa.
  addEventListener("resize", onResize);
  addEventListener("pointermove", onPointerMove);
  addEventListener("pointerdown", onPointerDown);
}

function makeHand(color) {
  const group = new THREE.Group();

  const palm = new THREE.Mesh(
    new THREE.BoxGeometry(.12,.16,.06),
    new THREE.MeshStandardMaterial({color,roughness:.5})
  );
  group.add(palm);

  const fingerMat = new THREE.MeshStandardMaterial({color,roughness:.5});
  for(let i=0;i<4;i++) {
    const finger = new THREE.Mesh(
      new THREE.BoxGeometry(.025,.11,.035),
      fingerMat
    );
    finger.position.set((i-1.5)*.032,.105,0);
    group.add(finger);
  }

  const thumb = new THREE.Mesh(
    new THREE.BoxGeometry(.03,.09,.035),
    fingerMat
  );
  thumb.rotation.z = -.65;
  thumb.position.set(.085,.015,0);
  group.add(thumb);

  return group;
}

function updateHands() {
  const xr = renderer.xr;
  if (!xr.isPresenting) return;

  const session = xr.getSession();
  if (!session) return;

  // WebXR controller 0/1
  for (let i=0;i<2;i++) {
    const input = session.inputSources[i];
    const hand = i===0 ? leftHand : rightHand;
    if (!input || !input.gripSpace) {
      hand.visible=false;
      continue;
    }

    const frame = renderer.xr.getFrame();
    const ref = renderer.xr.getReferenceSpace();
    const pose = frame && ref ? frame.getPose(input.gripSpace,ref) : null;

    if (!pose) {
      hand.visible=false;
      continue;
    }

    hand.visible=true;
    hand.position.set(
      pose.transform.position.x,
      pose.transform.position.y,
      pose.transform.position.z
    );

    hand.quaternion.copy(pose.transform.orientation);
  }
}

function updateInteractiveObjects() {
  // Delikatne „życie” ekranu
  if (screen) {
    screen.material.color.setHex(0xffffff);
  }
}

function onPointerMove(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(desktopGroup.children,true);
  hovered = hits.length ? hits[0].object : null;
}

function onPointerDown() {
  if (hovered && hovered.userData.clickable) {
    hovered.material.color.setHex(0x34a853);
    setTimeout(()=>hovered.material.color.setHex(0x4285f4),250);
  }
}

function onResize() {
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function animate() {
  renderer.setAnimationLoop(render);
}

function render() {
  updateHands();
  updateInteractiveObjects();

  // Delikatne kołysanie przycisku
  const t = clock.getElapsedTime();
  const b = desktopGroup.children.find(x=>x.userData.clickable);
  if (b) b.scale.setScalar(1 + Math.sin(t*2)*.015);

  renderer.render(scene,camera);
}
</script>
</body>
</html>
