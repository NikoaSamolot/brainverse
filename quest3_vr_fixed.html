<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VR Photo Passthrough</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:system-ui,sans-serif; }
  #xrButton {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    z-index:20; padding:14px 22px; border:0; border-radius:999px;
    background:#fff; color:#111; font-weight:700; font-size:16px;
  }
  #picker {
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #panel {
    pointer-events:auto; width:min(90vw,520px); padding:24px; box-sizing:border-box;
    border-radius:20px; background:rgba(20,20,20,.82); color:white; text-align:center;
    backdrop-filter:blur(12px);
  }
  #panel input { width:100%; margin-top:16px; }
  #panel small { opacity:.75; display:block; margin-top:10px; line-height:1.4; }
  #hint {
    position:fixed; left:50%; top:18px; transform:translateX(-50%);
    z-index:20; color:white; background:rgba(0,0,0,.55); padding:9px 14px;
    border-radius:999px; font-size:13px; display:none;
  }
</style>
</head>
<body>
<button id="xrButton">Uruchom AR Passthrough</button>
<div id="picker">
  <div id="panel">
    <h2>Zdjęcie w przestrzeni</h2>
    <div>Wybierz zdjęcie z galerii urządzenia.</div>
    <input id="file" type="file" accept="image/*">
    <small>Po wejściu do AR: szczypanie dwoma kontrolerami/dłońmi skaluje, przeciąganie jedną ręką przesuwa.</small>
  </div>
</div>
<div id="hint">Jedna ręka: przesuń • Dwie ręce: skaluj • Puść, aby zatwierdzić</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/webxr/ARButton.js';

let renderer, scene, camera, mesh, texture;
let controller1, controller2;
let dragging = false;
let dragStart = new THREE.Vector2();
let startPos = new THREE.Vector3();
let startScale = 1;
let pinchStart = null;

const picker = document.getElementById('picker');
const fileInput = document.getElementById('file');
const xrButton = document.getElementById('xrButton');
const hint = document.getElementById('hint');

fileInput.addEventListener('change', async () => {
  const file = fileInput.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    texture?.dispose();
    texture = new THREE.Texture(img);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.needsUpdate = true;

    const aspect = img.naturalWidth / img.naturalHeight;
    const h = 1.0;
    const w = h * aspect;

    if (!mesh) {
      mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        })
      );
      mesh.position.set(0, 0, -2);
      scene.add(mesh);
    } else {
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
      mesh.material.map = texture;
      mesh.material.needsUpdate = true;
    }
    URL.revokeObjectURL(url);
    picker.style.display = 'none';
    hint.style.display = 'block';
  };
  img.src = url;
});

function setup() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .01, 100);
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // WebXR passthrough supplies the real-world background in immersive-ar.
  const ar = ARButton.createButton(renderer, {
    requiredFeatures: ['local-floor'],
    optionalFeatures: ['hand-tracking']
  });
  ar.style.display = 'none';
  document.body.appendChild(ar);

  xrButton.onclick = () => ar.click();

  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  scene.add(controller1, controller2);

  renderer.setAnimationLoop(render);
}

function screenToWorld(dx, dy) {
  const dist = Math.max(.25, -mesh.position.z);
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const worldH = 2 * Math.tan(vFov/2) * dist;
  return new THREE.Vector3(
    dx / innerHeight * worldH * camera.aspect,
    -dy / innerHeight * worldH,
    0
  );
}

function pointerDown(e) {
  if (!mesh) return;
  dragging = true;
  dragStart.set(e.clientX, e.clientY);
  startPos.copy(mesh.position);
}
function pointerMove(e) {
  if (!dragging || !mesh) return;
  const d = screenToWorld(e.clientX-dragStart.x, e.clientY-dragStart.y);
  mesh.position.copy(startPos).add(d);
}
function pointerUp() { dragging = false; pinchStart = null; }

renderer = null;
setup();

renderer.domElement.addEventListener('pointerdown', pointerDown);
renderer.domElement.addEventListener('pointermove', pointerMove);
renderer.domElement.addEventListener('pointerup', pointerUp);
renderer.domElement.addEventListener('pointercancel', pointerUp);

renderer.domElement.addEventListener('wheel', e => {
  if (!mesh) return;
  const factor = Math.exp(-e.deltaY * 0.001);
  mesh.scale.multiplyScalar(factor);
});

function render() {
  // If two XR input sources/controllers are active, use their distance for scaling.
  if (mesh && controller1 && controller2) {
    const a = controller1.position, b = controller2.position;
    const d = a.distanceTo(b);
    if (d > 0.05 && renderer.xr.isPresenting) {
      if (pinchStart === null) {
        pinchStart = d;
        startScale = mesh.scale.x;
      } else {
        const s = THREE.MathUtils.clamp(startScale * d / pinchStart, 0.05, 50);
        mesh.scale.setScalar(s);
      }
    }
  }
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  if (!renderer) return;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
